<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0d0f">
<title>בדק — בדיקת רכב לפני קנייה</title>
<meta name="description" content="ניהול בדיקת רכב לצרכי קנייה ומכירה לפי הוראת נוהל 127">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{
  --gold:#c9a227; --gold-soft:#e6c85c;
  --bg:#0d0d0f; --bg2:#151518; --card:#17171b; --line:#2a2a31;
  --tx:#f2f2f4; --tx2:#a0a0ab; --tx3:#6c6c78;
  --ok:#3f9d5a; --bad:#d1483f; --warn:#d99a2b; --info:#3b7dd8;
  --r:14px; --pad:16px;
  --font:"Assistant","Heebo","Segoe UI",system-ui,-apple-system,"Noto Sans Hebrew",sans-serif;
}
[data-theme="blue"]{--gold:#4a90d9;--gold-soft:#7fb4ec;--bg:#0b1220;--bg2:#111b2e;--card:#131f35;--line:#24344f;}
[data-theme="green"]{--gold:#3fa66a;--gold-soft:#6fce97;--bg:#0a1310;--bg2:#0f1d17;--card:#12211b;--line:#20372c;}
[data-theme="steel"]{--gold:#8f9bb3;--gold-soft:#b9c3d6;--bg:#101114;--bg2:#181a1f;--card:#1b1d23;--line:#2d3038;}
[data-theme="rust"]{--gold:#c96f3f;--gold-soft:#e39366;--bg:#130f0d;--bg2:#1d1714;--card:#211a16;--line:#3a2c24;}

[data-mode="light"]{
  --bg:#f4f4f6; --bg2:#ffffff; --card:#ffffff; --line:#dcdce2;
  --tx:#16161a; --tx2:#5b5b66; --tx3:#8a8a95;
}
[data-mode="light"][data-theme="black"]{--gold:#8a6f10;--gold-soft:#a8891f;}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--tx);font-family:var(--font);font-size:16px;line-height:1.5}
body{padding-bottom:env(safe-area-inset-bottom)}
[dir="ltr"] body{text-align:left}
button,input,select,textarea{font-family:inherit;font-size:16px;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:var(--gold-soft)}
a.btn{text-decoration:none}

/* ---------- layout ---------- */
.wrap{max-width:760px;margin:0 auto;padding:0 var(--pad) 90px}
.topbar{position:sticky;top:0;z-index:40;background:var(--bg);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:10px;padding:12px var(--pad);max-width:760px;margin:0 auto}
.topbar h1{font-size:18px;margin:0;flex:1;font-weight:700;letter-spacing:-.2px}
.iconbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--bg2);
  display:grid;place-items:center;font-size:17px;color:var(--tx2);flex:none}
.iconbtn:active{background:var(--card)}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:var(--pad);margin:12px 0}
.card.tight{padding:12px}
.muted{color:var(--tx2);font-size:14px}
.tiny{color:var(--tx3);font-size:12.5px}
.sec{font-size:12.5px;letter-spacing:.08em;color:var(--tx3);text-transform:uppercase;margin:22px 0 8px}

/* ---------- buttons ---------- */
.btn{display:block;width:100%;padding:14px 16px;border-radius:12px;background:var(--bg2);
  border:1px solid var(--line);color:var(--tx);font-weight:600;text-align:center;margin:8px 0}
.btn:active{transform:scale(.985)}
.btn.primary{border:1.5px solid var(--gold);color:var(--gold-soft);background:transparent}
.btn.solid{background:var(--gold);color:#0d0d0f;border-color:var(--gold);font-weight:700}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.sm{width:auto;display:inline-block;padding:9px 14px;font-size:14px;margin:4px 4px 4px 0}
.row{display:flex;gap:8px}
.row>*{flex:1}

/* ---------- home ---------- */
.hero{padding:26px 0 6px}
.hero .mark{font-size:34px;font-weight:800;letter-spacing:-1px;color:var(--gold)}
.hero .sub{color:var(--tx2);font-size:14px;margin-top:2px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px 16px;text-align:start;
  display:flex;flex-direction:column;gap:6px;min-height:104px;justify-content:flex-end}
.tile .ic{font-size:24px;line-height:1}
.tile .t{font-weight:700;font-size:16px}
.tile .d{font-size:12.5px;color:var(--tx3)}
.tile.wide{grid-column:1/-1;min-height:auto;flex-direction:row;align-items:center;gap:12px;justify-content:flex-start}
.tile.go{border-color:var(--gold)}
.tile.go .t{color:var(--gold-soft)}

/* ---------- fields ---------- */
.f{margin:14px 0}
.f>label{display:block;font-size:13.5px;color:var(--tx2);margin-bottom:6px;font-weight:600}
.f input,.f select,.f textarea{width:100%;padding:12px;border-radius:10px;background:var(--bg2);
  border:1px solid var(--line);color:var(--tx)}
.f input:focus,.f select,.f textarea:focus{outline:2px solid var(--gold);outline-offset:1px}
.f textarea{min-height:88px;resize:vertical}
.f .hint{font-size:12px;color:var(--tx3);margin-top:4px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chk{display:flex;align-items:center;gap:10px;padding:10px 0}
.chk input{width:22px;height:22px;accent-color:var(--gold);flex:none}

/* dual field: license vs actual */
.dual{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--bg2)}
.dual .lbl{font-size:13.5px;font-weight:700;margin-bottom:8px}
.dual .pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dual .pair label{font-size:11.5px;color:var(--tx3);display:block;margin-bottom:4px}
.dual input{width:100%;padding:10px;border-radius:9px;background:var(--card);border:1px solid var(--line);color:var(--tx)}
@media(max-width:430px){.dual .pair{grid-template-columns:1fr}}
.dual.mismatch{border-color:var(--bad)}
.dual .flag{margin-top:8px;font-size:12.5px;color:var(--bad);font-weight:600}
.dual.blocked{border-color:var(--bad);background:rgba(209,72,63,.07)}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 0;position:sticky;top:62px;background:var(--bg);z-index:30;
  border-bottom:1px solid var(--line);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:8px 13px;border-radius:20px;border:1px solid var(--line);background:var(--bg2);
  font-size:13.5px;color:var(--tx2);white-space:nowrap}
.tab.on{border-color:var(--gold);color:var(--gold-soft);background:transparent;font-weight:700}
.tab .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--bad);margin-inline-start:5px;vertical-align:middle}

/* ---------- defects ---------- */
.sysrow{border:1px solid var(--line);border-radius:12px;margin:8px 0;background:var(--card);overflow:hidden}
.sysrow>.head{display:flex;align-items:center;gap:10px;padding:13px 14px;width:100%;text-align:start}
.sysrow .num{font-size:11.5px;color:var(--tx3);min-width:20px;font-variant-numeric:tabular-nums}
.sysrow .nm{flex:1;font-weight:600;font-size:15px}
.pill{font-size:11.5px;padding:3px 9px;border-radius:20px;border:1px solid var(--line);color:var(--tx3);white-space:nowrap}
.pill.ok{color:var(--ok);border-color:var(--ok)}
.pill.bad{color:var(--bad);border-color:var(--bad)}
.pill.na{color:var(--tx3)}
.pill.rec{color:var(--info);border-color:var(--info)}
.sysrow.isbad{border-color:var(--bad)}
.sysrow.safety{border-color:var(--bad);box-shadow:inset 0 0 0 1px var(--bad)}
.sysbody{border-top:1px solid var(--line);padding:14px;background:var(--bg2)}
.statepick{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
.statepick button{padding:9px 4px;border-radius:9px;border:1px solid var(--line);font-size:12.5px;color:var(--tx2);background:var(--card)}
.statepick button.on{border-color:var(--gold);color:var(--gold-soft);font-weight:700}
.dsearch{width:100%;padding:11px;border-radius:10px;background:var(--card);border:1px solid var(--line);color:var(--tx);margin-bottom:8px}
.dlist{max-height:270px;overflow-y:auto;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.ditem{display:flex;align-items:flex-start;gap:9px;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.ditem:last-child{border-bottom:none}
.ditem input{margin-top:3px;width:18px;height:18px;accent-color:var(--gold);flex:none}
.ditem.on{background:rgba(201,162,39,.09)}
.ditem span{font-size:14px}
.dgroup{padding:7px 12px;font-size:11.5px;letter-spacing:.06em;color:var(--tx3);background:var(--bg2);
  border-bottom:1px solid var(--line);position:sticky;top:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:5px 10px;border-radius:20px;
  border:1px solid var(--gold);color:var(--gold-soft)}
.chip b{cursor:pointer;color:var(--tx3);font-weight:400}

/* photos */
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;margin-top:10px}
.ph{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--bg2)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .x{position:absolute;top:3px;inset-inline-end:3px;width:24px;height:24px;border-radius:50%;
  background:rgba(0,0,0,.65);color:#fff;font-size:14px;display:grid;place-items:center}
.ph.add{display:grid;place-items:center;border-style:dashed;color:var(--tx3);font-size:22px}
.ph .cap{position:absolute;bottom:0;inset-inline:0;background:rgba(0,0,0,.6);color:#fff;font-size:9.5px;padding:2px 4px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* misc */
.alert{border-radius:12px;padding:12px 14px;font-size:13.5px;margin:10px 0;border:1px solid}
.alert.bad{border-color:var(--bad);background:rgba(209,72,63,.08);color:#ff9c94}
.alert.warn{border-color:var(--warn);background:rgba(217,154,43,.08);color:#f0c274}
.alert.ok{border-color:var(--ok);background:rgba(63,157,90,.08);color:#8fdca6}
.alert.info{border-color:var(--info);background:rgba(59,125,216,.08);color:#9dc3f5}
[data-mode="light"] .alert.bad{color:#9c2f27}
[data-mode="light"] .alert.warn{color:#8a6113}
[data-mode="light"] .alert.ok{color:#256b3a}
[data-mode="light"] .alert.info{color:#1e5199}

.list .it{display:flex;align-items:center;gap:12px;padding:13px 14px;border:1px solid var(--line);
  border-radius:12px;margin:8px 0;background:var(--card);text-align:start;width:100%}
.list .it .main{flex:1;min-width:0}
.list .it .t{font-weight:600;font-size:15px}
.list .it .d{font-size:12.5px;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.empty{text-align:center;padding:44px 20px;color:var(--tx3)}
.empty .ic{font-size:38px;opacity:.5;margin-bottom:10px}

.sheet{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.6);display:flex;align-items:flex-end}
.sheet .inner{background:var(--bg2);border-radius:18px 18px 0 0;width:100%;max-width:760px;margin:0 auto;
  max-height:90vh;overflow-y:auto;padding:18px var(--pad) 28px;border-top:1px solid var(--line)}
.sheet h3{margin:0 0 12px;font-size:17px}

.sig{border:1px dashed var(--line);border-radius:10px;background:var(--bg2);touch-action:none;width:100%;height:150px;display:block}

.kv-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv-row:last-child{border:none}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat .b{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.stat .b .n{font-size:26px;font-weight:800;color:var(--gold-soft);font-variant-numeric:tabular-nums}
.stat .b .l{font-size:12.5px;color:var(--tx3)}

.toast{position:fixed;bottom:22px;inset-inline:0;margin:0 auto;width:max-content;max-width:88%;
  background:var(--card);border:1px solid var(--gold);color:var(--tx);padding:11px 18px;border-radius:24px;
  z-index:200;font-size:14px;box-shadow:0 8px 26px rgba(0,0,0,.4)}

.undo{position:fixed;bottom:22px;inset-inline:0;margin:0 auto;width:max-content;max-width:92%;z-index:210;
  display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--gold);color:var(--tx);
  padding:9px 10px 9px 16px;border-radius:24px;font-size:14px;box-shadow:0 8px 26px rgba(0,0,0,.4)}
[dir="rtl"] .undo{padding:9px 16px 9px 10px}
.undo button{border:1px solid var(--gold);color:var(--gold-soft);border-radius:18px;padding:6px 14px;font-weight:700}
body.tabs-on .undo{bottom:calc(78px + env(safe-area-inset-bottom))}
.toast.above{bottom:84px}
body.tabs-on .toast.above{bottom:calc(140px + env(safe-area-inset-bottom))}
body.away #app{filter:blur(16px)}
.spin{width:18px;height:18px;border:2px solid var(--line);border-top-color:var(--gold);border-radius:50%;
  animation:sp .7s linear infinite;display:inline-block;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
.fade{animation:fd .18s ease}
@keyframes fd{from{opacity:0;transform:translateY(5px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- bottom navigation ---------- */
.nav{position:fixed;bottom:0;inset-inline:0;z-index:50;max-width:760px;margin:0 auto;background:var(--bg2);
  border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);
  padding-bottom:env(safe-area-inset-bottom)}
.nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:58px;
  padding:7px 2px;color:var(--tx3);font-size:11.5px;line-height:1.2}
.nav button .ni{font-size:19px;line-height:1.1}
.nav button.on{color:var(--gold-soft);font-weight:700}
.nav button:focus-visible,.backbtn:focus-visible{outline:2px solid var(--gold);outline-offset:-2px}
body.tabs-on .wrap{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
body.tabs-on .toast{bottom:calc(78px + env(safe-area-inset-bottom))}
.backbtn{flex:none;max-width:44%;height:38px;padding:0 12px;border-radius:10px;border:1px solid var(--gold);
  color:var(--gold-soft);font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}

/* ---------- print ---------- */
#printarea{display:none}
@media print{
  body>*{display:none!important}
  #printarea{display:block!important;color:#000;background:#fff;font-size:10.5pt}
  @page{size:A4;margin:12mm}
}
#printarea .pform{font-family:var(--font)}
#printarea table{width:100%;border-collapse:collapse;margin-top:6px}
#printarea th,#printarea td{border:1px solid #000;padding:3px 5px;font-size:9pt;vertical-align:top}
#printarea th{background:#e8e8e8;font-size:8.5pt}
#printarea h2{font-size:13pt;margin:0 0 4px;text-align:center}
#printarea .banner{border:2px solid #000;padding:5px;text-align:center;font-weight:bold;font-size:11pt;margin-bottom:8px}
#printarea .draft{color:#b00;border-color:#b00}
#printarea .kv{font-size:9pt;line-height:1.7}
#printarea .notes{font-size:7.5pt;line-height:1.35;margin-top:8px}
#printarea .sigrow{display:flex;gap:14px;margin-top:14px;font-size:9pt}
#printarea .sigrow>div{flex:1;text-align:center}
#printarea .sigrow img{max-width:100%;height:52px;object-fit:contain;border-bottom:1px solid #000;display:block}
#printarea .pagebreak{page-break-before:always}
#printarea .pgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#printarea .pgrid figure{margin:0}
#printarea .pgrid img{width:100%;border:1px solid #000}
#printarea .pgrid figcaption{font-size:8pt;padding-top:2px}
#printarea .safety{border:2px solid #b00;color:#b00;padding:6px;font-weight:bold;margin:8px 0;font-size:10pt}
</style>
</head>
<body data-theme="black" data-mode="dark">
<div id="app"></div>
<div id="printarea"></div>
<input type="file" id="picker" accept="image/*" capture="environment" hidden>
<script>
/* יומן שגיאות — 10 האחרונות נשמרות במכשיר ומוצגות במסך האבחון */
(function(){var KEY="bdk_errlog";
  function add(m,src,ln){try{var a=JSON.parse(localStorage.getItem(KEY)||"[]");
    a.unshift({t:new Date().toISOString(),m:String(m).slice(0,220),s:String(src||"").split("/").pop().split("?")[0],l:ln||0});
    localStorage.setItem(KEY,JSON.stringify(a.slice(0,10)))}catch(e){}}
  window.addEventListener("error",function(e){add(e.message,e.filename,e.lineno)});
  window.addEventListener("unhandledrejection",function(e){add("promise: "+((e.reason&&e.reason.message)||e.reason))});
})();
/* =====================================================================
   בדק — נתוני נוהל 127 (נספח 5): נוסח האבחנות המחייב
   הטקסטים כאן הם לשון משרד התחבורה ואין לשנותם.
   ===================================================================== */
const D = {

g_mustnote:["סעיף ה.4 לנוהל מחייב צילום רישיון הרכב המקורי ותעודה מזהה של מביא הרכב.","Section E.4 of the procedure requires a photo of the original vehicle licence and an ID of the person bringing the vehicle.","البند هـ.4 يُلزم بتصوير رخصة المركبة الأصلية وهوية مُحضر المركبة.","Пункт Е.4 требует фото оригинала лицензии ТС и удостоверения того, кто привёз автомобиль.","El apartado E.4 exige foto del permiso original y de un documento de quien trae el vehículo."],
g_lic:["רישיון רכב","Vehicle licence","رخصة المركبة","Лицензия ТС","Permiso del vehículo"],
g_id:["תעודה מזהה","ID document","وثيقة هوية","Удостоверение","Documento de identidad"],
g_need:["בלי שני הצילומים והחתימה אי אפשר להמשיך.","You cannot continue without both photos and the signature.","لا يمكن المتابعة دون الصورتين والتوقيع.","Без двух фото и подписи продолжить нельзя.","No se puede continuar sin las dos fotos y la firma."],
decl_he:["","The declaration is signed in its binding Hebrew wording.","يُوقَّع الإقرار بصيغته العبرية الملزمة.","Заявление подписывается в обязательной редакции на иврите.","La declaración se firma en su redacción vinculante en hebreo."],
official_he:["","Row names, findings and the printed form stay in Hebrew — the wording required by the Ministry of Transport.","أسماء البنود والتشخيصات والنموذج المطبوع تبقى بالعبرية — الصيغة التي تفرضها وزارة المواصلات.","Названия пунктов, диагнозы и печатная форма остаются на иврите — так требует Минтранс.","Los apartados, diagnósticos y el formulario impreso siguen en hebreo: es la redacción que exige el Ministerio."],
gd1t:["בדיקה מתחילה במספר רכב","An inspection starts with the plate number","الفحص يبدأ برقم اللوحة","Проверка начинается с номера","La inspección empieza por la matrícula"],
gd1d:["הזן מספר ולחץ שליפה — תוצר, דגם, שנה, שלדה, צבע ומידות צמיגים נטענים ממשרד התחבורה, יחד עם הק״מ מהטסט האחרון, בעלויות, ריקולים ושינוי מבנה.","Enter the number and tap fetch — make, model, year, VIN, colour and tyre sizes load from the Ministry of Transport, with the last test odometer, owners, recalls and structural changes.","أدخل الرقم واضغط جلب — الصانع والطراز والسنة والهيكل واللون ومقاسات الإطارات تُحمَّل من وزارة المواصلات مع عداد آخر فحص والملاك والاستدعاءات.","Введите номер и нажмите запрос — марка, модель, год, VIN, цвет и шины загрузятся из Минтранса вместе с пробегом, владельцами и отзывами.","Introduce el número y pulsa consultar: marca, modelo, año, bastidor, color y neumáticos se cargan del Ministerio, con kilometraje, titulares y llamadas a revisión."],
gd2t:["רשום ברישיון מול נמצא בפועל","On the licence versus actually found","المسجل في الرخصة مقابل الواقع","По документу и фактически","Según permiso frente a lo real"],
gd2d:["שדות הזיהוי כפולים. אי-התאמה במספר שלדה עוצרת את הבדיקה; אי-התאמה בצבע, בצמיגים או במספר מנוע נרשמת לבד בהערות הכלליות.","Identification fields are double. A VIN mismatch stops the inspection; a colour, tyre or engine-number mismatch is recorded automatically in the general remarks.","حقول التعريف مزدوجة. عدم تطابق رقم الهيكل يوقف الفحص؛ عدم تطابق اللون أو الإطارات أو رقم المحرك يُسجَّل تلقائياً في الملاحظات.","Поля идентификации двойные. Несовпадение VIN останавливает проверку; цвет, шины или номер двигателя попадают в примечания автоматически.","Los campos de identificación son dobles. Una discrepancia de bastidor detiene la inspección; color, neumáticos o número de motor se anotan solos en observaciones."],
gd3t:["ליקויים בלשון הנוהל","Defects in the procedure's wording","الأعطال بصيغة الإجراء","Дефекты в формулировках регламента","Defectos con la redacción oficial"],
gd3d:["כל אבחנה נבחרת מרשימת נספח 5 בניסוח המחייב. אפשר להוסיף הערת בוחן חופשית וצילומים — הם נדפסים בנספח נפרד, לא בטופס האחיד.","Each finding is chosen from the Annex 5 list in its binding wording. You can add free inspector notes and photos — they print in a separate annex, not on the uniform form.","كل تشخيص يُختار من قائمة الملحق 5 بصيغته الملزمة. يمكن إضافة ملاحظات وصور — تُطبع في ملحق منفصل.","Каждый диагноз выбирается из списка Приложения 5. Заметки и фото можно добавить — они печатаются в отдельном приложении.","Cada diagnóstico se elige de la lista del Anexo 5. Puedes añadir notas y fotos: se imprimen en un anexo aparte."],
gd4t:["הרשימות בשליטתך","The lists are yours to edit","القوائم تحت تحكمك","Списки можно менять","Las listas son tuyas"],
gd4d:["עוד ← הגדרות ← עריכת רשימות ליקויים: העבר אבחנה לסעיף אחר, שנה סדר, הוסף אבחנות משלך, וקבע מה נכלל בבדיקת מנוע או שילדה בלבד.","More → Settings → Edit finding lists: move a finding to another row, reorder, add your own, and set what an engine-only or body-only inspection includes.","المزيد ← الإعدادات ← تعديل القوائم: انقل تشخيصاً لبند آخر، غيّر الترتيب، أضف تشخيصاتك، وحدّد ما يشمله فحص المحرك أو الهيكل فقط.","Ещё → Настройки → Редактор списков: переносите диагнозы, меняйте порядок, добавляйте свои, задавайте состав проверок.","Más → Ajustes → Editar listas: mueve diagnósticos, cambia el orden, añade los tuyos y define qué incluye cada inspección."],
gd5t:["עובד בלי רשת","Works offline","يعمل دون اتصال","Работает без сети","Funciona sin conexión"],
gd5d:["הכול נשמר על המכשיר. בבור אין קליטה — פתח את ההזמנה מראש והנתונים כבר יהיו שמורים. גבה באופן קבוע: הגיבוי המלא כולל גם את הצילומים.","Everything is saved on the device. There is no reception in the pit — open the appointment beforehand and the data will already be there. Back up regularly: the full backup includes the photos.","كل شيء يُحفظ على الجهاز. لا تغطية في الحفرة — افتح الموعد مسبقاً. انسخ احتياطياً بانتظام: النسخة الكاملة تشمل الصور.","Всё хранится на устройстве. В яме нет связи — откройте запись заранее. Делайте копии регулярно: полная копия включает фото.","Todo se guarda en el dispositivo. En el foso no hay cobertura: abre la cita antes. Haz copias a menudo: la completa incluye las fotos."],
skip:["דלג","Skip","تخطي","Пропустить","Omitir"],
note_title:["בדיקה בעוד 15 דקות","Inspection in 15 minutes","فحص بعد 15 دقيقة","Проверка через 15 минут","Inspección en 15 minutos"],
v_hint:["הזן מספר ולחץ שליפה — שאר השדות יתמלאו לבד.","Enter the number and tap fetch — the other fields fill in by themselves.","أدخل الرقم واضغط جلب — باقي الحقول تُملأ تلقائياً.","Введите номер и нажмите запрос — остальные поля заполнятся сами.","Introduce el número y pulsa consultar: el resto se rellena solo."],

v_tires:["מידות צמיגים","Tyre sizes","مقاسات الإطارات","Размер шин","Medida de neumáticos"],
v_chhint:["קובע איזו רשימת ליקויי שלדה תיפתח בסעיף השלדה.","Determines which body-defect list opens in the body row.","يحدد أي قائمة أعطال هيكل تُفتح في بند الهيكل.","Определяет, какой список дефектов кузова откроется.","Determina qué lista de defectos de carrocería se abre."],
i_ordhint:["שמו מודפס בטופס כמזמין הבדיקה.","Their name is printed on the form as the person who ordered the inspection.","يُطبع اسمه في النموذج كطالب الفحص.","Его имя печатается в форме как заказчика.","Su nombre se imprime como solicitante."],
i_payhint:["פנימי בלבד — לא מודפס בטופס הסיכום.","Internal only — not printed on the summary form.","داخلي فقط — لا يُطبع في النموذج.","Только для себя — в форму не печатается.","Solo interno: no se imprime en el formulario."],
p_free:["צילומים חופשיים של הבוחן. נדפסים בנספח הממצאים, לא בטופס האחיד.","Free inspector photos. They print in the findings annex, not on the uniform form.","صور حرة للفاحص. تُطبع في ملحق النتائج لا في النموذج الموحد.","Свободные фото инспектора. Печатаются в приложении, не в единой форме.","Fotos libres del inspector. Se imprimen en el anexo, no en el formulario."],
p_auto:["כל צילום נדחס אוטומטית לפני שמירה ונשמר על המכשיר בלבד.","Each photo is compressed before saving and stays on this device only.","كل صورة تُضغط تلقائياً قبل الحفظ وتبقى على الجهاز فقط.","Каждое фото сжимается перед сохранением и остаётся только на устройстве.","Cada foto se comprime antes de guardar y queda solo en el dispositivo."],
d_unlock:["בכל זאת לבדוק סעיף זה","Inspect this row anyway","افحص هذا البند على أي حال","Всё же проверить этот пункт","Inspeccionar este apartado igualmente"],
d_nomatch:["אין התאמה לחיפוש","Nothing matches the search","لا نتائج مطابقة","Ничего не найдено","Nada coincide con la búsqueda"],
d_noteph:["תיאור חופשי — נדפס בנספח הממצאים","Free description — printed in the findings annex","وصف حر — يُطبع في ملحق النتائج","Свободное описание — печатается в приложении","Descripción libre: se imprime en el anexo"],
s_roadnote:["הנוהל מחייב מבחן דרך לפני חתימה על טופס הסיכום.","The procedure requires a road test before the summary form is signed.","الإجراء يُلزم باختبار طريق قبل توقيع النموذج.","Регламент требует тест-драйв до подписания формы.","El procedimiento exige prueba en carretera antes de firmar."],
s_unmarked:["{n} מערכות ללא סימון","{n} systems not marked","{n} أنظمة دون تعليم","Не отмечено систем: {n}","{n} sistemas sin marcar"],

s_m_id:["צילום תעודה מזהה","ID photo","صورة الهوية","Фото удостоверения","Foto del documento"],
s_safety:["נמצאו {n} ליקויים בטיחותיים.","{n} safety defects were found.","تم العثور على {n} أعطال أمان.","Найдено опасных дефектов: {n}.","Se encontraron {n} defectos de seguridad."],
s_safety2:["חובה ליידע את מזמין הבדיקה מיידית ולציין זאת בטופס.","The customer must be informed immediately and it must be noted on the form.","يجب إبلاغ طالب الفحص فوراً وتدوين ذلك في النموذج.","Заказчика нужно уведомить немедленно и отметить это в форме.","Hay que informar al cliente de inmediato y anotarlo en el formulario."],
s_score:["ציון פנימי (לא בטופס)","Internal score (not on the form)","تقييم داخلي (ليس في النموذج)","Внутренняя оценка (не в форме)","Puntuación interna (no en el formulario)"],
s_allok:["כל הפרטים הנדרשים מולאו.","All required details are filled in.","تم تعبئة كل التفاصيل المطلوبة.","Все обязательные данные заполнены.","Todos los datos requeridos están completos."],
s_signnote:["סעיף ה.11 מחייב להחתים את מזמין הבדיקה על הממצאים.","Section E.11 requires the customer to sign the findings.","البند هـ.11 يُلزم بتوقيع طالب الفحص على النتائج.","Пункт Е.11 требует подписи заказчика под результатами.","El apartado E.11 exige que el cliente firme los resultados."],
s_share:["שליחת סיכום ללקוח","Send a summary to the customer","إرسال ملخص للزبون","Отправить итог клиенту","Enviar resumen al cliente"],
s_closed:["בדיקה סגורה — פתח מחדש","Inspection closed — reopen","الفحص مغلق — إعادة فتح","Проверка закрыта — открыть снова","Inspección cerrada: reabrir"],
s_close:["סגירת הבדיקה","Close the inspection","إغلاق الفحص","Закрыть проверку","Cerrar la inspección"],
a_ph:["מספר רכב, שם, תאריך","plate, name, date","رقم اللوحة، الاسم، التاريخ","номер, имя, дата","matrícula, nombre, fecha"],
a_note:["הנוהל מחייב שמירת עותקי טפסים 24 חודשים לפחות. גבה באופן קבוע.","The procedure requires keeping form copies for at least 24 months. Back up regularly.","الإجراء يُلزم بحفظ نسخ النماذج 24 شهراً على الأقل. انسخ احتياطياً بانتظام.","Регламент требует хранить копии форм не менее 24 месяцев. Делайте копии регулярно.","El procedimiento exige conservar copias 24 meses como mínimo. Haz copias a menudo."],
dy_tip:["טיפ: פתח את ההזמנה מראש כדי שנתוני משרד התחבורה יישלפו בזמן שיש רשת — בבור הם כבר יהיו שמורים.","Tip: open the appointment beforehand so registry data is fetched while online — in the pit it will already be saved.","نصيحة: افتح الموعد مسبقاً لجلب بيانات السجل أثناء توفر الشبكة.","Совет: откройте запись заранее, чтобы данные реестра загрузились, пока есть сеть.","Consejo: abre la cita antes para consultar el registro con conexión."],
ds_total:["סה״כ בדיקות","Total inspections","إجمالي الفحوصات","Всего проверок","Inspecciones totales"],

ds_income:["הכנסות החודש","Income this month","دخل هذا الشهر","Доход за месяц","Ingresos del mes"],
ds_top:["הליקויים הנפוצים אצלך","Your most common findings","التشخيصات الأكثر شيوعاً لديك","Ваши частые диагнозы","Tus diagnósticos más frecuentes"],
e_note:["גע בסעיף כדי לפתוח את רשימת האבחנות שלו. אפשר להעביר אבחנה לסעיף אחר, לשנות סדר, למחוק ולהוסיף אבחנות משלך. השינויים נשמרים מיד ומשפיעים על כל בדיקה חדשה.","Tap a row to open its finding list. You can move a finding to another row, reorder, delete and add your own. Changes are saved at once and apply to every new inspection.","اضغط بنداً لفتح قائمة تشخيصاته. يمكن النقل وتغيير الترتيب والحذف والإضافة. التغييرات تُحفظ فوراً وتؤثر على كل فحص جديد.","Нажмите пункт, чтобы открыть его список. Диагнозы можно переносить, сортировать, удалять и добавлять. Изменения сохраняются сразу.","Toca un apartado para abrir su lista. Puedes mover, reordenar, borrar y añadir diagnósticos. Los cambios se guardan al instante."],

st_inst_ok:["פרטי מכון מולאו — הדוח יופק כטופס סיכום.","Centre details are filled in — the report is issued as a summary form.","تم إدخال بيانات المركز — يصدر التقرير كنموذج ملخص.","Данные станции заполнены — отчёт выводится как итоговая форма.","Datos del centro completos: el informe se emite como formulario."],
st_inst_no:["בלי מספר רישיון מפעל הדוח מסומן כטיוטה. הטופס האחיד מחייב לוגו ומספר רישיון של מכון מורשה.","Without a centre licence number the report is marked as a draft. The uniform form requires the logo and licence number of a licensed centre.","دون رقم ترخيص المركز يُعلَّم التقرير كمسودة. النموذج الموحد يتطلب شعار ورقم ترخيص مركز مرخّص.","Без номера лицензии станции отчёт помечается как черновик. Единая форма требует логотип и номер лицензии.","Sin número de licencia el informe se marca como borrador. El formulario exige logotipo y licencia de un centro autorizado."],
st_mo:["משרד התחבורה","Ministry of Transport","وزارة المواصلات","Минтранс","Ministerio de Transporte"],
st_proxy_ph:["ריק = פנייה ישירה","empty = direct request","فارغ = طلب مباشر","пусто = прямой запрос","vacío = consulta directa"],

  const salt=b64(crypto.getRandomValues(new Uint8Array(12)));
  S.pin={h:await pinHash(pin,salt),salt,after:after==null?5:after};store.set("pin",S.pin)}
async function pinCheck(pin){
  const p=S.pin;if(!p)return true;
  if(typeof p==="string"){                      /* קוד מגרסה ישנה — מאמתים ומסבים לגיבוב החדש */
    if(hash(pin)!==p)return false;await pinStore(pin,5);return true}
  return (await pinHash(pin,p.salt))===p.h}
/* מפתח הבינה: מוצפן במנוחה. מפתח ההצפנה אינו ניתן לייצוא ונשמר ב-IndexedDB.
   מגן על המפתח כשהוא שמור — לא מפני קוד זדוני שרץ באותו אתר בזמן השימוש. */
async function vaultKey(){
  let k=await kvGet("vault");
  if(!k){k=await crypto.subtle.generateKey({name:"AES-GCM",length:256},false,["encrypt","decrypt"]);await kvPut("vault",k)}
  return k}
async function encText(t){const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},await vaultKey(),new TextEncoder().encode(t));
  return {iv:b64(iv),ct:b64(ct)}}
async function decText(o){const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:unb64(o.iv)},await vaultKey(),unb64(o.ct));
  return new TextDecoder().decode(pt)}
function saveAi(){const o=Object.assign({},S.ai);if(o.enc)delete o.key;store.set("ai",o)}
async function setAiKey(v){
  S.ai.key=v;S.ai.enc=null;
  if(v&&hasSubtle){try{S.ai.enc=await encText(v)}catch(e){S.ai.enc=null}}
  saveAi()}
async function loadAiKey(){
  const a=S.ai;
  if(a.enc){try{a.key=await decText(a.enc)}catch(e){a.key="";a.enc=null;saveAi()}}
  else if(a.key&&hasSubtle){await setAiKey(a.key)}     /* מפתח גלוי מגרסה ישנה — מוצפן עכשיו */
}

/* compress before storing — a raw phone photo is 4–8 MB */
function compress(file,max=1400,q=.72){return new Promise((res,rej)=>{
  const fr=new FileReader();
  fr.onload=()=>{const im=new Image();
    im.onload=()=>{let{width:w,height:h}=im;const s=Math.min(1,max/Math.max(w,h));
      const c=document.createElement("canvas");c.width=Math.round(w*s);c.height=Math.round(h*s);
      c.getContext("2d").drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",q))};
    im.onerror=rej;im.src=fr.result};
  fr.onerror=rej;fr.readAsDataURL(file)})}

/* חינם: התאמת מילים. Pro: שכבת API עם ספק לבחירת המשתמש. */
function normalize(s){return String(s).replace(/[״"׳'.,()\/]/g," ").replace(/\s+/g," ").trim()}
const STOP=new Set(["של","עם","על","יש","אין","את","לא","כן","זה","היא","הוא","וגם","גם","או","ב","ל","מ","ה"]);
function ruleSuggest(text,pool){
  const words=normalize(text).split(" ").filter(w=>w.length>2&&!STOP.has(w));
  if(!words.length)return [];
  const scored=pool.map(item=>{
    const n=normalize(item);let sc=0;
    for(const w of words){
      if(n.includes(w))sc+=w.length>=4?3:2;
      else{const stem=w.slice(0,Math.max(3,w.length-2));if(stem.length>=3&&n.includes(stem))sc+=1}
    }
    return{item,sc}}).filter(x=>x.sc>0).sort((a,b)=>b.sc-a.sc);
  return scored.slice(0,6).map(x=>x.item);
}
async function aiOnce(model,prompt){
  const a=S.ai, fail=r=>{const e=new Error("HTTP "+r.status);e.status=r.status;return e};

      headers:{"Content-Type":"application/json","x-api-key":a.key,"anthropic-version":"2023-06-01",
        "anthropic-dangerous-direct-browser-access":"true"},
      body:JSON.stringify({model,max_tokens:800,messages:[{role:"user",content:prompt}]})});
    if(!r.ok)throw fail(r);
    const d=await r.json();return (d.content&&d.content[0]&&d.content[0].text)||"";
  }
  if(a.provider==="gemini"){
    const r=await fetch("https://generativelanguage.googleapis.com/v1beta/models/"+encodeURIComponent(model)+":generateContent?key="+encodeURIComponent(a.key),
      {method:"POST",headers:{"Content-Type":"application/json"},
       body:JSON.stringify({contents:[{parts:[{text:prompt}]}],generationConfig:{temperature:.2,maxOutputTokens:800}})});
    if(!r.ok)throw fail(r);
    const d=await r.json();return d?.candidates?.[0]?.content?.parts?.[0]?.text||"";
  }
  /* openai / local (ollama, lm studio) — תואמי OpenAI */

  const d=await r.json();return d?.choices?.[0]?.message?.content||"";
}

async function aiCall(prompt){
  let chain=aiChain(); if(!chain.length)chain=[S.ai.model||""];
  let last;
  for(const m of chain){
    try{const out=await aiOnce(m,prompt);
      if(S.ai.okModel!==m){S.ai.okModel=m;saveAi()}
      return out}
    catch(e){last=e;if(e.status===401||e.status===403)break}
  }
  throw last||new Error("AI");
}
/* הבינה בוחרת מתוך הרשימה הסגורה — לעולם לא מנסחת אבחנה חדשה */
async function aiSuggest(text,pool){
  if(!S.ai.provider||(!S.ai.key&&!S.ai.url))return ruleSuggest(text,pool);
  const numbered=pool.map((x,i)=>(i+1)+". "+x).join("\n");
  const prompt="אתה עוזר לבוחן רכב בישראל. להלן רשימה סגורה וממוספרת של אבחנות מתוך נספח 5 להוראת נוהל 127 של משרד התחבורה.\n\n"+
    numbered+"\n\nתיאור הבוחן: \""+text+"\"\n\nבחר עד 6 מספרים מהרשימה שמתאימים לתיאור, לפי סדר התאמה יורד. "+
    "החזר אך ורק את המספרים מופרדים בפסיקים, בלי טקסט נוסף. אם שום פריט לא מתאים — החזר ריק. "+
    "אל תמציא ניסוח חדש ואל תחזיר פריט שאינו ברשימה.";
  try{
    const out=await aiCall(prompt);
    const idx=(out.match(/\d+/g)||[]).map(n=>parseInt(n)-1).filter(i=>i>=0&&i<pool.length);
    const uniq=[...new Set(idx)].slice(0,6).map(i=>pool[i]);
    return uniq.length?uniq:ruleSuggest(text,pool);
  }catch(e){toast(T('ai_fallback'));return ruleSuggest(text,pool)}
}

function defaultMap(){
  const m={full:{},basic:{}};
  [["full",FORM_FULL],["basic",FORM_BASIC]].forEach(([k,F])=>F.forEach(row=>{
    const def=(ROWMAP[k]||{})[row.n]||{flat:[]};
    if(def.chassis)m[k][row.n]={type:"chassis",body:cp(D.chassis.body),separate:cp(D.chassis.separate)};
    else if(def.groups)m[k][row.n]={type:"groups",groups:cp(def.groups)};
    else m[k][row.n]={type:"flat",items:[...new Set(def.flat)]};
  }));
  return m;
}
/* אילו סעיפים נבדקים בבדיקת מנוע/שילדה בלבד (על גבי הטופס המלא) */
const SCOPE_DEF={engine:[1,2,3,4,5,6,7,8,9,20,24,25],chassis:[22,25]};

function formKey(){return (S.cur&&S.cur.kind==="basic")?"basic":"full"}
function form(){return formKey()==="basic"?FORM_BASIC:FORM_FULL}
function limited(rec){const k=(rec||S.cur||{}).kind;return k==="engine"||k==="chassis"?k:null}
function inScope(rec,n){const l=limited(rec);return !l||(S.scope[l]||[]).includes(n)}
function nsText(rec){const l=limited(rec);return l?T(l==="engine"?"ns_engine":"ns_chassis"):T("st_ns")}
function applyScope(rec){
  const l=limited(rec); if(!l)return;
  form().forEach(row=>{const d=dget(rec,row.n);
    if(!inScope(rec,row.n)){d.st="ns";d.items=[];d.safety=false}
    else if(d.st==="ns")d.st="";
  });
}
function mapEntry(row){const m=(S.map&&S.map[formKey()])||{};return m[row.n]||{type:"flat",items:[]}}
function poolFor(row,rec){
  const e=mapEntry(row);
  if(e.type==="chassis"){const c=e[(rec||S.cur).veh.chassis==="separate"?"separate":"body"]||{};
    return{grouped:{"משמעות גבוהה":c.high||[],"משמעות נמוכה":c.low||[],"ליקויים שוליים":c.minor||[]}}}
  if(e.type==="groups")return{grouped:e.groups||{}};
  return{flat:e.items||[]}
}
function flatPool(row,rec){const p=poolFor(row,rec);return p.flat?p.flat:Object.values(p.grouped).flat()}
function dget(rec,n){if(!rec.defects[n])rec.defects[n]={st:"",items:[],notes:"",safety:false,photos:[]};return rec.defects[n]}
function saveCur(){if(!S.cur)return;S.cur.updated=Date.now();
  const i=S.recs.findIndex(r=>r.id===S.cur.id);
  if(i<0)S.recs.unshift(S.cur);else S.recs[i]=S.cur; persist()}
function counts(rec){let ok=0,bad=0,na=0,rec_=0,ns=0,safety=0,done=0,total=0;
  form().forEach(row=>{if(row.notesonly)return;const d=rec.defects[row.n];
    if(d&&d.st==="ns"){ns++;return}
    total++; if(!d||!d.st)return; done++;
    if(d.st==="ok")ok++;else if(d.st==="bad"){bad++;if(d.safety)safety++}else if(d.st==="na")na++;else rec_++});
  return{ok,bad,na,rec:rec_,ns,safety,done,total}}
function score(rec){const c=counts(rec);if(!c.done)return null;
  return Math.max(0,Math.min(100,Math.round(100-c.bad*6-c.safety*10)))}

/* חמש לשוניות קבועות בסרגל התחתון; כל מסך אחר הוא "מסך פנימי" שזוכר מאיפה הגיעו אליו. */
const TABSCR=["home","diary","archive","dash","more"];
const isTab=x=>TABSCR.includes(x);
let navStack=[];
function go(scr,arg,opt){
  if(scr==="rec"&&arg)S.cur=arg;
  if(isTab(scr))navStack=[];
  else if(!(opt&&opt.replace)&&S.screen!==scr)navStack.push(S.screen);
  S.screen=scr;window.scrollTo(0,0);render();syncHistory()}
function home(){S.cur=null;S.tab=0;go("home")}
function goBack(){
  const prev=navStack.pop()||"home";
  if(S.screen==="rec"){openRow=null;dq="";S.cur=null;S.tab=0}
  S.screen=prev;if(isTab(prev))navStack=[];
  window.scrollTo(0,0);render()}
function scrName(x){return x==="rec"?((S.cur&&S.cur.veh.plate)||T('newins')):x==="gate"?T('newins'):
  x==="editor"?T('editlists'):T(x)}

/* צעד אחד אחורה — אותה פונקציה לכפתור שעל המסך ולכפתור החזרה של הטלפון.
   מחזירה false רק בדף הבית, כשאין מה לסגור. */
function stepBack(){
  if(S.locked)return true;                                   /* מסך נעילה לא נעקף */
  if($("#sheet")){closeSheet();return true}                  /* חלון פתוח — נסגר */
  if(!S.seen){S.seen=true;store.set("seen",true);render();return true}   /* מדריך — דילוג */
  if(!isTab(S.screen)){goBack();return true}                 /* מסך פנימי — למסך שממנו הגיעו */
  if(S.screen!=="home"){S.screen="home";navStack=[];window.scrollTo(0,0);render();return true}
  return false}

/* רשומת "שומר" אחת בהיסטוריה. כרום מדלג על רשומה שנוספה בלי מגע של המשתמש,
   ולכן היא נוספת רק אחרי המגע הראשון במסך. */
const hist={guard:false,armed:false};let exitArm=0;
function syncHistory(){
  if(!hist.armed||exitArm||hist.guard)return;
  try{history.pushState({g:1},"");hist.guard=true}catch(e){}}
window.addEventListener("popstate",()=>{
  hist.guard=false;
  if(!stepBack()){
    toast(T('pressAgainExit'),2000);
    clearTimeout(exitArm);exitArm=setTimeout(()=>{exitArm=0;syncHistory()},2000);
    return}
  syncHistory()});
["pointerdown","keydown","touchstart"].forEach(ev=>document.addEventListener(ev,()=>{
  if(!hist.armed){hist.armed=true;syncHistory()}},{capture:true,passive:true}));
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("#sheet"))closeSheet()});

/* ---------- כרית חתימה ---------- */
function sigPad(cv,onEnd,existing){
  if(!cv)return; const r=cv.getBoundingClientRect();
  cv.width=Math.max(1,r.width*2);cv.height=Math.max(1,r.height*2);
  const c=cv.getContext&&cv.getContext("2d"); if(!c){cv._clear=()=>{};return}
  c.scale(2,2);c.lineWidth=2;c.lineCap="round";
  c.strokeStyle=getComputedStyle(document.body).getPropertyValue("--tx").trim()||"#fff";
  if(existing){const im=new Image();im.onload=()=>c.drawImage(im,0,0,r.width,r.height);im.src=existing}
  let dr=false;
  const pt=e=>{const b=cv.getBoundingClientRect();const t=e.touches?e.touches[0]:e;
    return[t.clientX-b.left,t.clientY-b.top]};
  const down=e=>{e.preventDefault();dr=true;const[x,y]=pt(e);c.beginPath();c.moveTo(x,y)};
  const move=e=>{if(!dr)return;e.preventDefault();const[x,y]=pt(e);c.lineTo(x,y);c.stroke()};
  const up=()=>{if(!dr)return;dr=false;onEnd&&onEnd(cv.toDataURL("image/png"))};
  cv.onpointerdown=down;cv.onpointermove=move;cv.onpointerup=up;cv.onpointerleave=up;
  cv._clear=()=>{c.clearRect(0,0,cv.width,cv.height);onEnd&&onEnd(null)};
}

function buckets(f,n){
  const e=(S.map[f]||{})[n]; if(!e)return [];
  if(e.type==="flat")return[{path:["items"],label:"",items:e.items}];
  if(e.type==="groups")return Object.keys(e.groups).map(g=>({path:["groups",g],label:g,items:e.groups[g]}));
  const out=[];
  ["body","separate"].forEach(ct=>["high","low","minor"].forEach(sv=>{
    if(e[ct]&&e[ct][sv])out.push({path:[ct,sv],label:(ct==="body"?T('ch_body'):T('ch_sep'))+" · "+T('sev_'+sv),items:e[ct][sv]})}));
  return out;
}

/* ---------- גיבוי, שחזור ומחיקה ---------- */
function recPhotoIds(r){const a=[];
  Object.values(r.photos||{}).forEach(x=>(x||[]).forEach(id=>a.push(id)));
  Object.values(r.defects||{}).forEach(d=>((d&&d.photos)||[]).forEach(id=>a.push(id)));return a}
function allPhotoIds(){return [...new Set(S.recs.flatMap(recPhotoIds))]}
function lastBackupText(){const b=store.get("lastbackup",null);
  return b&&b.t?T('bk_last')+": "+dmy(ymd(new Date(b.t))):T('bk_never')}
function backupDue(){
  if(!S.recs.length)return "";
  if(Date.now()-store.get("bksnooze",0)<3*864e5)return "";
  const b=store.get("lastbackup",null);
  if(!b||!b.t)return "bk_remind0";
  return Date.now()-b.t>7*864e5?"bk_remind":""}
function dlBlob(name,blob){const u=URL.createObjectURL(blob);
  const a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),4000)}
/* הקובץ נבנה חלק-חלק (Blob) כדי שגם מאות צילומים לא ימלאו את הזיכרון.
   קוד הנעילה ומפתח הבינה לעולם לא נכנסים לגיבוי. */
async function exportBackup(full){
  const data={v:3,app:"bdk",ver:APP_VER,kind:full?"full":"data",exported:new Date().toISOString(),
    user:S.user,inst:S.inst,recs:S.recs,appts:S.appts,km:S.km,map:S.map,scope:S.scope};
  const parts=[JSON.stringify(data).slice(0,-1)];let n=0,missing=0;
  if(full){
    const ids=allPhotoIds(),out=$("#bkout");
    parts.push(',"photos":{');
    for(let i=0;i<ids.length;i++){
      const d=await phGet(ids[i]);
      if(!d){missing++;continue}
      parts.push((n?",":"")+JSON.stringify(ids[i])+":"+JSON.stringify(d));n++;
      if(out&&i%5===0)out.textContent=TF('bk_building',{n:i+1,t:ids.length})}
    parts.push("}")}
  parts.push("}");
  dlBlob("bdk-"+(full?"full":"data")+"-"+today()+".json",new Blob(parts,{type:"application/json"}));
  if(full){store.set("lastbackup",{t:Date.now(),n});store.del("bksnooze")}
  render();
  toast(missing?TF('bk_missing',{n:missing}):TF('bk_done',{r:S.recs.length,n}),missing?5000:3000)}
function normRec(r){
  const base=newRec(r&&r.kind);
  r=Object.assign(base,r||{});
  ["veh","ins","buyer","seller","pay"].forEach(k=>{r[k]=Object.assign({},newRec()[k],r[k]||{})});
  if(!r.photos||typeof r.photos!=="object")r.photos={};
  if(!r.defects||typeof r.defects!=="object")r.defects={};
  Object.keys(r.defects).forEach(n=>{const d=r.defects[n]||{};
    r.defects[n]={st:d.st||"",items:Array.isArray(d.items)?d.items:[],notes:d.notes||"",safety:!!d.safety,photos:Array.isArray(d.photos)?d.photos:[]}});
  if(!r.id)r.id=uid();
  return r}
/* סדר מחייב: קודם כותבים את הצילומים, ורק אחרי שהכול הצליח מחליפים את הנתונים.
   כישלון באמצע משאיר את המצב הקיים כמו שהוא. */
async function restoreBackup(d){
  const recs=d.recs.map(normRec), photos=d.photos||null;
  if(photos)for(const id of Object.keys(photos)){
    if(typeof photos[id]!=="string"||photos[id].indexOf("data:image/")!==0)continue;
    await phPut(id,photos[id])}
  S.recs=recs;S.appts=Array.isArray(d.appts)?d.appts:[];S.km=(d.km&&typeof d.km==="object")?d.km:{};
  if(d.user)S.user=Object.assign({name:"",cert:""},d.user);
  if(d.inst)S.inst=Object.assign({name:"",lic:"",addr:"",phone:""},d.inst);
  if(d.map&&d.map.full&&d.map.basic){S.map=d.map;if(d.scope&&d.scope.engine&&d.scope.chassis)S.scope=d.scope;saveMap()}
  store.set("user",S.user);store.set("inst",S.inst);persist();S.cur=null;
  if(photos){                                  /* גיבוי מלא: מנקים צילומים שכבר לא שייכים לאף בדיקה */
    const keep=new Set(allPhotoIds());
    for(const k of await phKeys())if(!keep.has(k))await phDel(k)}
}
function deleteRec(id){
  const i=S.recs.findIndex(x=>x.id===id);if(i<0)return;
  const rec=S.recs.splice(i,1)[0];persist();
  undoBar(T('rec_deleted'),()=>{S.recs.splice(Math.min(i,S.recs.length),0,rec);persist()},
    async()=>{for(const pid of recPhotoIds(rec))await phDel(pid)})}

let diagData=null;
async function loadDiag(){
  const d={ver:APP_VER,sw:!!(navigator.serviceWorker&&navigator.serviceWorker.controller),
    installed:!!(window.matchMedia&&matchMedia("(display-mode: standalone)").matches),
    recs:S.recs.length,appts:S.appts.length,lang:S.lang,theme:S.theme+"/"+S.mode,pin:!!S.pin,
    ai:S.ai.provider||"-",keyenc:S.ai.key?(S.ai.enc?"yes":"no"):"none",
    proto:location.protocol,ua:navigator.userAgent,online:navigator.onLine,photos:"?",usage:"?",persist:"?",caches:"?"};
  try{d.photos=(await phKeys()).length}catch(e){}
  try{const e=await navigator.storage.estimate();d.usage=(e.usage/1048576).toFixed(1)+" / "+(e.quota/1048576).toFixed(0)+" MB"}catch(e){}
  try{d.persist=await navigator.storage.persisted()}catch(e){}
  try{d.caches=(await caches.keys()).join(", ")||"-"}catch(e){}
  let errs=[];try{errs=JSON.parse(localStorage.getItem("bdk_errlog")||"[]")}catch(e){}
  d.errs=errs;diagData=d;if(S.screen==="diag")render()}
function diagReport(){const d=diagData||{};

    "storage: "+d.usage+" · persistent: "+d.persist,"recs: "+d.recs+" · appts: "+d.appts+" · photos: "+d.photos,
    "lang: "+d.lang+" · theme: "+d.theme+" · pin: "+d.pin,"ai: "+d.ai+" · key encrypted: "+d.keyenc,"ua: "+d.ua,
    "errors:"].concat((d.errs||[]).map(e=>"  "+e.t+" "+e.s+":"+e.l+" "+e.m)).join("\n")}

/* ---------- הדפסה: טופס אחיד + נספח ממצאים ---------- */
async function buildPrint(){
  const r=S.cur,rows=form(),c=counts(r);
  const ord=r.orderer==="seller"?r.seller:r.buyer;
  const official=!!S.inst.lic;
  const ph=await phAll([...new Set([].concat(...Object.values(r.photos||{}),
    ...rows.map(x=>(r.defects[x.n]||{}).photos||[]).flat()))]);
  const tr=rows.filter(x=>!x.notesonly).map(x=>{const d=r.defects[x.n]||{};
    const diag=d.st==="ns"?nsText(r):
      d.st==="na"?"המערכת לא קיימת ברכב זה":
      d.st==="rec"?(d.notes?"המלצה: "+d.notes:"המלצה"):
      (d.items||[]).join("; ");
    return `<tr><td style="text-align:center">${x.n}</td><td>${esc(x.t)}</td>
      <td style="text-align:center">${d.st==="ok"?"✔":""}</td>
      <td style="text-align:center">${d.st==="bad"?"✔":""}</td>
      <td>${esc(diag)}</td></tr>`}).join("");
  const gen=rows.find(x=>x.notesonly),gd=gen?(r.defects[gen.n]||{}):{};
  const genTxt=[...(gd.items||[]),gd.notes||"",
    (r.veh.engLic&&r.veh.engAct&&r.veh.engLic!==r.veh.engAct)?"אי-התאמה במספר המנוע בין הרשום ברישיון לבין המוטבע ברכב":"",
    (r.veh.colorLic&&r.veh.colorAct&&r.veh.colorLic!==r.veh.colorAct)?"אי-התאמה בצבע הרכב לעומת הרשום ברישיון":"",
    (r.veh.tireLic&&r.veh.tireAct&&r.veh.tireLic!==r.veh.tireAct)?"אי-התאמה במידות הצמיגים לעומת הרשום ברישיון":""
  ].filter(Boolean).join(" · ");
  const safeties=rows.filter(x=>(r.defects[x.n]||{}).safety)
    .map(x=>x.t+": "+((r.defects[x.n].items||[]).join("; "))).join(" | ");
  const notes=["הממצאים המחייבים את מכון הבדיקה הם המפורטים בכתב בטופס זה בכפוף לתוצאות הבדיקה.",
   "מידע על חומרת הליקויים והצעת מחיר לתיקון יש לקבל ממוסך מורשה או שמאי רכב, באחריות קונה הרכב.",
   "אחריות מכון הבדיקה היא על המכללים שנבדקו והמצוינים בטופס בלבד.",
   "האחריות על תוצאות הבדיקה היא לשלושה חודשים או 6,000 ק״מ, לפי המוקדם.",
   "צילום רישיון הרכב ורישיון הנהיגה שהוצגו בעת הבדיקה נשמרים יחד עם הטופס למשך 24 חודשים.",
   "מזמין הבדיקה מאשר שקרא והובאו לידיעתו הממצאים הרשומים בטופס זה.",
   "בעת העברת בעלות מומלץ לוודא שמספרי המנוע והשלדה ברישיון תואמים לרשום בטופס זה."];
  const photoPages=PHOTO_GROUPS.map(g=>{
    const inner=g.slots.map(sl=>(r.photos[sl.k]||[]).map(id=>ph[id]
      ?`<figure><img src="${ph[id]}"><figcaption>${esc(sl.t)}</figcaption></figure>`:"").join("")).join("");
    return inner.trim()?`<h3 style="font-size:11pt;margin:10px 0 4px">${esc(T(g.t))}</h3>
      <div class="pgrid">${inner}</div>`:""}).join("");
  const defPages=rows.map(x=>{const d=r.defects[x.n]||{};
    if(!(d.notes||(d.photos||[]).length))return "";
    return `<div style="margin:8px 0"><b>${x.n}. ${esc(x.t)}</b>${d.notes?`<div>${esc(d.notes)}</div>`:""}
      <div class="pgrid">${(d.photos||[]).map(id=>ph[id]?`<figure><img src="${ph[id]}">
      <figcaption>${esc(x.t)}</figcaption></figure>`:"").join("")}</div></div>`}).join("");
  $("#printarea").innerHTML=`<div class="pform" dir="rtl">
    ${official?`<div style="text-align:center;font-size:9pt">${esc(S.inst.name)} · ${esc(S.inst.addr)} ·
      ${esc(S.inst.phone)} · רישיון מפעל ${esc(S.inst.lic)}</div>`:
      `<div class="banner draft">${esc(T('draft'))}</div>`}
    <h2>טופס סיכום ${r.kind==="full"?"של בדיקה כללית כולל מערכות אלקטרוניות וממוחשבות":
      r.kind==="basic"?"של בדיקה כללית ללא מערכות אלקטרוניות וממוחשבות":
      r.kind==="engine"?"— בדיקת מנוע בלבד":"— בדיקת שילדה ומרכב בלבד"}</h2>
    <div style="text-align:center;font-size:8.5pt">(עפ״י הוראות משרד התחבורה — הוראת נוהל 127)</div>
    <div class="kv" style="margin-top:6px">
      מס׳ הרכב: <b>${esc(r.veh.plate)}</b> · תוצר: ${esc(r.veh.make)} · דגם: ${esc(r.veh.model)} ·
      שנת ייצור: ${esc(r.veh.year)} · מס׳ שילדה: ${esc(r.veh.vinAct||r.veh.vinLic)}<br>
      מס׳ מנוע: ${esc(r.veh.engAct||r.veh.engLic)} · ק״מ: ${esc(r.veh.km)} · סוג הרכב: ${esc(r.veh.vtype)} ·
      צבע: ${esc(r.veh.colorAct||r.veh.colorLic)} · סוג השלדה: ${r.veh.chassis==="separate"?"שלדה נפרדת":"שלדת מרכב"}<br>
      מזמין הבדיקה: ${esc(ord.name)} · ת.ז. ${esc(ord.id)} · כתובת: ${esc(ord.addr)}
    </div>
    ${safeties?`<div class="safety">ליקוי בטיחותי אשר עלול לסכן עוברי דרך: ${esc(safeties)}</div>`:""}
    <table><thead><tr><th style="width:26px">מס״ד</th><th>המערכת</th><th style="width:34px">תקין</th>
      <th style="width:40px">לא תקין</th><th style="width:44%">האבחנה</th></tr></thead><tbody>${tr}
      <tr><td style="text-align:center">${gen?gen.n:""}</td><td>הערות כלליות</td><td></td><td></td>
      <td>${esc(genTxt)}</td></tr></tbody></table>
    <div class="notes">${notes.map((t,i)=>`${i+1}. ${esc(t)}`).join("<br>")}</div>
    <div class="kv" style="margin-top:8px">אני הח״מ ${esc(r.ins.inspector)}, בודק רכב בעל מס׳ תעודה ${esc(r.ins.cert)},
      מאשר כי בדקתי את הרכב בתאריך ${esc(r.ins.date)} ובמקום ${esc(r.ins.place)}
      ${r.ins.roadtest?"וביצעתי מבחן דרך ברכב":"<b>ללא מבחן דרך</b>"}.</div>
    <div class="sigrow">
      <div>${r.sigOrd?`<img src="${r.sigOrd}">`:"<div style='border-bottom:1px solid #000;height:52px'></div>"}
        שם מזמין הבדיקה וחתימתו</div>
      <div>${r.sigIns?`<img src="${r.sigIns}">`:"<div style='border-bottom:1px solid #000;height:52px'></div>"}
        חתימה וחותמת הבודק</div>
      <div><div style="border-bottom:1px solid #000;height:52px"></div>חותמת מכון הבדיקה</div>
    </div>
    ${(defPages||photoPages)?`<div class="pagebreak"><h2>נספח ממצאים וצילומים</h2>
      <div style="font-size:8.5pt;text-align:center">נספח זה אינו חלק מטופס הסיכום האחיד ומצורף כתיעוד נוסף.</div>
      ${defPages}${photoPages}</div>`:""}
    <div style="text-align:center;font-size:7.5pt;margin-top:10px">הופק ב-${esc(T('app'))} · ${esc(S.user.name)} · ${esc(today())}</div>
  </div>`;
}

let pickTarget=null;
$("#picker").addEventListener("change",async e=>{
  const f=e.target.files&&e.target.files[0]; e.target.value="";
  if(!f||!pickTarget)return;
  let data; try{data=await compress(f)}catch(err){return toast(T('t_photo_fail'))}
  const t=pickTarget; pickTarget=null;
  if(t.kind==="gate"){gate[t.k]=data;return render()}
  const id=uid(); await phPut(id,data);
  if(t.kind==="slot"){(S.cur.photos[t.slot]=S.cur.photos[t.slot]||[]).push(id)}
  else{const d=dget(S.cur,t.n);d.photos.push(id)}
  saveCur();render();
});
function pick(target){pickTarget=target;$("#picker").click()}

document.addEventListener("click",async e=>{
  const t=e.target.closest("[data-act]"); if(!t)return;
  const a=t.dataset.act, r=S.cur;
  switch(a){
    case "home":home();break;
    case "back":stepBack();syncHistory();break;
    case "nav":{const to=t.dataset.to;
      if(S.screen===to){window.scrollTo({top:0,behavior:"smooth"});break}
      if(to==="home")home();else{S.cur=null;go(to)}break}
    case "more":go("more");break;
    case "reload":location.reload();break;
    case "settings":go("settings");break;
    case "archive":go("archive");break;
    case "diary":go("diary");break;
    case "dash":go("dash");break;
    case "theme":{const o=["black","blue","green","steel","rust"];
      S.theme=o[(o.indexOf(S.theme)+1)%o.length];store.set("theme",S.theme);applyChrome();break}
    case "mode":S.mode=S.mode==="dark"?"light":"dark";store.set("mode",S.mode);render();break;
    case "langmenu":{const ks=Object.keys(LANG);S.lang=ks[(ks.indexOf(S.lang)+1)%ks.length];
      store.set("lang",S.lang);render();break}
    case "new":gate={kind:"full",lic:null,drv:null,sig:null};go("gate");break;
    case "gph":pick({kind:"gate",k:t.dataset.k});break;
    case "gsigclear":{const g=$("#gsig");if(g&&g._clear)g._clear();gate.sig=null;break}
    case "gstart":{
      if(!gate.lic||!gate.drv)return toast(T('t_need2'));
      if(!gate.sig)return toast(T('t_needsig'));
      const rec=startRec(gate.kind);rec.decl=true;
      const a1=uid(),a2=uid();await phPut(a1,gate.lic);await phPut(a2,gate.drv);
      rec.photos.lic_veh=[a1];rec.photos.lic_drv=[a2];rec.sigOrd=gate.sig;
      S.cur=rec;S.tab=0;saveCur();go("rec",rec,{replace:true});break}
    case "open":{const rec=S.recs.find(x=>x.id===t.dataset.id);closeSheet();if(rec){S.tab=0;openRow=null;go("rec",rec)}break}
    case "tab":S.tab=+t.dataset.i;openRow=null;dq="";render();break;
    case "sys":{const n=+t.dataset.n;openRow=openRow===n?null:n;dq="";render();break}
    case "st":{const d=dget(r,+t.dataset.n);d.st=d.st===t.dataset.s?"":t.dataset.s;
      if(d.st!=="bad"){d.items=[];d.safety=false}saveCur();render();break}
    case "unpick":{const d=dget(r,+t.dataset.n);d.items=d.items.filter(x=>x!==t.dataset.v);saveCur();render();break}
    case "safety":break;
    case "dphoto":pick({kind:"def",n:+t.dataset.n});break;
    case "dphdel":{const d=dget(r,+t.dataset.n),id=t.dataset.id,i=d.photos.indexOf(id);if(i<0)break;
      d.photos.splice(i,1);saveCur();render();
      undoBar(T('photo_deleted'),()=>{d.photos.splice(i,0,id);persist()},()=>phDel(id));break}
    case "phadd":pick({kind:"slot",slot:t.dataset.slot});break;
    case "phdel":{e.stopPropagation();const s=t.dataset.slot,id=t.dataset.id,arr=r.photos[s]||[],i=arr.indexOf(id);if(i<0)break;
      arr.splice(i,1);saveCur();render();
      undoBar(T('photo_deleted'),()=>{(r.photos[s]=r.photos[s]||[]).splice(i,0,id);persist()},()=>phDel(id));break}
    case "aisug":{const n=+t.dataset.n,row=form().find(x=>x.n===n),d=dget(r,n);
      if(!d.notes.trim())return toast(T('t_writefirst'));
      t.innerHTML='<span class="spin"></span>';
      const sug=await aiSuggest(d.notes,flatPool(row,r));
      if(!sug.length){render();return toast(T('t_nosug'))}
      sheet(T('sug_title'),`<div class="tiny">${esc(T('sug_note'))}</div>
        <div class="dlist" style="margin-top:10px">${sug.map(x=>`<label class="ditem">
        <input type="checkbox" data-sug="${esc(x)}" checked><span>${esc(x)}</span></label>`).join("")}</div>
        <button class="btn solid" data-act="sugok" data-n="${n}">${esc(T('add'))}</button>`);
      break}
    case "sugok":{const n=+t.dataset.n,d=dget(r,n);
      document.querySelectorAll("[data-sug]:checked").forEach(i=>{
        if(!d.items.includes(i.dataset.sug))d.items.push(i.dataset.sug)});
      if(!d.st)d.st="bad"; saveCur();closeSheet();render();break}
    case "lookup":{
      const p=(r.veh.plate||"").replace(/\D/g,""); if(!p)return toast(T('e_noplate'));
      t.innerHTML='<span class="spin"></span> '+T('fetching');
      try{
        const m=await lookupPlate(p);
        if(!m){render();return toast(T('e_notfound'))}
        r.mo=m; r.veh.plate=m.plate; rememberKm(m);
        r.veh.make=r.veh.make||m.make; r.veh.model=r.veh.model||m.model;
        r.veh.year=r.veh.year||m.year; r.veh.vtype=r.veh.vtype||m.vtype;
        r.veh.vinLic=r.veh.vinLic||m.vin; r.veh.engLic=r.veh.engLic||m.engno;
        r.veh.colorLic=r.veh.colorLic||m.color;
        r.veh.tireLic=r.veh.tireLic||[m.tireF,m.tireR].filter(Boolean).join(" / ");
        saveCur();render();toast(T('loaded'));
      }catch(err){render();toast(T('e_net'))}
      break}
    case "motest":{const o=$("#motestout");o.innerHTML='<span class="spin"></span> '+esc(T('ai_checking'));
      try{const rec=await moFetch(RES.veh,{mispar_rechev:"1"},1);
        o.innerHTML='<span style="color:var(--ok)">'+esc(T('mo_ok'))+'</span>'}
      catch(err){o.innerHTML='<span style="color:var(--bad)">'+esc(T('mo_fail'))+' ('+esc(err.message)+')</span>'}
      break}
    case "sigclear":{const cv=$(t.dataset.w==="1"?"#sig1":"#sig2");if(cv&&cv._clear)cv._clear();
      if(t.dataset.w==="1")r.sigIns=null;else r.sigOrd=null;saveCur();break}
    case "print":await buildPrint();setTimeout(()=>window.print(),120);break;
    case "finish":r.status=r.status==="done"?"open":"done";saveCur();render();
      toast(T(r.status==="done"?'t_closed':'t_reopened'));break;
    case "delrec":deleteRec(r.id);home();break;
    case "apptnew":{
      sheet(T('add'),`<div class="f"><label>${esc(T('plate'))}</label><input id="ap"></div>
        <div class="f"><label>${esc(T('name'))}</label><input id="an"></div>
        <div class="f2"><div class="f"><label>${esc(T('insdate'))}</label><input id="ad" type="date" value="${today()}"></div>
        <div class="f"><label>${esc(T('instime'))}</label><input id="at" type="time" value="09:00"></div></div>
        <div class="f"><label>${esc(T('kind'))}</label><select id="ak">
          <option value="full">${esc(T('kind_full'))}</option><option value="basic">${esc(T('kind_basic'))}</option></select></div>
        <button class="btn solid" data-act="apptsave">${esc(T('save'))}</button>`);break}
    case "apptsave":{S.appts.push({id:uid(),plate:$("#ap").value,name:$("#an").value,
      date:$("#ad").value,time:$("#at").value,kind:$("#ak").value});persist();closeSheet();render();break}
    case "apptdel":{const i=S.appts.findIndex(x=>x.id===t.dataset.id);if(i<0)break;
      const ap=S.appts.splice(i,1)[0];persist();render();
      undoBar(T('appt_deleted'),()=>{S.appts.splice(i,0,ap);persist()});break}
    case "apptgo":{const ap=S.appts.find(x=>x.id===t.dataset.id);

      Object.keys(localStorage).filter(k=>k.indexOf(K)===0).forEach(k=>localStorage.removeItem(k));

      if(!aiConnected()){o.innerHTML='<span style="color:var(--warn)">'+esc(T('ai_nokey'))+'</span>';break}

      try{const ids=await aiListModels();

        if(!alive(S.ai.model))S.ai.model="";
        saveAi();render();
        const o2=$("#aitestout");if(o2)o2.innerHTML='<span style="color:var(--ok)">'+esc(TF('ai_ok',{n:ids.length}))+'</span>'}
      catch(err){const o2=$("#aitestout")||o;
        o2.innerHTML='<span style="color:var(--bad)">'+esc(T('ai_fail'))+' ('+esc(err.message)+')</span>'}
      break}
    case "aidisc":{S.ai={provider:"",key:"",url:"",model:"",enc:null};saveAi();render();toast(T('ai_disconnect'));break}

    case "phtab":phTab=t.dataset.k;render();break;
    case "unlock":{const d=dget(r,+t.dataset.n);d.st="";saveCur();render();break}
    case "edrow":{const n=+t.dataset.n;edRow=edRow===n?null:n;render();break}
    case "edscope":break;
    case "edup":case "eddown":{const n=+t.dataset.n,arr=bucketAt(edForm,n,t.dataset.p.split(">")),
        i=+t.dataset.i,j=a==="edup"?i-1:i+1;
      if(j<0||j>=arr.length)break;
      [arr[i],arr[j]]=[arr[j],arr[i]];saveMap();render();break}
    case "eddel":{const arr=bucketAt(edForm,+t.dataset.n,t.dataset.p.split(">")),i=+t.dataset.i;
      const it=arr.splice(i,1)[0];saveMap();render();
      undoBar(T('item_deleted'),()=>{arr.splice(i,0,it);saveMap()});break}
    case "edadd":{const n=+t.dataset.n,path=t.dataset.p.split(">");
      const el=document.getElementById("add_"+n+"_"+path.join("_"));
      const v=(el&&el.value||"").trim(); if(!v)break;
      bucketAt(edForm,n,path).push(v);saveMap();render();break}
    case "edmove":{const n=+t.dataset.n,path=t.dataset.p.split(">"),i=+t.dataset.i;
      const item=bucketAt(edForm,n,path)[i];
      const opts=rowsOf(edForm).flatMap(row=>buckets(edForm,row.n).map(b=>
        `<option value="${esc(row.n+"|"+b.path.join(">"))}">${esc(row.n+". "+rowT(row)+(b.label?" · "+grpT(b.label):""))}</option>`)).join("");
      sheet(T('moveto'),`<div class="tiny">${esc(item)}</div>
        <div class="f"><select id="mvsel">${opts}</select></div>
        <button class="btn solid" data-act="edmoveok" data-n="${n}" data-p="${esc(path.join(">"))}"
          data-i="${i}">${esc(T('moveto'))}</button>`);
      break}
    case "edmoveok":{const n=+t.dataset.n,path=t.dataset.p.split(">"),i=+t.dataset.i;
      const v=($("#mvsel")||{}).value||"";if(!v)break;
      const [tn,tp]=v.split("|");
      const src=bucketAt(edForm,n,path),item=src.splice(i,1)[0];
      bucketAt(edForm,+tn,tp.split(">")).push(item);
      saveMap();closeSheet();render();toast(T('e_moved'));break}
    case "edform":break;
    case "edexport":dl("bdk-lists-"+today()+".json",JSON.stringify({v:1,map:S.map,scope:S.scope}),"application/json");break;
    case "edimport":{const inp=document.createElement("input");inp.type="file";inp.accept=".json";
      inp.onchange=()=>{const fr=new FileReader();fr.onload=()=>{try{const d=JSON.parse(fr.result);
        if(!d.map)return toast(T('e_notlists'));
        S.map=d.map;if(d.scope)S.scope=d.scope;saveMap();render();toast(T('e_imported'))}
        catch(e){toast(T('e_badfile'))}};fr.readAsText(inp.files[0])};inp.click();break}
    case "edreset":if(await askConfirm(T('reset_q'),T('reset_yes'),true)){
      S.map=defaultMap();S.scope=JSON.parse(JSON.stringify(SCOPE_DEF));saveMap();render();toast(T('reset_yes')+" ✓")}break;
    case "pind":pinBuf=(pinBuf+t.dataset.n).slice(0,8);render();break;
    case "pinback":pinBuf=pinBuf.slice(0,-1);render();break;
    case "pinok":{
      if(pinWait()>0){render();break}
      const tryPin=pinBuf;pinBuf="";
      if(await pinCheck(tryPin)){store.del("pinfail");S.locked=false;render();scheduleNotes();syncHistory()}
      else{const f=store.get("pinfail",{n:0,until:0});f.n++;
        if(f.n>=5){f.n=0;f.until=Date.now()+30000}                /* 5 טעויות — המתנה של 30 שניות */
        store.set("pinfail",f);render();
        const m=$("#pinmsg");if(m){m.textContent=pinWait()>0?TF('pin_wait',{n:pinWait()}):T('pin_wrong');m.style.color="var(--bad)"}}
      break}
    case "gnext":if(gStep<GUIDE.length-1){gStep++;render()}else{S.seen=true;store.set("seen",true);render()}break;
    case "gskip":S.seen=true;store.set("seen",true);render();break;
    case "guideagain":S.seen=false;gStep=0;render();break;
    case "setpin":{
      const cur=(S.pin&&typeof S.pin==="object"&&S.pin.after!=null)?S.pin.after:5;
      sheet(T(S.pin?'pin_change':'pin_set'),`
        <div class="f"><label>${esc(T('pin_new'))}</label>
          <input id="pn1" type="password" inputmode="numeric" autocomplete="new-password" maxlength="8"></div>
        <div class="f"><label>${esc(T('pin_again'))}</label>
          <input id="pn2" type="password" inputmode="numeric" autocomplete="new-password" maxlength="8"></div>
        <div class="f"><label>${esc(T('pin_after'))}</label><select id="pnafter">
          ${[0,1,5,15].map(n=>`<option value="${n}" ${cur===n?"selected":""}>${esc(n?TF('pin_min',{n}):T('pin_now'))}</option>`).join("")}
        </select></div>
        <div class="tiny" id="pnmsg" role="status">${esc(T('pin_forgot'))}</div>
        <button class="btn solid" data-act="pinsave">${esc(T('save'))}</button>
        ${S.pin?`<button class="btn danger" data-act="pinremove">${esc(T('pin_remove'))}</button>`:""}`,T('cancel'));
      break}
    case "pinsave":{const a=$("#pn1").value.trim(),b=$("#pn2").value.trim(),m=$("#pnmsg");
      const bad=x=>{m.textContent=x;m.style.color="var(--bad)"};
      if(!/^\d{4,8}$/.test(a)){bad(T('pin_digits'));break}
      if(a!==b){bad(T('pin_nomatch'));break}
      await pinStore(a,+$("#pnafter").value);store.del("pinfail");closeSheet();render();toast(T('pin_saved'));break}
    case "pinremove":S.pin=null;store.del("pin");store.del("pinfail");closeSheet();render();toast(T('pin_removed'));break;
    case "notify":{if(!("Notification" in window))return toast(T('t_nonotif'));
      const p=await Notification.requestPermission();
      S.notify=p==="granted";store.set("notify",S.notify);
      toast(T(S.notify?'t_notif_on':'t_notif_denied'));scheduleNotes();render();break}
    case "share":{const rec=S.cur,c=counts(rec);
      const ord=rec.orderer==="seller"?rec.seller:rec.buyer;
      const bad=form().filter(x=>(rec.defects[x.n]||{}).st==="bad")
        .map(x=>"• "+rowT(x)+": "+((rec.defects[x.n].items||[]).join(", ")||"—")).join("\n");
      const txt=[T('sh_title')+" — "+(S.inst.name||T('draft')),
        T('plate')+": "+rec.veh.plate+"  |  "+rec.veh.make+" "+rec.veh.model+" "+rec.veh.year,
        T('insdate')+": "+dmy(rec.ins.date)+"  |  "+T('inspector')+": "+rec.ins.inspector,
        T('kind')+": "+kindName(rec.kind),
        "",c.bad?TF('sh_found',{n:c.bad})+"\n"+bad:T('sh_none'),
        c.safety?"\n"+T('sh_safety'):"",
        "\n"+T('sh_warranty'),
        T('sh_fullsep')].filter(x=>x!=="").join("\n");
      sheet(TF('sh_to',{x:ord.name||T('sh_customer')}),
        `<div class="tiny" style="white-space:pre-wrap;max-height:220px;overflow:auto;
          border:1px solid var(--line);border-radius:10px;padding:10px">${esc(txt)}</div>
         <div class="tiny" style="margin:8px 0">${esc(TF('sh_textonly',{x:T('pdf')}))}</div>
         <button class="btn solid" data-act="shwa" data-t="${esc(encodeURIComponent(txt))}"
           data-ph="${esc((ord.phone||"").replace(/\D/g,""))}">${esc(T('sh_wa'))}</button>
         <button class="btn" data-act="shmail" data-t="${esc(encodeURIComponent(txt))}"
           data-p="${esc(rec.veh.plate)}">${esc(T('sh_mail'))}</button>
         <button class="btn" data-act="shcopy" data-t="${esc(encodeURIComponent(txt))}">${esc(T('sh_copy'))}</button>`);
      break}
    case "shwa":{let ph=t.dataset.ph||"";
      if(ph.startsWith("0"))ph="972"+ph.slice(1);
      {const u="https://wa.me/"+ph+"?text="+t.dataset.t;
       /* באפליקציה מותקנת window.open יכול להחזיר null */
       const w=window.open(u,"_blank");if(!w)location.href=u}break}
    case "shmail":window.location.href="mailto:?subject="+encodeURIComponent(T('sh_title')+" "+t.dataset.p)+
      "&body="+t.dataset.t;break;
    case "shcopy":try{await navigator.clipboard.writeText(decodeURIComponent(t.dataset.t));toast(T('dg_copied'))}
      catch(e){toast(T('t_copyfail'))}break;
    case "recmenu":{const rec=S.recs.find(x=>x.id===t.dataset.id);if(!rec)break;
      sheet(rec.veh.plate||T('archive'),
        `<button class="btn primary" data-act="open" data-id="${esc(rec.id)}">${esc(T('edit'))}</button>
         <button class="btn danger" data-act="killrec" data-id="${esc(rec.id)}">${esc(T('del'))}</button>`);break}
    case "killrec":closeSheet();deleteRec(t.dataset.id);render();break;
    case "sheetclose":closeSheet();break;
  }
});
document.addEventListener("change",e=>{
  const el=e.target;
  if(el.dataset.p&&S.cur){setP(S.cur,el.dataset.p,el.value);saveCur();
    if(/vin|eng|color|tire|chassis/.test(el.dataset.p))render();return}
  if(el.dataset.chk&&S.cur){setP(S.cur,el.dataset.chk,el.checked);saveCur();return}
  if(el.dataset.act==="pick"&&S.cur){const d=dget(S.cur,+el.dataset.n);
    const v=el.dataset.v; if(el.checked){if(!d.items.includes(v))d.items.push(v)}
    else d.items=d.items.filter(x=>x!==v); if(!d.st)d.st="bad"; saveCur();render();return}
  if(el.dataset.act==="safety"&&S.cur){dget(S.cur,+el.dataset.n).safety=el.checked;saveCur();render();return}
  if(el.dataset.act==="edform"){edForm=el.value;edRow=null;render();return}
  if(el.dataset.act==="edscope"){const l=el.dataset.l,n=+el.dataset.n;
    const arr=S.scope[l];const i=arr.indexOf(n);
    if(el.checked&&i<0)arr.push(n); else if(!el.checked&&i>=0)arr.splice(i,1);
    arr.sort((a,b)=>a-b);saveMap();return}
  if(el.dataset.s){const p=el.dataset.s,v=el.value;
    if(p==="ai.provider"){const pv=AI_PROVIDERS[v];
      S.ai.provider=v;S.ai.model="";S.ai.okModel="";saveAi();render();return}
    if(p==="ai.key"){setAiKey(v.trim()).then(render);return}
    if(p.includes(".")){const[a,b]=p.split(".");S[a][b]=v;if(a==="ai")saveAi();else store.set(a,S[a])}
    else{S[p]=v;store.set(p,v)}
    render();return}
});
document.addEventListener("input",e=>{
  const el=e.target;
  if(el.dataset.act==="dq"){dq=el.value;const pos=el.selectionStart;render();
    const n=document.querySelector("[data-act=dq]");if(n){n.focus();n.setSelectionRange(pos,pos)}return}
  if(el.dataset.act==="aq"){aq=el.value;const pos=el.selectionStart;render();
    const n=document.querySelector("[data-act=aq]");if(n){n.focus();n.setSelectionRange(pos,pos)}return}
  if(el.dataset.act==="dnote"&&S.cur){dget(S.cur,+el.dataset.n).notes=el.value;saveCur();return}
});
let lpT=null;
document.addEventListener("pointerdown",e=>{const el=e.target.closest("[data-lp]");if(!el)return;
  lpT=setTimeout(()=>{lpT=null;
    const b=document.createElement("button");b.dataset.act="recmenu";b.dataset.id=el.dataset.lp;
    b.style.display="none";document.body.appendChild(b);b.click();b.remove()},600)});
["pointerup","pointermove","pointercancel","scroll"].forEach(ev=>
  document.addEventListener(ev,()=>{if(lpT){clearTimeout(lpT);lpT=null}},{passive:true}));
function dl(name,content,type){const b=new Blob([content],{type});const u=URL.createObjectURL(b);
  const a=document.createElement("a");a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)}
function sheet(title,html,closeLabel){const d=document.createElement("div");d.className="sheet";d.id="sheet";
  d.setAttribute("role","dialog");d.setAttribute("aria-modal","true");
  d.innerHTML=`<div class="inner"><h3>${esc(title)}</h3>${html}
    <button class="btn" data-act="sheetclose">${esc(closeLabel||T('close'))}</button></div>`;
  const born=Date.now();
  d.addEventListener("click",e=>{if(Date.now()-born<350){e.preventDefault();e.stopPropagation()}},true);
  d.onclick=e=>{if(e.target===d)closeSheet()};document.body.appendChild(d)}
function closeSheet(){const s=$("#sheet");if(s)s.remove();
  if(cfRes){const r=cfRes;cfRes=null;r(false)}}

/* ===================== התחלה ===================== */
S.map=store.get("map",null)||defaultMap();
if(!S.scope)S.scope=JSON.parse(JSON.stringify(SCOPE_DEF));
if(S.pin)S.locked=true;
if(!S.ai||typeof S.ai!=="object")S.ai={provider:"",key:"",url:"",model:""};
if(S.ai.enc)S.ai.key="";
applyChrome();render();
if(!S.locked)scheduleNotes();
loadAiKey().then(()=>{if(S.screen==="settings"&&!S.locked)render()}).catch(()=>{});
/* ברקע: המסך מטושטש; בחזרה אחרי הזמן שנקבע — נעילה */
let awayAt=0;
document.addEventListener("visibilitychange",()=>{
  if(document.hidden){awayAt=Date.now();flushUndo();if(S.pin)document.body.classList.add("away");return}
  document.body.classList.remove("away");
  if(S.pin&&!S.locked&&awayAt){
    const after=(typeof S.pin==="object"&&S.pin.after!=null)?S.pin.after:5;
    if(Date.now()-awayAt>=after*60000){closeSheet();pinBuf="";S.locked=true;render()}}
  awayAt=0});
window.addEventListener("pagehide",flushUndo);
if("serviceWorker" in navigator&&location.protocol!=="file:"){
  const had=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.register("sw.js").catch(()=>{});
  navigator.serviceWorker.addEventListener("controllerchange",()=>{
    if(had&&!S.updated){S.updated=true;if(S.screen==="home"&&!S.locked&&S.seen)render()}});
}
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
</script>
</body>
</html>
