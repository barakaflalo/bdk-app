<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0d0f">
<title>בדק — בדיקת רכב לפני קנייה</title>
<meta name="description" content="ניהול בדיקת רכב לצרכי קנייה ומכירה לפי הוראת נוהל 127">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{
  --gold:#c9a227; --gold-soft:#e6c85c;
  --bg:#0d0d0f; --bg2:#151518; --card:#17171b; --line:#2a2a31;
  --tx:#f2f2f4; --tx2:#a0a0ab; --tx3:#6c6c78;
  --ok:#3f9d5a; --bad:#d1483f; --warn:#d99a2b; --info:#3b7dd8;
  --r:14px; --pad:16px;
  --font:"Assistant","Heebo","Segoe UI",system-ui,-apple-system,"Noto Sans Hebrew",sans-serif;
}
[data-theme="blue"]{--gold:#4a90d9;--gold-soft:#7fb4ec;--bg:#0b1220;--bg2:#111b2e;--card:#131f35;--line:#24344f;}
[data-theme="green"]{--gold:#3fa66a;--gold-soft:#6fce97;--bg:#0a1310;--bg2:#0f1d17;--card:#12211b;--line:#20372c;}
[data-theme="steel"]{--gold:#8f9bb3;--gold-soft:#b9c3d6;--bg:#101114;--bg2:#181a1f;--card:#1b1d23;--line:#2d3038;}
[data-theme="rust"]{--gold:#c96f3f;--gold-soft:#e39366;--bg:#130f0d;--bg2:#1d1714;--card:#211a16;--line:#3a2c24;}

[data-mode="light"]{
  --bg:#f4f4f6; --bg2:#ffffff; --card:#ffffff; --line:#dcdce2;
  --tx:#16161a; --tx2:#5b5b66; --tx3:#8a8a95;
}
[data-mode="light"][data-theme="black"]{--gold:#8a6f10;--gold-soft:#a8891f;}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--tx);font-family:var(--font);font-size:16px;line-height:1.5}
body{padding-bottom:env(safe-area-inset-bottom)}
[dir="ltr"] body{text-align:left}
button,input,select,textarea{font-family:inherit;font-size:16px;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:var(--gold-soft)}
a.btn{text-decoration:none}

/* ---------- layout ---------- */
.wrap{max-width:760px;margin:0 auto;padding:0 var(--pad) 90px}
.topbar{position:sticky;top:0;z-index:40;background:var(--bg);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:10px;padding:12px var(--pad);max-width:760px;margin:0 auto}
.topbar h1{font-size:18px;margin:0;flex:1;font-weight:700;letter-spacing:-.2px}
.iconbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--bg2);
  display:grid;place-items:center;font-size:17px;color:var(--tx2);flex:none}
.iconbtn:active{background:var(--card)}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:var(--pad);margin:12px 0}
.card.tight{padding:12px}
.muted{color:var(--tx2);font-size:14px}
.tiny{color:var(--tx3);font-size:12.5px}
.sec{font-size:12.5px;letter-spacing:.08em;color:var(--tx3);text-transform:uppercase;margin:22px 0 8px}

/* ---------- buttons ---------- */
.btn{display:block;width:100%;padding:14px 16px;border-radius:12px;background:var(--bg2);
  border:1px solid var(--line);color:var(--tx);font-weight:600;text-align:center;margin:8px 0}
.btn:active{transform:scale(.985)}
.btn.primary{border:1.5px solid var(--gold);color:var(--gold-soft);background:transparent}
.btn.solid{background:var(--gold);color:#0d0d0f;border-color:var(--gold);font-weight:700}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.sm{width:auto;display:inline-block;padding:9px 14px;font-size:14px;margin:4px 4px 4px 0}
.row{display:flex;gap:8px}
.row>*{flex:1}

/* ---------- home ---------- */
.hero{padding:26px 0 6px}
.hero .mark{font-size:34px;font-weight:800;letter-spacing:-1px;color:var(--gold)}
.hero .sub{color:var(--tx2);font-size:14px;margin-top:2px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px 16px;text-align:start;
  display:flex;flex-direction:column;gap:6px;min-height:104px;justify-content:flex-end}
.tile .ic{font-size:24px;line-height:1}
.tile .t{font-weight:700;font-size:16px}
.tile .d{font-size:12.5px;color:var(--tx3)}
.tile.wide{grid-column:1/-1;min-height:auto;flex-direction:row;align-items:center;gap:12px;justify-content:flex-start}
.tile.go{border-color:var(--gold)}
.tile.go .t{color:var(--gold-soft)}

/* ---------- fields ---------- */
.f{margin:14px 0}
.f>label{display:block;font-size:13.5px;color:var(--tx2);margin-bottom:6px;font-weight:600}
.f input,.f select,.f textarea{width:100%;padding:12px;border-radius:10px;background:var(--bg2);
  border:1px solid var(--line);color:var(--tx)}
.f input:focus,.f select,.f textarea:focus{outline:2px solid var(--gold);outline-offset:1px}
.f textarea{min-height:88px;resize:vertical}
.f .hint{font-size:12px;color:var(--tx3);margin-top:4px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chk{display:flex;align-items:center;gap:10px;padding:10px 0}
.chk input{width:22px;height:22px;accent-color:var(--gold);flex:none}

/* dual field: license vs actual */
.dual{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--bg2)}
.dual .lbl{font-size:13.5px;font-weight:700;margin-bottom:8px}
.dual .pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dual .pair label{font-size:11.5px;color:var(--tx3);display:block;margin-bottom:4px}
.dual input{width:100%;padding:10px;border-radius:9px;background:var(--card);border:1px solid var(--line);color:var(--tx)}
@media(max-width:430px){.dual .pair{grid-template-columns:1fr}}
.dual.mismatch{border-color:var(--bad)}
.dual .flag{margin-top:8px;font-size:12.5px;color:var(--bad);font-weight:600}
.dual.blocked{border-color:var(--bad);background:rgba(209,72,63,.07)}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 0;position:sticky;top:62px;background:var(--bg);z-index:30;
  border-bottom:1px solid var(--line);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:8px 13px;border-radius:20px;border:1px solid var(--line);background:var(--bg2);
  font-size:13.5px;color:var(--tx2);white-space:nowrap}
.tab.on{border-color:var(--gold);color:var(--gold-soft);background:transparent;font-weight:700}
.tab .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--bad);margin-inline-start:5px;vertical-align:middle}

/* ---------- defects ---------- */
.sysrow{border:1px solid var(--line);border-radius:12px;margin:8px 0;background:var(--card);overflow:hidden}
.sysrow>.head{display:flex;align-items:center;gap:10px;padding:13px 14px;width:100%;text-align:start}
.sysrow .num{font-size:11.5px;color:var(--tx3);min-width:20px;font-variant-numeric:tabular-nums}
.sysrow .nm{flex:1;font-weight:600;font-size:15px}
.pill{font-size:11.5px;padding:3px 9px;border-radius:20px;border:1px solid var(--line);color:var(--tx3);white-space:nowrap}
.pill.ok{color:var(--ok);border-color:var(--ok)}
.pill.bad{color:var(--bad);border-color:var(--bad)}
.pill.na{color:var(--tx3)}
.pill.rec{color:var(--info);border-color:var(--info)}
.sysrow.isbad{border-color:var(--bad)}
.sysrow.safety{border-color:var(--bad);box-shadow:inset 0 0 0 1px var(--bad)}
.sysbody{border-top:1px solid var(--line);padding:14px;background:var(--bg2)}
.statepick{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
.statepick button{padding:9px 4px;border-radius:9px;border:1px solid var(--line);font-size:12.5px;color:var(--tx2);background:var(--card)}
.statepick button.on{border-color:var(--gold);color:var(--gold-soft);font-weight:700}
.dsearch{width:100%;padding:11px;border-radius:10px;background:var(--card);border:1px solid var(--line);color:var(--tx);margin-bottom:8px}
.dlist{max-height:270px;overflow-y:auto;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.ditem{display:flex;align-items:flex-start;gap:9px;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.ditem:last-child{border-bottom:none}
.ditem input{margin-top:3px;width:18px;height:18px;accent-color:var(--gold);flex:none}
.ditem.on{background:rgba(201,162,39,.09)}
.ditem span{font-size:14px}
.dgroup{padding:7px 12px;font-size:11.5px;letter-spacing:.06em;color:var(--tx3);background:var(--bg2);
  border-bottom:1px solid var(--line);position:sticky;top:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:5px 10px;border-radius:20px;
  border:1px solid var(--gold);color:var(--gold-soft)}
.chip b{cursor:pointer;color:var(--tx3);font-weight:400}

/* photos */
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;margin-top:10px}
.ph{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--bg2)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .x{position:absolute;top:3px;inset-inline-end:3px;width:24px;height:24px;border-radius:50%;
  background:rgba(0,0,0,.65);color:#fff;font-size:14px;display:grid;place-items:center}
.ph.add{display:grid;place-items:center;border-style:dashed;color:var(--tx3);font-size:22px}
.ph .cap{position:absolute;bottom:0;inset-inline:0;background:rgba(0,0,0,.6);color:#fff;font-size:9.5px;padding:2px 4px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* misc */
.alert{border-radius:12px;padding:12px 14px;font-size:13.5px;margin:10px 0;border:1px solid}
.alert.bad{border-color:var(--bad);background:rgba(209,72,63,.08);color:#ff9c94}
.alert.warn{border-color:var(--warn);background:rgba(217,154,43,.08);color:#f0c274}
.alert.ok{border-color:var(--ok);background:rgba(63,157,90,.08);color:#8fdca6}
.alert.info{border-color:var(--info);background:rgba(59,125,216,.08);color:#9dc3f5}
[data-mode="light"] .alert.bad{color:#9c2f27}
[data-mode="light"] .alert.warn{color:#8a6113}
[data-mode="light"] .alert.ok{color:#256b3a}
[data-mode="light"] .alert.info{color:#1e5199}

.list .it{display:flex;align-items:center;gap:12px;padding:13px 14px;border:1px solid var(--line);
  border-radius:12px;margin:8px 0;background:var(--card);text-align:start;width:100%}
.list .it .main{flex:1;min-width:0}
.list .it .t{font-weight:600;font-size:15px}
.list .it .d{font-size:12.5px;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.empty{text-align:center;padding:44px 20px;color:var(--tx3)}
.empty .ic{font-size:38px;opacity:.5;margin-bottom:10px}

.sheet{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.6);display:flex;align-items:flex-end}
.sheet .inner{background:var(--bg2);border-radius:18px 18px 0 0;width:100%;max-width:760px;margin:0 auto;
  max-height:90vh;overflow-y:auto;padding:18px var(--pad) 28px;border-top:1px solid var(--line)}
.sheet h3{margin:0 0 12px;font-size:17px}

.sig{border:1px dashed var(--line);border-radius:10px;background:var(--bg2);touch-action:none;width:100%;height:150px;display:block}

.kv-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv-row:last-child{border:none}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat .b{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.stat .b .n{font-size:26px;font-weight:800;color:var(--gold-soft);font-variant-numeric:tabular-nums}
.stat .b .l{font-size:12.5px;color:var(--tx3)}

.toast{position:fixed;bottom:22px;inset-inline:0;margin:0 auto;width:max-content;max-width:88%;
  background:var(--card);border:1px solid var(--gold);color:var(--tx);padding:11px 18px;border-radius:24px;
  z-index:200;font-size:14px;box-shadow:0 8px 26px rgba(0,0,0,.4)}

.undo{position:fixed;bottom:22px;inset-inline:0;margin:0 auto;width:max-content;max-width:92%;z-index:210;
  display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--gold);color:var(--tx);
  padding:9px 10px 9px 16px;border-radius:24px;font-size:14px;box-shadow:0 8px 26px rgba(0,0,0,.4)}
[dir="rtl"] .undo{padding:9px 16px 9px 10px}
.undo button{border:1px solid var(--gold);color:var(--gold-soft);border-radius:18px;padding:6px 14px;font-weight:700}
body.tabs-on .undo{bottom:calc(78px + env(safe-area-inset-bottom))}
.toast.above{bottom:84px}
body.tabs-on .toast.above{bottom:calc(140px + env(safe-area-inset-bottom))}
body.away #app{filter:blur(16px)}
.spin{width:18px;height:18px;border:2px solid var(--line);border-top-color:var(--gold);border-radius:50%;
  animation:sp .7s linear infinite;display:inline-block;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
.fade{animation:fd .18s ease}
@keyframes fd{from{opacity:0;transform:translateY(5px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- bottom navigation ---------- */
.nav{position:fixed;bottom:0;inset-inline:0;z-index:50;max-width:760px;margin:0 auto;background:var(--bg2);
  border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);
  padding-bottom:env(safe-area-inset-bottom)}
.nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:58px;
  padding:7px 2px;color:var(--tx3);font-size:11.5px;line-height:1.2}
.nav button .ni{font-size:19px;line-height:1.1}
.nav button.on{color:var(--gold-soft);font-weight:700}
.nav button:focus-visible,.backbtn:focus-visible{outline:2px solid var(--gold);outline-offset:-2px}
body.tabs-on .wrap{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
body.tabs-on .toast{bottom:calc(78px + env(safe-area-inset-bottom))}
.backbtn{flex:none;max-width:44%;height:38px;padding:0 12px;border-radius:10px;border:1px solid var(--gold);
  color:var(--gold-soft);font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}

/* ---------- print ---------- */
#printarea{display:none}
@media print{
  body>*{display:none!important}
  #printarea{display:block!important;color:#000;background:#fff;font-size:10.5pt}
  @page{size:A4;margin:12mm}
}
#printarea .pform{font-family:var(--font)}
#printarea table{width:100%;border-collapse:collapse;margin-top:6px}
#printarea th,#printarea td{border:1px solid #000;padding:3px 5px;font-size:9pt;vertical-align:top}
#printarea th{background:#e8e8e8;font-size:8.5pt}
#printarea h2{font-size:13pt;margin:0 0 4px;text-align:center}
#printarea .banner{border:2px solid #000;padding:5px;text-align:center;font-weight:bold;font-size:11pt;margin-bottom:8px}
#printarea .draft{color:#b00;border-color:#b00}
#printarea .kv{font-size:9pt;line-height:1.7}
#printarea .notes{font-size:7.5pt;line-height:1.35;margin-top:8px}
#printarea .sigrow{display:flex;gap:14px;margin-top:14px;font-size:9pt}
#printarea .sigrow>div{flex:1;text-align:center}
#printarea .sigrow img{max-width:100%;height:52px;object-fit:contain;border-bottom:1px solid #000;display:block}
#printarea .pagebreak{page-break-before:always}
#printarea .pgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#printarea .pgrid figure{margin:0}
#printarea .pgrid img{width:100%;border:1px solid #000}
#printarea .pgrid figcaption{font-size:8pt;padding-top:2px}
#printarea .safety{border:2px solid #b00;color:#b00;padding:6px;font-weight:bold;margin:8px 0;font-size:10pt}
</style>
</head>
<body data-theme="black" data-mode="dark">
<div id="app"></div>
<div id="printarea"></div>
<input type="file" id="picker" accept="image/*" capture="environment" hidden>
<script src="lang.js?v=1.8.0"></script>
<script>
/* יומן שגיאות — 10 האחרונות נשמרות במכשיר ומוצגות במסך האבחון */
(function(){var KEY="bdk_errlog";
  function add(m,src,ln){try{var a=JSON.parse(localStorage.getItem(KEY)||"[]");
    a.unshift({t:new Date().toISOString(),m:String(m).slice(0,220),s:String(src||"").split("/").pop().split("?")[0],l:ln||0});
    localStorage.setItem(KEY,JSON.stringify(a.slice(0,10)))}catch(e){}}
  window.addEventListener("error",function(e){add(e.message,e.filename,e.lineno)});
  window.addEventListener("unhandledrejection",function(e){add("promise: "+((e.reason&&e.reason.message)||e.reason))});
})();
/* =====================================================================
   בדק — נתוני נוהל 127 (נספח 5): נוסח האבחנות המחייב
   הטקסטים כאן הם לשון משרד התחבורה ואין לשנותם.
   ===================================================================== */
const D = {

function hash(x){let h=5381;for(let i=0;i<x.length;i++)h=((h<<5)+h+x.charCodeAt(i))>>>0;return String(h)}
const hasSubtle=!!(window.crypto&&crypto.subtle);
const b64=buf=>{let o="";const a=new Uint8Array(buf);for(let i=0;i<a.length;i++)o+=String.fromCharCode(a[i]);return btoa(o)};
const unb64=x=>Uint8Array.from(atob(x),c=>c.charCodeAt(0));
async function pinHash(pin,salt){
  if(!hasSubtle)return "d:"+hash(salt+":"+pin);
  return "s:"+b64(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(salt+":"+pin)))}
async function pinStore(pin,after){
  const salt=b64(crypto.getRandomValues(new Uint8Array(12)));
  S.pin={h:await pinHash(pin,salt),salt,after:after==null?5:after};store.set("pin",S.pin)}
async function pinCheck(pin){
  const p=S.pin;if(!p)return true;
  if(typeof p==="string"){                      /* קוד מגרסה ישנה — מאמתים ומסבים לגיבוב החדש */
    if(hash(pin)!==p)return false;await pinStore(pin,5);return true}
  return (await pinHash(pin,p.salt))===p.h}
/* מפתח הבינה: מוצפן במנוחה. מפתח ההצפנה אינו ניתן לייצוא ונשמר ב-IndexedDB.
   מגן על המפתח כשהוא שמור — לא מפני קוד זדוני שרץ באותו אתר בזמן השימוש. */
async function vaultKey(){
  let k=await kvGet("vault");
  if(!k){k=await crypto.subtle.generateKey({name:"AES-GCM",length:256},false,["encrypt","decrypt"]);await kvPut("vault",k)}
  return k}
async function encText(t){const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},await vaultKey(),new TextEncoder().encode(t));
  return {iv:b64(iv),ct:b64(ct)}}
async function decText(o){const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:unb64(o.iv)},await vaultKey(),unb64(o.ct));
  return new TextDecoder().decode(pt)}
function saveAi(){const o=Object.assign({},S.ai);if(o.enc)delete o.key;store.set("ai",o)}
async function setAiKey(v){
  S.ai.key=v;S.ai.enc=null;
  if(v&&hasSubtle){try{S.ai.enc=await encText(v)}catch(e){S.ai.enc=null}}
  saveAi()}
async function loadAiKey(){
  const a=S.ai;
  if(a.enc){try{a.key=await decText(a.enc)}catch(e){a.key="";a.enc=null;saveAi()}}
  else if(a.key&&hasSubtle){await setAiKey(a.key)}     /* מפתח גלוי מגרסה ישנה — מוצפן עכשיו */
}

let _db=null;
function db(){return new Promise((res,rej)=>{
  if(_db)return res(_db);
  const r=indexedDB.open("bdk_photos",2);
  r.onupgradeneeded=e=>{const d=e.target.result;
    if(!d.objectStoreNames.contains("ph"))d.createObjectStore("ph");
    if(!d.objectStoreNames.contains("kv"))d.createObjectStore("kv")};
  r.onsuccess=e=>{_db=e.target.result;res(_db)}; r.onerror=()=>rej(r.error);
})}
async function phPut(id,dataUrl){const d=await db();return new Promise((res,rej)=>{
  const t=d.transaction("ph","readwrite");t.objectStore("ph").put(dataUrl,id);t.oncomplete=res;t.onerror=()=>rej(t.error)})}
async function phGet(id){const d=await db();return new Promise(res=>{
  const t=d.transaction("ph","readonly");const q=t.objectStore("ph").get(id);q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null)})}
async function phDel(id){const d=await db();return new Promise(res=>{
  const t=d.transaction("ph","readwrite");t.objectStore("ph").delete(id);t.oncomplete=res;t.onerror=res})}
async function phKeys(){const d=await db();return new Promise(res=>{
  const q=d.transaction("ph","readonly").objectStore("ph").getAllKeys();q.onsuccess=()=>res(q.result||[]);q.onerror=()=>res([])})}
async function kvGet(k){const d=await db();return new Promise(res=>{
  const q=d.transaction("kv","readonly").objectStore("kv").get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>res(undefined)})}
async function kvPut(k,v){const d=await db();return new Promise((res,rej)=>{
  const t=d.transaction("kv","readwrite");t.objectStore("kv").put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error)})}
async function phAll(ids){const out={};for(const i of ids)out[i]=await phGet(i);return out}

/* compress before storing — a raw phone photo is 4–8 MB */
function compress(file,max=1400,q=.72){return new Promise((res,rej)=>{
  const fr=new FileReader();
  fr.onload=()=>{const im=new Image();
    im.onload=()=>{let{width:w,height:h}=im;const s=Math.min(1,max/Math.max(w,h));
      const c=document.createElement("canvas");c.width=Math.round(w*s);c.height=Math.round(h*s);
      c.getContext("2d").drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",q))};
    im.onerror=rej;im.src=fr.result};
  fr.onerror=rej;fr.readAsDataURL(file)})}

function plateVariants(p){const c=String(p).replace(/\D/g,"");const v=[c];

/* שמות השדות נבדקו מול המאגרים החיים: במאגר הריקול השדה הוא MISPAR_RECHEV (אותיות גדולות);
   שדה שלא קיים מחזיר 404 ולא "אין תוצאות". מאגר ההיסטוריה מחזיק רק את הק״מ מהטסט האחרון. */
async function lookupPlate(plate){
  const vars=plateVariants(plate); let veh=null;
  for(const p of vars){const r=await moFetch(RES.veh,{mispar_rechev:p},1);if(r.length){veh=r[0];break}}
  if(!veh)return null;
  const used=String(veh.mispar_rechev||vars[0]), failed=[];
  const grab=async(name,rid,field,lim)=>{try{const seen=new Set(),out=[];
      for(const p of vars)for(const x of await moFetch(rid,{[field]:p},lim))if(!seen.has(x._id)){seen.add(x._id);out.push(x)}
      return out}catch(e){failed.push(name);return []}};
  const [hist,recall,own]=await Promise.all([
    grab("hist",RES.hist,"mispar_rechev",5),
    grab("recall",RES.recall,"MISPAR_RECHEV",30),
    grab("own",RES.own,"mispar_rechev",60)]);
  const h0=hist[0]||{}, one=x=>String(x==null?"":x).trim()==="1";
  const lastKm=parseInt(String(h0.kilometer_test_aharon==null?"":h0.kilometer_test_aharon).replace(/\D/g,""))||null;
  const lastTest=String(veh.mivchan_acharon_dt||"").split("T")[0];
  const tokef=String(veh.tokef_dt||"").split("T")[0];
  const owners=own.map(o=>({ym:String(o.baalut_dt||""),type:String(o.baalut||"").trim()}))
    .sort((a,b)=>a.ym.localeCompare(b.ym));
  const flags=[];
  if(tokef&&tokef<today())flags.push({lv:"warn",k:"mo_expired",x:dmy(tokef)});
  if(one(h0.shinui_mivne_ind))flags.push({lv:"warn",k:"mo_struct"});
  if(one(h0.shnui_zeva_ind))flags.push({lv:"warn",k:"mo_color"});
  if(one(h0.shinui_zmig_ind))flags.push({lv:"info",k:"mo_tire"});
  if(one(h0.gapam_ind))flags.push({lv:"info",k:"mo_lpg"});
  const mk=String(h0.mkoriut_nm||"").trim();
  if(mk&&!["None","מקורי","חדש"].includes(mk))
    flags.push(/החכר|ליסינג/.test(mk)?{lv:"info",k:"mo_orig",x:mk,lease:1}:{lv:"warn",k:"mo_orig",x:mk});
  [...new Set(owners.map(o=>o.type).filter(t=>t&&t!=="פרטי"))].forEach(t=>
    flags.push({lv:/השכר|מונית|לימוד|סוחר/.test(t)?"warn":"info",k:"mo_own_was",x:t}));
  return {v:2,plate:used,at:Date.now(),failed,
    make:veh.tozeret_nm||"",model:veh.kinuy_mishari||veh.degem_nm||"",year:veh.shnat_yitzur||"",
    trim:veh.ramat_gimur||"",vin:veh.misgeret||"",color:veh.tzeva_rechev||"",vtype:({P:"פרטי",M:"מסחרי"})[veh.sug_degem]||veh.sug_degem||"",
    tireF:veh.zmig_kidmi||"",tireR:veh.zmig_ahori||"",fuel:veh.sug_delek_nm||"",
    engno:h0.mispar_manoa||"",lastKm,lastTest,tokef,owners,flags,
    recalls:recall.map(r=>({type:r.SUG_RECALL||"",area:r.SUG_TAKALA||"",text:String(r.TEUR_TAKALA||"").replace(/\s+/g," ").trim(),
      date:String(r.TAARICH_PTICHA||"").split("T")[0]}))}
}

/* חינם: התאמת מילים. Pro: שכבת API עם ספק לבחירת המשתמש. */
function normalize(s){return String(s).replace(/[״"׳'.,()\/]/g," ").replace(/\s+/g," ").trim()}
const STOP=new Set(["של","עם","על","יש","אין","את","לא","כן","זה","היא","הוא","וגם","גם","או","ב","ל","מ","ה"]);
function ruleSuggest(text,pool){
  const words=normalize(text).split(" ").filter(w=>w.length>2&&!STOP.has(w));
  if(!words.length)return [];
  const scored=pool.map(item=>{
    const n=normalize(item);let sc=0;
    for(const w of words){
      if(n.includes(w))sc+=w.length>=4?3:2;
      else{const stem=w.slice(0,Math.max(3,w.length-2));if(stem.length>=3&&n.includes(stem))sc+=1}
    }
    return{item,sc}}).filter(x=>x.sc>0).sort((a,b)=>b.sc-a.sc);
  return scored.slice(0,6).map(x=>x.item);
}
async function aiOnce(model,prompt){
  const a=S.ai, fail=r=>{const e=new Error("HTTP "+r.status);e.status=r.status;return e};
  if(a.provider==="claude"){
    const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",
      headers:{"Content-Type":"application/json","x-api-key":a.key,"anthropic-version":"2023-06-01",
        "anthropic-dangerous-direct-browser-access":"true"},
      body:JSON.stringify({model,max_tokens:800,messages:[{role:"user",content:prompt}]})});
    if(!r.ok)throw fail(r);
    const d=await r.json();return (d.content&&d.content[0]&&d.content[0].text)||"";
  }
  if(a.provider==="gemini"){
    const r=await fetch("https://generativelanguage.googleapis.com/v1beta/models/"+encodeURIComponent(model)+":generateContent?key="+encodeURIComponent(a.key),
      {method:"POST",headers:{"Content-Type":"application/json"},
       body:JSON.stringify({contents:[{parts:[{text:prompt}]}],generationConfig:{temperature:.2,maxOutputTokens:800}})});
    if(!r.ok)throw fail(r);
    const d=await r.json();return d?.candidates?.[0]?.content?.parts?.[0]?.text||"";
  }
  /* openai / local (ollama, lm studio) — תואמי OpenAI */
  const url=a.url||"https://api.openai.com/v1/chat/completions";
  const h={"Content-Type":"application/json"}; if(a.key)h.Authorization="Bearer "+a.key;
  const r=await fetch(url,{method:"POST",headers:h,
    body:JSON.stringify({model,max_tokens:800,messages:[{role:"user",content:prompt}]})});
  if(!r.ok)throw fail(r);
  const d=await r.json();return d?.choices?.[0]?.message?.content||"";
}
/* מנסה מודל אחרי מודל; מפתח שגוי (401/403) עוצר מיד, מודל שלא קיים עובר לבא בתור */
async function aiCall(prompt){
  let chain=aiChain(); if(!chain.length)chain=[S.ai.model||""];
  let last;
  for(const m of chain){
    try{const out=await aiOnce(m,prompt);
      if(S.ai.okModel!==m){S.ai.okModel=m;saveAi()}
      return out}
    catch(e){last=e;if(e.status===401||e.status===403)break}
  }
  throw last||new Error("AI");
}
/* הבינה בוחרת מתוך הרשימה הסגורה — לעולם לא מנסחת אבחנה חדשה */
async function aiSuggest(text,pool){
  if(!S.ai.provider||(!S.ai.key&&!S.ai.url))return ruleSuggest(text,pool);
  const numbered=pool.map((x,i)=>(i+1)+". "+x).join("\n");
  const prompt="אתה עוזר לבוחן רכב בישראל. להלן רשימה סגורה וממוספרת של אבחנות מתוך נספח 5 להוראת נוהל 127 של משרד התחבורה.\n\n"+
    numbered+"\n\nתיאור הבוחן: \""+text+"\"\n\nבחר עד 6 מספרים מהרשימה שמתאימים לתיאור, לפי סדר התאמה יורד. "+
    "החזר אך ורק את המספרים מופרדים בפסיקים, בלי טקסט נוסף. אם שום פריט לא מתאים — החזר ריק. "+
    "אל תמציא ניסוח חדש ואל תחזיר פריט שאינו ברשימה.";
  try{
    const out=await aiCall(prompt);
    const idx=(out.match(/\d+/g)||[]).map(n=>parseInt(n)-1).filter(i=>i>=0&&i<pool.length);
    const uniq=[...new Set(idx)].slice(0,6).map(i=>pool[i]);
    return uniq.length?uniq:ruleSuggest(text,pool);
  }catch(e){toast(T('ai_fallback'));return ruleSuggest(text,pool)}
}

  if(S.screen!=="home"){S.screen="home";navStack=[];window.scrollTo(0,0);render();return true}

/* ---------- כרית חתימה ---------- */
function sigPad(cv,onEnd,existing){
  if(!cv)return; const r=cv.getBoundingClientRect();
  cv.width=Math.max(1,r.width*2);cv.height=Math.max(1,r.height*2);
  const c=cv.getContext&&cv.getContext("2d"); if(!c){cv._clear=()=>{};return}
  c.scale(2,2);c.lineWidth=2;c.lineCap="round";
  c.strokeStyle=getComputedStyle(document.body).getPropertyValue("--tx").trim()||"#fff";
  if(existing){const im=new Image();im.onload=()=>c.drawImage(im,0,0,r.width,r.height);im.src=existing}
  let dr=false;
  const pt=e=>{const b=cv.getBoundingClientRect();const t=e.touches?e.touches[0]:e;
    return[t.clientX-b.left,t.clientY-b.top]};
  const down=e=>{e.preventDefault();dr=true;const[x,y]=pt(e);c.beginPath();c.moveTo(x,y)};
  const move=e=>{if(!dr)return;e.preventDefault();const[x,y]=pt(e);c.lineTo(x,y);c.stroke()};
  const up=()=>{if(!dr)return;dr=false;onEnd&&onEnd(cv.toDataURL("image/png"))};
  cv.onpointerdown=down;cv.onpointermove=move;cv.onpointerup=up;cv.onpointerleave=up;
  cv._clear=()=>{c.clearRect(0,0,cv.width,cv.height);onEnd&&onEnd(null)};
}

function dlBlob(name,blob){const u=URL.createObjectURL(blob);
  const a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),4000)}
/* הקובץ נבנה חלק-חלק (Blob) כדי שגם מאות צילומים לא ימלאו את הזיכרון.
   קוד הנעילה ומפתח הבינה לעולם לא נכנסים לגיבוי. */
async function exportBackup(full){
  const data={v:3,app:"bdk",ver:APP_VER,kind:full?"full":"data",exported:new Date().toISOString(),
    user:S.user,inst:S.inst,recs:S.recs,appts:S.appts,km:S.km,map:S.map,scope:S.scope};
  const parts=[JSON.stringify(data).slice(0,-1)];let n=0,missing=0;
  if(full){
    const ids=allPhotoIds(),out=$("#bkout");
    parts.push(',"photos":{');
    for(let i=0;i<ids.length;i++){
      const d=await phGet(ids[i]);
      if(!d){missing++;continue}
      parts.push((n?",":"")+JSON.stringify(ids[i])+":"+JSON.stringify(d));n++;
      if(out&&i%5===0)out.textContent=TF('bk_building',{n:i+1,t:ids.length})}
    parts.push("}")}
  parts.push("}");
  dlBlob("bdk-"+(full?"full":"data")+"-"+today()+".json",new Blob(parts,{type:"application/json"}));
  if(full){store.set("lastbackup",{t:Date.now(),n});store.del("bksnooze")}
  render();
  toast(missing?TF('bk_missing',{n:missing}):TF('bk_done',{r:S.recs.length,n}),missing?5000:3000)}
function normRec(r){
  const base=newRec(r&&r.kind);
  r=Object.assign(base,r||{});
  ["veh","ins","buyer","seller","pay"].forEach(k=>{r[k]=Object.assign({},newRec()[k],r[k]||{})});
  if(!r.photos||typeof r.photos!=="object")r.photos={};
  if(!r.defects||typeof r.defects!=="object")r.defects={};
  Object.keys(r.defects).forEach(n=>{const d=r.defects[n]||{};
    r.defects[n]={st:d.st||"",items:Array.isArray(d.items)?d.items:[],notes:d.notes||"",safety:!!d.safety,photos:Array.isArray(d.photos)?d.photos:[]}});
  if(!r.id)r.id=uid();
  return r}
/* סדר מחייב: קודם כותבים את הצילומים, ורק אחרי שהכול הצליח מחליפים את הנתונים.
   כישלון באמצע משאיר את המצב הקיים כמו שהוא. */
async function restoreBackup(d){
  const recs=d.recs.map(normRec), photos=d.photos||null;
  if(photos)for(const id of Object.keys(photos)){
    if(typeof photos[id]!=="string"||photos[id].indexOf("data:image/")!==0)continue;
    await phPut(id,photos[id])}
  S.recs=recs;S.appts=Array.isArray(d.appts)?d.appts:[];S.km=(d.km&&typeof d.km==="object")?d.km:{};
  if(d.user)S.user=Object.assign({name:"",cert:""},d.user);
  if(d.inst)S.inst=Object.assign({name:"",lic:"",addr:"",phone:""},d.inst);
  if(d.map&&d.map.full&&d.map.basic){S.map=d.map;if(d.scope&&d.scope.engine&&d.scope.chassis)S.scope=d.scope;saveMap()}
  store.set("user",S.user);store.set("inst",S.inst);persist();S.cur=null;
  if(photos){                                  /* גיבוי מלא: מנקים צילומים שכבר לא שייכים לאף בדיקה */
    const keep=new Set(allPhotoIds());
    for(const k of await phKeys())if(!keep.has(k)&&!(k.indexOf("orig_")===0&&keep.has(k.slice(5))))await phDel(k)}
}
function deleteRec(id){
  const i=S.recs.findIndex(x=>x.id===id);if(i<0)return;

/* ---------- מנוע ההכתבה: טקסט חופשי → סעיף + אבחנה מנספח 5 ----------
   כלל: הבינה ומנוע החוקים רק בוחרים מתוך הרשימה הסגורה. כל הצעה עוברת אישור של הבוחן. */
const HFIN={"ך":"כ","ם":"מ","ן":"נ","ף":"פ","ץ":"צ"};
const DSTOP=new Set(["של","עם","על","יש","אין","את","לא","כן","זה","זאת","היא","הוא","וגם","גם","או","גם","קצת","מאוד","יותר","פחות","אצל","רכב","הרכב","יש","מה","כל","שם","פה","כמו","עוד","בנוסף","אחר","כך","טוב","בסדר","אז","צריך","להחליף","להחלפה","קיים","קיימת","נמצא","נמצאה","נראה","נראית","ממש","די","קל","קלה","אינו","אינה","אינם","אינן"]);
/* מילים נרדפות מהשטח — מוסיפות צורה משותפת למילה */
const DEQ={"רועש":"רעש","רועשת":"רעש","רועשים":"רעש","רעשים":"רעש","רקוב":"ריקבנ","רקובה":"ריקבנ","ריקבון":"ריקבנ","שבור":"שבר","שבורה":"שבר","שבורים":"שבר","סדוק":"סדק","סדוקה":"סדק","סדוקים":"סדק","נוזל":"נזיל","דולף":"נזיל","דולפת":"נזיל","נזילה":"נזיל","נזילות":"נזיל","נזילת":"נזיל","עובד":"פועל","עובדת":"פועל","עובדים":"פועל","פועלת":"פועל","רצפה":"ריצפה","שחוק":"שחוק","שחוקה":"שחוק","שחוקים":"שחוק","שחוקות":"שחוק"};
const DEQN={};for(const k in DEQ)DEQN[k.replace(/[ךםןףץ]/g,c=>HFIN[c])]=DEQ[k];
/* ביטויים מהשטח → המילים של הנוסח הרשמי */
const SLANG=[
 [/פדים|פדי בלם|רפידות גמורות|רפידות בסוף/g,"רפידות שחוקות"],[/דיסקים|דיסקיות בלם|דיסקי בלם/g,"צלחות"],
 [/קלאץ'?|קלאץ׳/g,"מצמד"],[/גיר אוטומטי/g,"תיבה אוטומטית"],[/(^|[\sו])גיר(?![א-ת])/g,"$1תיבת הילוכים"],
 [/אמורטיזטורים|אמורטיזטור|בולמים/g,"בולמי זעזועים"],[/בירינגים|בירינג|מיסבים/g,"מסבי גלגלים"],
 [/דינמו/g,"אלטרנטור"],[/סטרטר|סטארטר/g,"מתנע"],[/רדיאטור/g,"מצנן"],[/טרמוסטט/g,"תרמוסטט"],
 [/אגזוז/g,"מערכת פליטה"],[/קטליזטור|קטליטי/g,"ממיר קטליטי"],[/טורבו/g,"מגדש טורבו"],
 [/מזיע שמן|הזעת שמן|מזיעה שמן|דולף שמן|דליפת שמן|נוזל שמן|מטפטף שמן/g,"נזילות שמן"],
 [/דולף מים|דליפת מים|מטפטף מים/g,"נזילות מים"],[/חלודה|חלוד|ריקבון(?= ב(?:סף|רצפה|ריצפה|קורה|עמוד|גג|דופן|שלדה))/g,"איכול"],[/מכה|תאונה|מעוך/g,"פגיעה"],
 [/ימין/g,"ימני"],[/שמאל(?!י)/g,"שמאלי"],[/קדימה/g,"קדמי"],[/אחורה/g,"אחורי"],
 [/צמיג רזרבי|רזרבי|ספייר/g,"גלגל חילוף"],[/נורה|פנס שרוף/g,"פנס"],[/מגבונים|מגב/g,"מגבים"],
 [/מצבר חלש מאוד|מצבר מת/g,"מצבר פגום"],[/סיבובים לא יציבים|סרק לא יציב/g,"סיבובי מנוע לא יציבים"],
 [/זיופים|מזייף/g,"מנוע מזייף"],[/תפוס|תפוסה/g,"פגום"],[/גומיות מייצב/g,"תותבים מייצב"]
];
function dWords(t){return String(t||"").replace(/[״"׳'.,;:!?()\[\]\/\\\-–—]/g," ").split(/\s+/).filter(Boolean)}
/* צורות אפשריות של מילה: בלי תחיליות (ו, ה, ב, ל, מ, ש, כ) ובלי סיומות רבים/נקבה */
function dForms(w){
  w=w.replace(/[ךםןףץ]/g,c=>HFIN[c]).toLowerCase();
  const out=new Set(),add=x=>{if(x.length>=2)out.add(x)};
  const bases=[w];
  if(/^[א-ת]/.test(w)){
    if(w.length>=3&&/^[והבלמשכ]/.test(w))bases.push(w.slice(1));
    if(w.length>4&&/^[והבלמשכ][הבלמכ]/.test(w))bases.push(w.slice(2));}
  bases.slice().forEach(b=>{const q=DEQN[b];if(q)out.add(q)});
  for(const b of bases){add(b);
    const s=b.replace(/(יות|ים|ות)$/,"");if(s!==b)add(s);
    const s2=b.replace(/[התי]$/,"");if(s2!==b&&s2.length>=3)add(s2)}
  if(!out.size&&w.length)out.add(w);
  return out}
let DIDX=null;
function dIndex(rec){
  const key=formKey()+"|"+rec.veh.chassis+"|"+JSON.stringify(S.map[formKey()]).length;
  if(DIDX&&DIDX.key===key)return DIDX;
  const ents=[],byItem=new Map();
  form().forEach(row=>{flatPool(row,rec).forEach(item=>{
    if(!byItem.has(item)){const toks=dWords(item).filter(w=>w.length>=2&&!DSTOP.has(w)).map(w=>({w,f:dForms(w)}));
      const e={item,rows:[],toks};byItem.set(item,e);ents.push(e)}
    byItem.get(item).rows.push(row.n)})});
  const df=new Map();
  ents.forEach(e=>{const seen=new Set();e.toks.forEach(t=>t.f.forEach(f=>seen.add(f)));seen.forEach(f=>df.set(f,(df.get(f)||0)+1))});
  const N=ents.length;
  ents.forEach(e=>e.toks.forEach(t=>{let m=0;t.f.forEach(f=>{m=Math.max(m,df.get(f)||0)});t.wt=Math.log((N+1)/(1+m))+0.15}));
  const rowF=form().map(row=>({n:row.n,f:dWords(row.t).filter(w=>w.length>2&&!/מערכת|מערכות/.test(w)).map(dForms)}));
  DIDX={key,ents,rowF};return DIDX}
const fHit=(a,b)=>{for(const x of a)if(b.has(x))return true;return false};
function ruleParse(text,rec){
  let t=" "+String(text||"")+" ";
  SLANG.forEach(([re,rep])=>{t=t.replace(re,rep)});
  const W=dWords(t).map(w=>({w,f:dForms(w),stop:DSTOP.has(w)}));
  const X=dIndex(rec),cands=[];
  for(const e of X.ents){
    const tot=e.toks.reduce((a,b)=>a+b.wt,0);if(!tot)continue;
    const hits=[];
    e.toks.forEach((tk,ti)=>W.forEach((w,wi)=>{if(!w.stop&&fHit(tk.f,w.f))hits.push({ti,wi})}));
    if(!hits.length)continue;
    const span=e.toks.length+1;let best=null;
    hits.forEach(h0=>{const inWin=hits.filter(h=>h.wi>=h0.wi&&h.wi<h0.wi+span);
      const tis=new Set(inWin.map(h=>h.ti));let got=0;tis.forEach(i=>{got+=e.toks[i].wt});
      if(!best||got>best.got)best={got,pos:[...new Set(inWin.map(h=>h.wi))],tis}});
    const ratio=best.got/tot;
    if(ratio<0.5||best.tis.size<Math.min(2,e.toks.length))continue;
    cands.push({e,ratio,got:best.got,pos:best.pos})}
  cands.sort((a,b)=>(b.ratio>=.85)-(a.ratio>=.85)||b.got-a.got||b.ratio-a.ratio);
  const used=new Set(),picked=[];
  for(const c of cands){
    const over=c.pos.filter(p=>used.has(p)).length;
    if(over&&over>=c.pos.length/2)continue;
    c.pos.forEach(p=>used.add(p));picked.push(c);if(picked.length>=12)break}
  const props=picked.map(c=>{
    const lo=Math.min(...c.pos),hi=Math.max(...c.pos),ctx=W.slice(Math.max(0,lo-4),hi+5);
    let n=c.e.rows[0];
    if(c.e.rows.length>1){let bs=0;c.e.rows.forEach(rn=>{const rf=X.rowF.find(x=>x.n===rn);
      const s=rf?rf.f.filter(f=>ctx.some(w=>fHit(f,w.f))).length:0;if(s>bs){bs=s;n=rn}})}
    const alts=cands.filter(o=>o!==c&&o.e.rows.includes(n)&&o.pos.some(p=>c.pos.includes(p))).slice(0,3).map(o=>o.e.item);
    return {n,item:c.e.item,alts,score:c.ratio,checked:c.ratio>=.7,src:"rules",pos:c.pos}});
  /* מה שנשאר לא מזוהה — מוצע כהערה כללית (לא מסומן) */
  const left=W.map((w,i)=>used.has(i)||w.stop?null:w.w).reduce((acc,w)=>{
    if(w===null){if(acc.cur.length)acc.out.push(acc.cur);acc.cur=[]}else acc.cur.push(w);return acc},{out:[],cur:[]});
  if(left.cur.length)left.out.push(left.cur);
  const leftover=left.out.filter(g=>g.length>=2).map(g=>g.join(" ")).join(", ");
  return {props,leftover}}
async function aiParse(text,rec){
  const X=dIndex(rec),list=[];
  X.ents.forEach(e=>e.rows.forEach(n=>list.push({n,item:e.item})));
  const rowName=n=>(form().find(r=>r.n===n)||{}).t||"";
  const numbered=list.map((x,i)=>(i+1)+". ["+rowName(x.n)+"] "+x.item).join("\n");
  const prompt="אתה עוזר לבוחן רכב בישראל. להלן רשימה סגורה וממוספרת של אבחנות לפי סעיפי הטופס (נספח 5, הוראת נוהל 127).\n\n"+numbered+
    "\n\nהבוחן הכתיב: \""+text+"\"\n\nזהה כל ליקוי שהבוחן ציין ובחר עבורו את המספר המתאים ביותר מהרשימה (שים לב לסעיף בסוגריים). "+
    "החזר אך ורק JSON בפורמט [{\"i\":מספר,\"sure\":true/false}] בלי טקסט נוסף. אל תמציא פריט שאינו ברשימה. ליקוי שאין לו התאמה — אל תכלול.";
  const out=await aiCall(prompt);
  const m=out.match(/\[[\s\S]*\]/);if(!m)throw new Error("AI format");
  const arr=JSON.parse(m[0]);const seen=new Set(),props=[];
  arr.forEach(o=>{const i=parseInt(o&&o.i)-1;if(!(i>=0&&i<list.length))return;const x=list[i];
    const k=x.n+"|"+x.item;if(seen.has(k))return;seen.add(k);
    props.push({n:x.n,item:x.item,alts:[],score:o.sure===false?.6:.95,checked:o.sure!==false,src:"ai"})});
  return {props,leftover:""}}
async function dictParse(text,rec){
  const base=ruleParse(text,rec);
  if(aiConnected()){
    try{const a=await aiParse(text,rec);if(a.props.length){a.leftover=base.leftover&&!a.props.length?base.leftover:"";return Object.assign(a,{by:"ai"})}}
    catch(e){toast(T('ai_fallback'))}}
  return Object.assign(base,{by:"rules"})}

/* ---------- PDF: הדוח המודפס → עמודי A4 כתמונות → קובץ PDF לשיתוף ----------
   בלי ספריות: הדף מצויר דרך SVG foreignObject, נחתך בנקודות בטוחות (סוף שורה, סוף בלוק), ונארז ב-PDF. */
const PDF_CSS=`*{box-sizing:border-box}
.pform{font-family:"Assistant","Heebo","Segoe UI",Arial,sans-serif;color:#000;background:#fff;font-size:10.5pt;direction:rtl}

.pform h3{font-size:11pt;margin:10px 0 4px}
.pform .banner{border:2px solid #000;padding:5px;text-align:center;font-weight:bold;font-size:11pt;margin-bottom:8px}
.pform .draft{color:#b00;border-color:#b00}
.pform .kv{font-size:9pt;line-height:1.7}
.pform .notes{font-size:7.5pt;line-height:1.35;margin-top:8px}
.pform .sigrow{display:flex;gap:14px;margin-top:14px;font-size:9pt}
.pform .sigrow>div{flex:1;text-align:center}
.pform .sigrow img{max-width:100%;height:52px;object-fit:contain;border-bottom:1px solid #000;display:block}
.pform .pgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.pform .safety{border:2px solid #b00;color:#b00;padding:6px;font-weight:bold;margin:8px 0;font-size:10pt}`;
const PDF_W=794,PDF_H=1123,PDF_M=45;           /* A4 ב-96dpi, שוליים של 12 מ״מ */
async function buildPdf(onPage){
  await buildPrint();
  const box=document.createElement("div");
  /* כל מה שעובר בירושה נקבע כאן במפורש, כדי שהמדידה בדף והציור בתמונה ייצאו זהים */
  box.style.cssText="position:fixed;left:-20000px;top:0;width:"+(PDF_W-2*PDF_M)+"px;background:#fff;color:#000;visibility:hidden;"+
    "font:16px/normal Assistant,Heebo,'Segoe UI',Arial,sans-serif;direction:rtl;text-align:right;letter-spacing:normal;word-spacing:normal;white-space:normal";
  box.innerHTML="<style>"+PDF_CSS+"</style>"+$("#printarea").innerHTML;
  document.body.appendChild(box);
  try{
    await Promise.all([...box.querySelectorAll("img")].map(im=>im.complete?0:new Promise(r=>{im.onload=im.onerror=r})));
    const top0=box.getBoundingClientRect().top,total=box.scrollHeight,ch=PDF_H-2*PDF_M;
    /* נקודות חיתוך: סוף כל שורת טבלה, כותרת, תמונה ובלוק; ומעבר עמוד מחייב לפני הנספח */
    const cuts=new Set([total]),forced=[];
    box.querySelectorAll("tr,.kv,.notes,.sigrow,.safety,.banner,figure,.pform>div,.pform>div>div,.pgrid").forEach(el=>{
      const r=el.getBoundingClientRect();cuts.add(Math.ceil(r.bottom-top0))});
    /* כותרת לא נשארת לבד בתחתית עמוד: חותכים לפניה, לא אחריה */
    const heads=[];box.querySelectorAll("h2,h3").forEach(el=>{const r=el.getBoundingClientRect();
      const t=Math.floor(r.top-top0)-2;cuts.add(t);heads.push([t,Math.ceil(r.bottom-top0)])});
    heads.forEach(([t,b])=>{[...cuts].forEach(v=>{if(v>t&&v<=b+4)cuts.delete(v)})});
    box.querySelectorAll(".pagebreak").forEach(el=>forced.push(Math.floor(el.getBoundingClientRect().top-top0)));
    const cs=[...cuts].sort((a,b)=>a-b),pages=[];let y=0;
    while(y<total-2){
      const f=forced.find(v=>v>y+20&&v<=y+ch);
      let end=f||Math.max(...cs.filter(v=>v>y+40&&v<=y+ch),0);
      if(!end)end=Math.min(y+ch,total);
      pages.push([y,end]);y=end}
    const xml=new XMLSerializer().serializeToString(box).replace(/visibility:\s*hidden;?/,"").replace(/position:\s*fixed;?|left:\s*-20000px;?/g,"");
    const out=[];
    for(let i=0;i<pages.length;i++){
      if(onPage)onPage(i+1,pages.length);
      const [a,b]=pages[i],h=b-a;
      const svg='<svg xmlns="http://www.w3.org/2000/svg" width="'+PDF_W+'" height="'+PDF_H+'"><rect width="100%" height="100%" fill="#fff"/>'+
        '<foreignObject x="'+PDF_M+'" y="'+PDF_M+'" width="'+(PDF_W-2*PDF_M)+'" height="'+h+'">'+
        '<div xmlns="http://www.w3.org/1999/xhtml" style="width:'+(PDF_W-2*PDF_M)+'px;height:'+h+'px;overflow:hidden;background:#fff">'+
        '<div style="margin-top:-'+a+'px">'+xml+'</div></div></foreignObject></svg>';
      const img=new Image();
      await new Promise((res,rej)=>{img.onload=res;img.onerror=()=>rej(new Error("render"));img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg)});
      const sc=2,c=document.createElement("canvas");c.width=PDF_W*sc;c.height=PDF_H*sc;
      const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);
      out.push(await new Promise(r=>c.toBlob(b=>r(b),"image/jpeg",.85)));
      await new Promise(r=>setTimeout(r,0))}
    return await jpegPdf(out)}
  finally{box.remove()}}
/* קובץ PDF מינימלי: עמוד A4 לכל תמונת JPEG */
async function jpegPdf(blobs){
  const enc=new TextEncoder(),parts=[],offs=[];let len=0;
  const push=x=>{const u=typeof x==="string"?enc.encode(x):x;parts.push(u);len+=u.length};
  const obj=(n,body)=>{offs[n]=len;push(n+" 0 obj\n");body();push("\nendobj\n")};
  const imgs=[];for(const b of blobs)imgs.push(new Uint8Array(await b.arrayBuffer()));
  const n=imgs.length,W=595.28,H=841.89;
  push("%PDF-1.4\n%\xE2\xE3\xCF\xD3\n");
  obj(1,()=>push("<< /Type /Catalog /Pages 2 0 R >>"));
  obj(2,()=>push("<< /Type /Pages /Count "+n+" /Kids ["+imgs.map((_,i)=>(3+i*3)+" 0 R").join(" ")+"] >>"));
  imgs.forEach((im,i)=>{const p=3+i*3,cs="q "+W+" 0 0 "+H+" 0 0 cm /Im0 Do Q";
    obj(p,()=>push("<< /Type /Page /Parent 2 0 R /MediaBox [0 0 "+W+" "+H+"] /Resources << /XObject << /Im0 "+(p+2)+" 0 R >> >> /Contents "+(p+1)+" 0 R >>"));
    obj(p+1,()=>{push("<< /Length "+cs.length+" >>\nstream\n");push(cs);push("\nendstream")});
    obj(p+2,()=>{push("<< /Type /XObject /Subtype /Image /Width "+(PDF_W*2)+" /Height "+(PDF_H*2)+" /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length "+im.length+" >>\nstream\n");push(im);push("\nendstream")})});
  const xref=len,tot=3+n*3;
  push("xref\n0 "+tot+"\n0000000000 65535 f \n");
  for(let i=1;i<tot;i++)push(String(offs[i]).padStart(10,"0")+" 00000 n \n");
  push("trailer\n<< /Size "+tot+" /Root 1 0 R >>\nstartxref\n"+xref+"\n%%EOF");
  return {blob:new Blob(parts,{type:"application/pdf"}),pages:n}}
async function sharePdf(){
  const r=S.cur;if(!r)return;

      catch(e){if(e&&e.name==="AbortError")return}}

function toastKeep(m){document.querySelectorAll(".toast").forEach(x=>x.remove());

let MK=null;
async function openMarkup(id){
  const src=await phGet(id);if(!src)return;
  const orig=await phGet("orig_"+id);
  closeSheet();
  sheet(T('mk_edit'),`<div class="tiny">${esc(T('mk_hint'))}</div>
    <canvas id="mkc" style="width:100%;border-radius:10px;touch-action:none;background:#000;margin-top:8px;display:block"></canvas>
    <div class="row" style="flex-wrap:wrap;gap:6px;margin-top:8px">
      ${["arrow","circle","pen"].map(t=>`<button class="btn sm" data-act="mktool" data-t="${t}" style="flex:none">${esc(T('mk_'+t))}</button>`).join("")}
      ${["#ff2d2d","#ffd400","#2dd4ff"].map(c=>`<button class="btn sm" data-act="mkcol" data-c="${c}" style="flex:none;width:38px;background:${c};border-color:${c}">&nbsp;</button>`).join("")}
      <button class="btn sm" data-act="mkundo" style="flex:none">${esc(T('mk_undo'))}</button></div>
    <button class="btn solid" data-act="mksave">${esc(T('mk_save'))}</button>
    ${orig?`<button class="btn" data-act="mkrestore">${esc(T('mk_restore'))}</button>`:""}`,T('cancel'));
  const cv=$("#mkc"),img=new Image();
  await new Promise(r=>{img.onload=r;img.src=src});
  cv.width=img.naturalWidth;cv.height=img.naturalHeight;
  MK={id,img,cv,ctx:cv.getContext("2d"),shapes:[],tool:"arrow",col:"#ff2d2d",cur:null};
  mkDraw();mkTools();
  const pt=e=>{const b=cv.getBoundingClientRect();return[(e.clientX-b.left)*cv.width/b.width,(e.clientY-b.top)*cv.height/b.height]};
  cv.onpointerdown=e=>{e.preventDefault();cv.setPointerCapture(e.pointerId);const p=pt(e);MK.cur={t:MK.tool,c:MK.col,pts:[p,p]}};
  cv.onpointermove=e=>{if(!MK.cur)return;const p=pt(e);if(MK.cur.t==="pen")MK.cur.pts.push(p);else MK.cur.pts[1]=p;mkDraw()};
  cv.onpointerup=cv.onpointercancel=()=>{if(!MK.cur)return;const [a,b]=[MK.cur.pts[0],MK.cur.pts[MK.cur.pts.length-1]];
    if(Math.hypot(b[0]-a[0],b[1]-a[1])>8||MK.cur.pts.length>3)MK.shapes.push(MK.cur);MK.cur=null;mkDraw()}}
function mkTools(){document.querySelectorAll('[data-act="mktool"]').forEach(b=>b.classList.toggle("primary",b.dataset.t===MK.tool))}
function mkDraw(){
  const {ctx,cv,img}=MK;ctx.drawImage(img,0,0);
  const lw=Math.max(4,cv.width/180);
  MK.shapes.concat(MK.cur?[MK.cur]:[]).forEach(s=>{
    ctx.strokeStyle=s.c;ctx.lineWidth=lw;ctx.lineCap="round";ctx.lineJoin="round";ctx.beginPath();
    const [a,b]=[s.pts[0],s.pts[s.pts.length-1]];
    if(s.t==="pen"){s.pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.stroke()}
    else if(s.t==="circle"){ctx.ellipse((a[0]+b[0])/2,(a[1]+b[1])/2,Math.abs(b[0]-a[0])/2+1,Math.abs(b[1]-a[1])/2+1,0,0,Math.PI*2);ctx.stroke()}
    else{ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke();
      const ang=Math.atan2(b[1]-a[1],b[0]-a[0]),hl=lw*5;
      ctx.beginPath();ctx.moveTo(b[0],b[1]);ctx.lineTo(b[0]-hl*Math.cos(ang-0.45),b[1]-hl*Math.sin(ang-0.45));
      ctx.moveTo(b[0],b[1]);ctx.lineTo(b[0]-hl*Math.cos(ang+0.45),b[1]-hl*Math.sin(ang+0.45));ctx.stroke()}})}
async function mkSave(){
  if(!MK)return;const id=MK.id;
  if(!(await phGet("orig_"+id)))await phPut("orig_"+id,MK.img.src);
  MK.cur=null;mkDraw();await phPut(id,MK.cv.toDataURL("image/jpeg",.82));
  MK=null;closeSheet();render();toast(T('mk_saved'))}
async function mkRestore(){
  if(!MK)return;const id=MK.id,o=await phGet("orig_"+id);if(!o)return;
  await phPut(id,o);await phDel("orig_"+id);MK=null;closeSheet();render();toast(T('mk_restored'))}

/* ---------- קריאה מצילום (בינה עם ראייה) ---------- */
function shrinkDataUrl(src,max=1024,q=.82){return new Promise((res,rej)=>{const im=new Image();
  im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");
    c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext("2d").drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",q))};
  im.onerror=rej;im.src=src})}
async function aiVisionOnce(model,prompt,durl){
  const a=S.ai,b64d=durl.split(",")[1],fail=r=>{const e=new Error("HTTP "+r.status);e.status=r.status;return e};
  if(a.provider==="claude"){
    const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",
      headers:{"Content-Type":"application/json","x-api-key":a.key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
      body:JSON.stringify({model,max_tokens:600,messages:[{role:"user",content:[{type:"image",source:{type:"base64",media_type:"image/jpeg",data:b64d}},{type:"text",text:prompt}]}]})});
    if(!r.ok)throw fail(r);const d=await r.json();return (d.content||[]).filter(x=>x.type==="text").map(x=>x.text).join("\n")}
  if(a.provider==="gemini"){
    const r=await fetch("https://generativelanguage.googleapis.com/v1beta/models/"+encodeURIComponent(model)+":generateContent?key="+encodeURIComponent(a.key),
      {method:"POST",headers:{"Content-Type":"application/json"},
       body:JSON.stringify({contents:[{parts:[{inline_data:{mime_type:"image/jpeg",data:b64d}},{text:prompt}]}],generationConfig:{temperature:0,maxOutputTokens:600}})});
    if(!r.ok)throw fail(r);const d=await r.json();return d?.candidates?.[0]?.content?.parts?.[0]?.text||""}
  const url=a.url||"https://api.openai.com/v1/chat/completions",h={"Content-Type":"application/json"};if(a.key)h.Authorization="Bearer "+a.key;
  const r=await fetch(url,{method:"POST",headers:h,body:JSON.stringify({model,max_tokens:600,
    messages:[{role:"user",content:[{type:"text",text:prompt},{type:"image_url",image_url:{url:durl}}]}]})});
  if(!r.ok)throw fail(r);const d=await r.json();return d?.choices?.[0]?.message?.content||""}
async function aiVision(prompt,src){
  if(!aiConnected())throw new Error("NOKEY");
  const durl=await shrinkDataUrl(src);
  let chain=aiChain();if(!chain.length)chain=[S.ai.model||(S.ai.provider==="openai"?"gpt-4o":"")];
  let last;for(const m of chain){try{const out=await aiVisionOnce(m,prompt,durl);
      if(S.ai.okModel!==m){S.ai.okModel=m;saveAi()}return out}
    catch(e){last=e;if(e.status===401||e.status===403)break}}
  throw last||new Error("AI")}
async function readPlatePhoto(src){
  const r=S.cur;if(!r)return;

async function readLicencePhoto(){
  const r=S.cur;if(!r)return;
  const id=(r.photos.lic_veh||[])[0],src=id&&await phGet(id);
  if(!src){toast(T('lic_nophoto'));return}
  if(!aiConnected()){toast(T('vis_needkey'),5000);return}
  const t=toastKeep(T('lic_reading'));
  try{const out=await aiVision('This is a photo of an Israeli vehicle licence (רישיון רכב). Read it and reply ONLY with JSON: {"plate":"digits","vin":"","make":"","model":"","year":"","color":"","tires":"","engine":""}. Use "" for anything not clearly readable. Do not guess.',src);
    t.remove();const m=String(out).match(/\{[\s\S]*\}/);if(!m)throw new Error("format");
    const j=JSON.parse(m[0]),got=[],v=r.veh;
    const fill=(k,val,lbl)=>{val=String(val||"").trim();if(val&&!String(v[k]||"").trim()){v[k]=val;got.push(lbl)}};
    fill("plate",String(j.plate||"").replace(/\D/g,""),T('plate'));fill("vinLic",String(j.vin||"").toUpperCase().replace(/[^A-Z0-9]/g,""),T('vin'));
    fill("make",j.make,T('make'));fill("model",j.model,T('model'));fill("year",String(j.year||"").replace(/\D/g,""),T('year'));
    fill("colorLic",j.color,T('color'));fill("tireLic",j.tires,T('v_tires'));fill("engLic",j.engine,T('engno'));
    saveCur();render();toast(got.length?TF('lic_filled',{f:got.join(", ")}):T('lic_nothing'),4000)}
  catch(e){t.remove();toast(e.message==="NOKEY"?T('vis_needkey'):T('vis_fail'),4000)}}

      const txt=[T('sh_title')+" — "+(S.inst.name||T('draft')),
        T('plate')+": "+rec.veh.plate+"  |  "+rec.veh.make+" "+rec.veh.model+" "+rec.veh.year,
        T('insdate')+": "+dmy(rec.ins.date)+"  |  "+T('inspector')+": "+rec.ins.inspector,
        T('kind')+": "+kindName(rec.kind),
        "",c.bad?TF('sh_found',{n:c.bad})+"\n"+bad:T('sh_none'),
        c.safety?"\n"+T('sh_safety'):"",
        "\n"+T('sh_warranty'),
        T('sh_fullsep')].filter(x=>x!=="").join("\n");
      sheet(TF('sh_to',{x:ord.name||T('sh_customer')}),
        `<div class="tiny" style="white-space:pre-wrap;max-height:220px;overflow:auto;
          border:1px solid var(--line);border-radius:10px;padding:10px">${esc(txt)}</div>
         <div class="tiny" style="margin:8px 0">${esc(TF('sh_textonly',{x:T('pdf')}))}</div>
         <button class="btn solid" data-act="shwa" data-t="${esc(encodeURIComponent(txt))}"
           data-ph="${esc((ord.phone||"").replace(/\D/g,""))}">${esc(T('sh_wa'))}</button>
         <button class="btn" data-act="shmail" data-t="${esc(encodeURIComponent(txt))}"
           data-p="${esc(rec.veh.plate)}">${esc(T('sh_mail'))}</button>
         <button class="btn" data-act="shcopy" data-t="${esc(encodeURIComponent(txt))}">${esc(T('sh_copy'))}</button>`);
      break}
    case "shwa":{let ph=t.dataset.ph||"";
      if(ph.startsWith("0"))ph="972"+ph.slice(1);
      {const u="https://wa.me/"+ph+"?text="+t.dataset.t;
       /* באפליקציה מותקנת window.open יכול להחזיר null */
       const w=window.open(u,"_blank");if(!w)location.href=u}break}
    case "shmail":window.location.href="mailto:?subject="+encodeURIComponent(T('sh_title')+" "+t.dataset.p)+
      "&body="+t.dataset.t;break;
    case "shcopy":try{await navigator.clipboard.writeText(decodeURIComponent(t.dataset.t));toast(T('dg_copied'))}
      catch(e){toast(T('t_copyfail'))}break;
    case "recmenu":{const rec=S.recs.find(x=>x.id===t.dataset.id);if(!rec)break;
      sheet(rec.veh.plate||T('archive'),
        `<button class="btn primary" data-act="open" data-id="${esc(rec.id)}">${esc(T('edit'))}</button>
         <button class="btn danger" data-act="killrec" data-id="${esc(rec.id)}">${esc(T('del'))}</button>`);break}
    case "killrec":closeSheet();deleteRec(t.dataset.id);render();break;
    case "sheetclose":closeSheet();break;
  }
});
document.addEventListener("change",e=>{
  const el=e.target;
  if(el.dataset.p&&S.cur){setP(S.cur,el.dataset.p,el.value);saveCur();
    if(/vin|eng|color|tire|chassis/.test(el.dataset.p))render();return}
  if(el.dataset.chk&&S.cur){setP(S.cur,el.dataset.chk,el.checked);saveCur();return}
  if(el.dataset.act==="pick"&&S.cur){const d=dget(S.cur,+el.dataset.n);
    const v=el.dataset.v; if(el.checked){if(!d.items.includes(v))d.items.push(v);bumpFreq(v)}
    else d.items=d.items.filter(x=>x!==v); if(!d.st)d.st="bad"; saveCur();render();return}
  if(el.dataset.act==="propchk"){const p=PROPS[+el.dataset.i];if(p)p.checked=el.checked;
    const lab=el.closest(".ditem");if(lab)lab.classList.toggle("on",el.checked);
    const b=$("#propbtn");if(b&&S.cur)b.textContent=TF('pr_ins',{n:PROPS.filter(x=>x.checked&&!((S.cur.defects[x.n]||{}).st==="ns")).length});return}
  if(el.dataset.act==="propalt"){const p=PROPS[+el.dataset.i];if(p){const old=p.item;p.item=el.value;p.alts=[old].concat((p.alts||[]).filter(x=>x!==el.value))}return}
  if(el.dataset.act==="safety"&&S.cur){dget(S.cur,+el.dataset.n).safety=el.checked;saveCur();render();return}
  if(el.dataset.act==="edform"){edForm=el.value;edRow=null;render();return}
  if(el.dataset.act==="edscope"){const l=el.dataset.l,n=+el.dataset.n;
    const arr=S.scope[l];const i=arr.indexOf(n);
    if(el.checked&&i<0)arr.push(n); else if(!el.checked&&i>=0)arr.splice(i,1);
    arr.sort((a,b)=>a-b);saveMap();return}
  if(el.dataset.s){const p=el.dataset.s,v=el.value;
    if(p==="ai.provider"){const pv=AI_PROVIDERS[v];
      S.ai.provider=v;S.ai.model="";S.ai.okModel="";saveAi();render();return}
    if(p==="ai.key"){setAiKey(v.trim()).then(render);return}
    if(p.includes(".")){const[a,b]=p.split(".");S[a][b]=v;if(a==="ai")saveAi();else store.set(a,S[a])}
    else{S[p]=v;store.set(p,v)}
    render();return}
});
document.addEventListener("input",e=>{
  const el=e.target;
  if(el.dataset.act==="dq"){dq=el.value;const pos=el.selectionStart;render();
    const n=document.querySelector("[data-act=dq]");if(n){n.focus();n.setSelectionRange(pos,pos)}return}
  if(el.dataset.act==="aq"){aq=el.value;const pos=el.selectionStart;render();
    const n=document.querySelector("[data-act=aq]");if(n){n.focus();n.setSelectionRange(pos,pos)}return}
  if(el.dataset.act==="dnote"&&S.cur){dget(S.cur,+el.dataset.n).notes=el.value;saveCur();return}
});
let lpT=null;
document.addEventListener("pointerdown",e=>{const el=e.target.closest("[data-lp]");if(!el)return;
  lpT=setTimeout(()=>{lpT=null;
    const b=document.createElement("button");b.dataset.act="recmenu";b.dataset.id=el.dataset.lp;
    b.style.display="none";document.body.appendChild(b);b.click();b.remove()},600)});
["pointerup","pointermove","pointercancel","scroll"].forEach(ev=>
  document.addEventListener(ev,()=>{if(lpT){clearTimeout(lpT);lpT=null}},{passive:true}));
function dl(name,content,type){const b=new Blob([content],{type});const u=URL.createObjectURL(b);
  const a=document.createElement("a");a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)}
function sheet(title,html,closeLabel){const d=document.createElement("div");d.className="sheet";d.id="sheet";
  d.setAttribute("role","dialog");d.setAttribute("aria-modal","true");
  d.innerHTML=`<div class="inner"><h3>${esc(title)}</h3>${html}
    <button class="btn" data-act="sheetclose">${esc(closeLabel||T('close'))}</button></div>`;
  const born=Date.now();
  d.addEventListener("click",e=>{if(Date.now()-born<350){e.preventDefault();e.stopPropagation()}},true);
  d.onclick=e=>{if(e.target===d)closeSheet()};document.body.appendChild(d)}
function closeSheet(){const s=$("#sheet");if(s)s.remove();
  if(cfRes){const r=cfRes;cfRes=null;r(false)}}

/* ===================== התחלה ===================== */
S.map=store.get("map",null)||defaultMap();
if(!S.scope)S.scope=JSON.parse(JSON.stringify(SCOPE_DEF));
if(S.pin)S.locked=true;
if(!S.ai||typeof S.ai!=="object")S.ai={provider:"",key:"",url:"",model:""};
if(S.ai.enc)S.ai.key="";
applyChrome();render();
if(!S.locked)scheduleNotes();
loadAiKey().then(()=>{if(S.screen==="settings"&&!S.locked)render()}).catch(()=>{});
/* ברקע: המסך מטושטש; בחזרה אחרי הזמן שנקבע — נעילה */
let awayAt=0;
document.addEventListener("visibilitychange",()=>{
  if(document.hidden){awayAt=Date.now();flushUndo();if(S.pin)document.body.classList.add("away");return}
  document.body.classList.remove("away");
  if(S.pin&&!S.locked&&awayAt){
    const after=(typeof S.pin==="object"&&S.pin.after!=null)?S.pin.after:5;
    if(Date.now()-awayAt>=after*60000){closeSheet();pinBuf="";S.locked=true;render()}}
  awayAt=0});
window.addEventListener("pagehide",flushUndo);
if("serviceWorker" in navigator&&location.protocol!=="file:"){
  const had=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.register("sw.js").catch(()=>{});
  navigator.serviceWorker.addEventListener("controllerchange",()=>{
    if(had&&!S.updated){S.updated=true;if(S.screen==="home"&&!S.locked&&S.seen)render()}});
}
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
</script>
