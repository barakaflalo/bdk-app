<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0d0f">
<title>בדק — בדיקת רכב לפני קנייה</title>
<meta name="description" content="ניהול בדיקת רכב לצרכי קנייה ומכירה לפי הוראת נוהל 127">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{
  --gold:#c9a227; --gold-soft:#e6c85c;
  --bg:#0d0d0f; --bg2:#151518; --card:#17171b; --line:#2a2a31;
  --tx:#f2f2f4; --tx2:#a0a0ab; --tx3:#6c6c78;
  --ok:#3f9d5a; --bad:#d1483f; --warn:#d99a2b; --info:#3b7dd8;
  --r:14px; --pad:16px;
  --font:"Assistant","Heebo","Segoe UI",system-ui,-apple-system,"Noto Sans Hebrew",sans-serif;
}
[data-theme="blue"]{--gold:#4a90d9;--gold-soft:#7fb4ec;--bg:#0b1220;--bg2:#111b2e;--card:#131f35;--line:#24344f;}
[data-theme="green"]{--gold:#3fa66a;--gold-soft:#6fce97;--bg:#0a1310;--bg2:#0f1d17;--card:#12211b;--line:#20372c;}
[data-theme="steel"]{--gold:#8f9bb3;--gold-soft:#b9c3d6;--bg:#101114;--bg2:#181a1f;--card:#1b1d23;--line:#2d3038;}
[data-theme="rust"]{--gold:#c96f3f;--gold-soft:#e39366;--bg:#130f0d;--bg2:#1d1714;--card:#211a16;--line:#3a2c24;}

[data-mode="light"]{
  --bg:#f4f4f6; --bg2:#ffffff; --card:#ffffff; --line:#dcdce2;
  --tx:#16161a; --tx2:#5b5b66; --tx3:#8a8a95;
}
[data-mode="light"][data-theme="black"]{--gold:#8a6f10;--gold-soft:#a8891f;}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--tx);font-family:var(--font);font-size:16px;line-height:1.5}
body{padding-bottom:env(safe-area-inset-bottom)}
[dir="ltr"] body{text-align:left}
button,input,select,textarea{font-family:inherit;font-size:16px;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:var(--gold-soft)}

/* ---------- layout ---------- */
.wrap{max-width:760px;margin:0 auto;padding:0 var(--pad) 90px}
.topbar{position:sticky;top:0;z-index:40;background:var(--bg);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:10px;padding:12px var(--pad);max-width:760px;margin:0 auto}
.topbar h1{font-size:18px;margin:0;flex:1;font-weight:700;letter-spacing:-.2px}
.iconbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--bg2);
  display:grid;place-items:center;font-size:17px;color:var(--tx2);flex:none}
.iconbtn:active{background:var(--card)}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:var(--pad);margin:12px 0}
.card.tight{padding:12px}
.muted{color:var(--tx2);font-size:14px}
.tiny{color:var(--tx3);font-size:12.5px}
.sec{font-size:12.5px;letter-spacing:.08em;color:var(--tx3);text-transform:uppercase;margin:22px 0 8px}

/* ---------- buttons ---------- */
.btn{display:block;width:100%;padding:14px 16px;border-radius:12px;background:var(--bg2);
  border:1px solid var(--line);color:var(--tx);font-weight:600;text-align:center;margin:8px 0}
.btn:active{transform:scale(.985)}
.btn.primary{border:1.5px solid var(--gold);color:var(--gold-soft);background:transparent}
.btn.solid{background:var(--gold);color:#0d0d0f;border-color:var(--gold);font-weight:700}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.sm{width:auto;display:inline-block;padding:9px 14px;font-size:14px;margin:4px 4px 4px 0}
.row{display:flex;gap:8px}
.row>*{flex:1}

/* ---------- home ---------- */
.hero{padding:26px 0 6px}
.hero .mark{font-size:34px;font-weight:800;letter-spacing:-1px;color:var(--gold)}
.hero .sub{color:var(--tx2);font-size:14px;margin-top:2px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px 16px;text-align:start;
  display:flex;flex-direction:column;gap:6px;min-height:104px;justify-content:flex-end}
.tile .ic{font-size:24px;line-height:1}
.tile .t{font-weight:700;font-size:16px}
.tile .d{font-size:12.5px;color:var(--tx3)}
.tile.wide{grid-column:1/-1;min-height:auto;flex-direction:row;align-items:center;gap:12px;justify-content:flex-start}
.tile.go{border-color:var(--gold)}
.tile.go .t{color:var(--gold-soft)}

/* ---------- fields ---------- */
.f{margin:14px 0}
.f>label{display:block;font-size:13.5px;color:var(--tx2);margin-bottom:6px;font-weight:600}
.f input,.f select,.f textarea{width:100%;padding:12px;border-radius:10px;background:var(--bg2);
  border:1px solid var(--line);color:var(--tx)}
.f input:focus,.f select,.f textarea:focus{outline:2px solid var(--gold);outline-offset:1px}
.f textarea{min-height:88px;resize:vertical}
.f .hint{font-size:12px;color:var(--tx3);margin-top:4px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chk{display:flex;align-items:center;gap:10px;padding:10px 0}
.chk input{width:22px;height:22px;accent-color:var(--gold);flex:none}

/* dual field: license vs actual */
.dual{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--bg2)}
.dual .lbl{font-size:13.5px;font-weight:700;margin-bottom:8px}
.dual .pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dual .pair label{font-size:11.5px;color:var(--tx3);display:block;margin-bottom:4px}
.dual input{width:100%;padding:10px;border-radius:9px;background:var(--card);border:1px solid var(--line);color:var(--tx)}
.dual.mismatch{border-color:var(--bad)}
.dual .flag{margin-top:8px;font-size:12.5px;color:var(--bad);font-weight:600}
.dual.blocked{border-color:var(--bad);background:rgba(209,72,63,.07)}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 0;position:sticky;top:62px;background:var(--bg);z-index:30;
  border-bottom:1px solid var(--line);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:8px 13px;border-radius:20px;border:1px solid var(--line);background:var(--bg2);
  font-size:13.5px;color:var(--tx2);white-space:nowrap}
.tab.on{border-color:var(--gold);color:var(--gold-soft);background:transparent;font-weight:700}
.tab .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--bad);margin-inline-start:5px;vertical-align:middle}

/* ---------- defects ---------- */
.sysrow{border:1px solid var(--line);border-radius:12px;margin:8px 0;background:var(--card);overflow:hidden}
.sysrow>.head{display:flex;align-items:center;gap:10px;padding:13px 14px;width:100%;text-align:start}
.sysrow .num{font-size:11.5px;color:var(--tx3);min-width:20px;font-variant-numeric:tabular-nums}
.sysrow .nm{flex:1;font-weight:600;font-size:15px}
.pill{font-size:11.5px;padding:3px 9px;border-radius:20px;border:1px solid var(--line);color:var(--tx3);white-space:nowrap}
.pill.ok{color:var(--ok);border-color:var(--ok)}
.pill.bad{color:var(--bad);border-color:var(--bad)}
.pill.na{color:var(--tx3)}
.pill.rec{color:var(--info);border-color:var(--info)}
.sysrow.isbad{border-color:var(--bad)}
.sysrow.safety{border-color:var(--bad);box-shadow:inset 0 0 0 1px var(--bad)}
.sysbody{border-top:1px solid var(--line);padding:14px;background:var(--bg2)}
.statepick{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
.statepick button{padding:9px 4px;border-radius:9px;border:1px solid var(--line);font-size:12.5px;color:var(--tx2);background:var(--card)}
.statepick button.on{border-color:var(--gold);color:var(--gold-soft);font-weight:700}
.dsearch{width:100%;padding:11px;border-radius:10px;background:var(--card);border:1px solid var(--line);color:var(--tx);margin-bottom:8px}
.dlist{max-height:270px;overflow-y:auto;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.ditem{display:flex;align-items:flex-start;gap:9px;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.ditem:last-child{border-bottom:none}
.ditem input{margin-top:3px;width:18px;height:18px;accent-color:var(--gold);flex:none}
.ditem.on{background:rgba(201,162,39,.09)}
.ditem span{font-size:14px}
.dgroup{padding:7px 12px;font-size:11.5px;letter-spacing:.06em;color:var(--tx3);background:var(--bg2);
  border-bottom:1px solid var(--line);position:sticky;top:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:5px 10px;border-radius:20px;
  border:1px solid var(--gold);color:var(--gold-soft)}
.chip b{cursor:pointer;color:var(--tx3);font-weight:400}

/* photos */
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;margin-top:10px}
.ph{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--bg2)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .x{position:absolute;top:3px;inset-inline-end:3px;width:24px;height:24px;border-radius:50%;
  background:rgba(0,0,0,.65);color:#fff;font-size:14px;display:grid;place-items:center}
.ph.add{display:grid;place-items:center;border-style:dashed;color:var(--tx3);font-size:22px}
.ph .cap{position:absolute;bottom:0;inset-inline:0;background:rgba(0,0,0,.6);color:#fff;font-size:9.5px;padding:2px 4px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* misc */
.alert{border-radius:12px;padding:12px 14px;font-size:13.5px;margin:10px 0;border:1px solid}
.alert.bad{border-color:var(--bad);background:rgba(209,72,63,.08);color:#ff9c94}
.alert.warn{border-color:var(--warn);background:rgba(217,154,43,.08);color:#f0c274}
.alert.ok{border-color:var(--ok);background:rgba(63,157,90,.08);color:#8fdca6}
.alert.info{border-color:var(--info);background:rgba(59,125,216,.08);color:#9dc3f5}
[data-mode="light"] .alert.bad{color:#9c2f27}
[data-mode="light"] .alert.warn{color:#8a6113}
[data-mode="light"] .alert.ok{color:#256b3a}
[data-mode="light"] .alert.info{color:#1e5199}

.list .it{display:flex;align-items:center;gap:12px;padding:13px 14px;border:1px solid var(--line);
  border-radius:12px;margin:8px 0;background:var(--card);text-align:start;width:100%}
.list .it .main{flex:1;min-width:0}
.list .it .t{font-weight:600;font-size:15px}
.list .it .d{font-size:12.5px;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.empty{text-align:center;padding:44px 20px;color:var(--tx3)}
.empty .ic{font-size:38px;opacity:.5;margin-bottom:10px}

.sheet{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.6);display:flex;align-items:flex-end}
.sheet .inner{background:var(--bg2);border-radius:18px 18px 0 0;width:100%;max-width:760px;margin:0 auto;
  max-height:90vh;overflow-y:auto;padding:18px var(--pad) 28px;border-top:1px solid var(--line)}
.sheet h3{margin:0 0 12px;font-size:17px}

.sig{border:1px dashed var(--line);border-radius:10px;background:var(--bg2);touch-action:none;width:100%;height:150px;display:block}

.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat .b{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.stat .b .n{font-size:26px;font-weight:800;color:var(--gold-soft);font-variant-numeric:tabular-nums}
.stat .b .l{font-size:12.5px;color:var(--tx3)}

.toast{position:fixed;bottom:22px;inset-inline:0;margin:0 auto;width:max-content;max-width:88%;
  background:var(--card);border:1px solid var(--gold);color:var(--tx);padding:11px 18px;border-radius:24px;
  z-index:200;font-size:14px;box-shadow:0 8px 26px rgba(0,0,0,.4)}

.spin{width:18px;height:18px;border:2px solid var(--line);border-top-color:var(--gold);border-radius:50%;
  animation:sp .7s linear infinite;display:inline-block;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
.fade{animation:fd .18s ease}
@keyframes fd{from{opacity:0;transform:translateY(5px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- print ---------- */
#printarea{display:none}
@media print{
  body>*{display:none!important}
  #printarea{display:block!important;color:#000;background:#fff;font-size:10.5pt}
  @page{size:A4;margin:12mm}
}
#printarea .pform{font-family:var(--font)}
#printarea table{width:100%;border-collapse:collapse;margin-top:6px}
#printarea th,#printarea td{border:1px solid #000;padding:3px 5px;font-size:9pt;vertical-align:top}
#printarea th{background:#e8e8e8;font-size:8.5pt}
#printarea h2{font-size:13pt;margin:0 0 4px;text-align:center}
#printarea .banner{border:2px solid #000;padding:5px;text-align:center;font-weight:bold;font-size:11pt;margin-bottom:8px}
#printarea .draft{color:#b00;border-color:#b00}
#printarea .kv{font-size:9pt;line-height:1.7}
#printarea .notes{font-size:7.5pt;line-height:1.35;margin-top:8px}
#printarea .sigrow{display:flex;gap:14px;margin-top:14px;font-size:9pt}
#printarea .sigrow>div{flex:1;text-align:center}
#printarea .sigrow img{max-width:100%;height:52px;object-fit:contain;border-bottom:1px solid #000;display:block}
#printarea .pagebreak{page-break-before:always}
#printarea .pgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#printarea .pgrid figure{margin:0}
#printarea .pgrid img{width:100%;border:1px solid #000}
#printarea .pgrid figcaption{font-size:8pt;padding-top:2px}
#printarea .safety{border:2px solid #b00;color:#b00;padding:6px;font-weight:bold;margin:8px 0;font-size:10pt}
</style>
</head>
<body data-theme="black" data-mode="dark">
<div id="app"></div>
<div id="printarea"></div>
<input type="file" id="picker" accept="image/*" capture="environment" hidden>
<script>
/* =====================================================================
   בדק — נתוני נוהל 127 (נספח 5): נוסח האבחנות המחייב
   הטקסטים כאן הם לשון משרד התחבורה ואין לשנותם.
   ===================================================================== */
const D = {
engine:["בלאי פנימי גבוה","שריפות שמן ממובילי שסתומים","פולי מנוע זורק","מנוע שורף שמן","לחץ שמן נמוך","לחץ עוקה גבוה (מבלאי)","מנוע נכבה באיחור","צינור נשם מנותק","מנוע לפני שיפוץ","רטיבות שמן במסנן אויר","דליפות לחץ גבוהות בצילינדרים","מצתים רטובים בשמן","דליפות לחץ בינוניות בצילינדרים","הברגות פגומות בראש מנוע","לחץ דחיסה נמוך","מעבר לחץ למערכת קירור","לחץ דחיסה גבוה","הספק מנוע ירוד","לחץ דחיסה לא זהה","סימני דליפה בין ראש מנוע והבלוק","מנוע מצלצל","נוזל קירור בשמן","רעש מערכת שסתומים","סימני מים בנשם מנוע","רעש מערכת תזמון","סדק בגוף המנוע","רעש מערכת תזמון ושסתומים","פקקי מים פגומים","רעשים במנוע","נזילת מים מפקקי מים","רעשים ונקישות פנימיים","תושבות מנוע פגומות","רעש פנימי ממסבים","מדיד שמן פגום","נקישות גל זיזים","מעיכות אגן שמן","חוסר שמן במנוע","הלחמות בבלוק המנוע","נזילות שמן","חופש גל ארכובה"],

cooling:["נזילות מים ממצנן","ריקבון במצנן","רשת מצנן פגומה","מסגרת מצנן שבורה","מכסה מצנן פגום","מיכל עיבוי פגום","ניקוי מערכת הקירור","התחממות יתר במנוע","קורוזיה וסימני נזילה בחיבורים","נזילות מים","צינורות מים פגומים","פקקי מים נוזלים","נזילה ממשאבת מים","רעש ממשאבת מים","קורוזיה בית תרמוסטט","מערכת חימום לקויה","ברז מערכת חימום פגום","מאוורר פגום","מצמד מאוורר פגום","כונס אויר פגום","רצועה פגומה","שמן במים","קיים אויר במערכת הקירור","מערכת קירור לקויה"],

fuel:["תצרוכת דלק גבוהה","מאייד לא תקין","דוושת דלק נתפסת","כבל גז פגום","צינורות דלק פגומים","מעיכות במיכל הדלק","תיקונים במיכל הדלק","נזילה במיכל הדלק","מסנן אויר לקוי","ריח דלק בתא נוסעים","משנק לא תקין","משאבת דלק פגומה","סיבובי מנוע לא יציבים","חסר צינורות לחימום תערובת","מחשב מערכת דלק לא נבדק","מדגש טורבו לא תקין","הזרקת דלק לקויה","מערכת הזרקת דלק לא נבדקה","מגדש טורבו לא נבדק"],

/* --- IndexedDB for photos (blobs are far too big for localStorage) --- */
let _db=null;
function db(){return new Promise((res,rej)=>{
  if(_db)return res(_db);
  const r=indexedDB.open("bdk_photos",1);
  r.onupgradeneeded=e=>{const d=e.target.result;if(!d.objectStoreNames.contains("ph"))d.createObjectStore("ph")};
  r.onsuccess=e=>{_db=e.target.result;res(_db)}; r.onerror=()=>rej(r.error);
})}
async function phPut(id,dataUrl){const d=await db();return new Promise((res,rej)=>{
  const t=d.transaction("ph","readwrite");t.objectStore("ph").put(dataUrl,id);t.oncomplete=res;t.onerror=()=>rej(t.error)})}
async function phGet(id){const d=await db();return new Promise(res=>{
  const t=d.transaction("ph","readonly");const q=t.objectStore("ph").get(id);q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null)})}
async function phDel(id){const d=await db();return new Promise(res=>{
  const t=d.transaction("ph","readwrite");t.objectStore("ph").delete(id);t.oncomplete=res;t.onerror=res})}
async function phAll(ids){const out={};for(const i of ids)out[i]=await phGet(i);return out}

/* compress before storing — a raw phone photo is 4–8 MB */
function compress(file,max=1400,q=.72){return new Promise((res,rej)=>{
  const fr=new FileReader();
  fr.onload=()=>{const im=new Image();
    im.onload=()=>{let{width:w,height:h}=im;const s=Math.min(1,max/Math.max(w,h));
      const c=document.createElement("canvas");c.width=Math.round(w*s);c.height=Math.round(h*s);
      c.getContext("2d").drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",q))};
    im.onerror=rej;im.src=fr.result};
  fr.onerror=rej;fr.readAsDataURL(file)})}

function plateVariants(p){const c=String(p).replace(/\D/g,"");const v=[c];
  if(c.length===7)v.push("0"+c); else if(c.length===8&&c[0]==="0")v.push(c.slice(1)); return v}

async function lookupPlate(plate){
  const vars=plateVariants(plate); let veh=null,used=null;
  for(const p of vars){const r=await moFetch(RES.veh,{mispar_rechev:p},1);if(r.length){veh=r[0];used=p;break}}
  if(!veh)return null;
  let hist=[],recall=[];
  try{for(const p of vars)hist=hist.concat(await moFetch(RES.hist,{mispar_rechev:p},200))}catch(e){}
  try{for(const p of vars)recall=recall.concat(await moFetch(RES.recall,{mispar_rechev:p},20))}catch(e){}
  const kmH=hist.map(r=>({date:String(r.mivchan_acharon_dt||r.rishum_rishon_dt||"").split("T")[0],
      km:parseInt(String(r.kilometer_test_aharon||"").replace(/\D/g,""))||null}))
    .filter(x=>x.date||x.km).sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  const h0=hist[0]||{};
  const flags=[];
  if(hist.some(r=>String(r.shinui_mivne_ind||"").trim()==="1"))flags.push({lv:"bad",t:"שינוי מבנה רשום במאגר"});
  if(hist.some(r=>String(r.shnui_zeva_ind||"").trim()==="1"))flags.push({lv:"warn",t:"שינוי צבע רשום במאגר"});
  if(hist.some(r=>String(r.shinui_zmig_ind||"").trim()==="1"))flags.push({lv:"info",t:"שינוי מידות צמיגים רשום במאגר"});
  const mk=String(h0.mkoriut_nm||"").trim();
  if(mk&&!["","None","מקורי","חדש"].includes(mk))flags.push({lv:"warn",t:"מקוריות: "+mk});
  if(recall.length)flags.push({lv:"bad",t:"ריקול פתוח: "+recall.length});
  return {plate:used,
    make:veh.tozeret_nm||"",model:veh.kinuy_mishari||veh.degem_nm||"",year:veh.shnat_yitzur||"",
    vin:veh.misgeret||veh.mispar_shilda||"",color:veh.tzeva_rechev||"",vtype:veh.sug_degem||veh.sug_rechev||"",
    tireF:veh.zmig_kidmi||"",tireR:veh.zmig_ahori||"",fuel:veh.sug_delek_nm||"",
    engno:h0.mispar_manoa||"",lastKm:kmH.length?kmH[0].km:null,kmHistory:kmH.slice(0,12),
    flags,recalls:recall.map(r=>r.recall_description||r.recall_number||"").filter(Boolean).slice(0,5)}
}

/* ===================== מנוע התאמת אבחנות ===================== */
/* חינם: התאמת מילים. Pro: שכבת API עם ספק לבחירת המשתמש. */
function normalize(s){return String(s).replace(/[״"׳'.,()\/]/g," ").replace(/\s+/g," ").trim()}
const STOP=new Set(["של","עם","על","יש","אין","את","לא","כן","זה","היא","הוא","וגם","גם","או","ב","ל","מ","ה"]);
function ruleSuggest(text,pool){
  const words=normalize(text).split(" ").filter(w=>w.length>2&&!STOP.has(w));
  if(!words.length)return [];
  const scored=pool.map(item=>{
    const n=normalize(item);let sc=0;
    for(const w of words){
      if(n.includes(w))sc+=w.length>=4?3:2;
      else{const stem=w.slice(0,Math.max(3,w.length-2));if(stem.length>=3&&n.includes(stem))sc+=1}
    }
    return{item,sc}}).filter(x=>x.sc>0).sort((a,b)=>b.sc-a.sc);
  return scored.slice(0,6).map(x=>x.item);
}
async function aiCall(prompt){
  const a=S.ai;
  if(a.provider==="claude"){
    const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",
      headers:{"Content-Type":"application/json","x-api-key":a.key,"anthropic-version":"2023-06-01",
        "anthropic-dangerous-direct-browser-access":"true"},
      body:JSON.stringify({model:a.model||"claude-sonnet-4-6",max_tokens:800,messages:[{role:"user",content:prompt}]})});
    if(!r.ok)throw new Error("HTTP "+r.status);
    const d=await r.json();return (d.content&&d.content[0]&&d.content[0].text)||"";
  }
  if(a.provider==="gemini"){
    const r=await fetch("https://generativelanguage.googleapis.com/v1beta/models/"+(a.model||"gemini-2.5-flash")+":generateContent?key="+a.key,
      {method:"POST",headers:{"Content-Type":"application/json"},
       body:JSON.stringify({contents:[{parts:[{text:prompt}]}],generationConfig:{temperature:.2,maxOutputTokens:800}})});
    if(!r.ok)throw new Error("HTTP "+r.status);
    const d=await r.json();return d?.candidates?.[0]?.content?.parts?.[0]?.text||"";
  }
  /* openai / local (ollama, lm studio) / custom — כולם תואמי OpenAI */
  const url=a.url||"https://api.openai.com/v1/chat/completions";
  const h={"Content-Type":"application/json"}; if(a.key)h.Authorization="Bearer "+a.key;
  const r=await fetch(url,{method:"POST",headers:h,
    body:JSON.stringify({model:a.model||"gpt-4o-mini",max_tokens:800,messages:[{role:"user",content:prompt}]})});
  if(!r.ok)throw new Error("HTTP "+r.status);
  const d=await r.json();return d?.choices?.[0]?.message?.content||"";
}
/* הבינה בוחרת מתוך הרשימה הסגורה — לעולם לא מנסחת אבחנה חדשה */
async function aiSuggest(text,pool){
  if(!S.ai.provider||(!S.ai.key&&!S.ai.url))return ruleSuggest(text,pool);
  const numbered=pool.map((x,i)=>(i+1)+". "+x).join("\n");
  const prompt="אתה עוזר לבוחן רכב בישראל. להלן רשימה סגורה וממוספרת של אבחנות מתוך נספח 5 להוראת נוהל 127 של משרד התחבורה.\n\n"+
    numbered+"\n\nתיאור הבוחן: \""+text+"\"\n\nבחר עד 6 מספרים מהרשימה שמתאימים לתיאור, לפי סדר התאמה יורד. "+
    "החזר אך ורק את המספרים מופרדים בפסיקים, בלי טקסט נוסף. אם שום פריט לא מתאים — החזר ריק. "+
    "אל תמציא ניסוח חדש ואל תחזיר פריט שאינו ברשימה.";
  try{
    const out=await aiCall(prompt);
    const idx=(out.match(/\d+/g)||[]).map(n=>parseInt(n)-1).filter(i=>i>=0&&i<pool.length);
    const uniq=[...new Set(idx)].slice(0,6).map(i=>pool[i]);
    return uniq.length?uniq:ruleSuggest(text,pool);
  }catch(e){toast("הבינה לא זמינה — עברתי למנוע החוקים");return ruleSuggest(text,pool)}
}

function defaultMap(){
  const cp=o=>JSON.parse(JSON.stringify(o)), m={full:{},basic:{}};
  [["full",FORM_FULL],["basic",FORM_BASIC]].forEach(([k,F])=>F.forEach(row=>{

const SCOPE_DEF={engine:[1,2,3,4,5,6,7,8,9,20,24,25],chassis:[22,25]};

function formKey(){return (S.cur&&S.cur.kind==="basic")?"basic":"full"}
function form(){return formKey()==="basic"?FORM_BASIC:FORM_FULL}
function limited(rec){const k=(rec||S.cur||{}).kind;return k==="engine"||k==="chassis"?k:null}
function inScope(rec,n){const l=limited(rec);return !l||(S.scope[l]||[]).includes(n)}
function nsText(rec){const l=limited(rec);return l?T(l==="engine"?"ns_engine":"ns_chassis"):T("st_ns")}
function applyScope(rec){
  const l=limited(rec); if(!l)return;
  form().forEach(row=>{const d=dget(rec,row.n);
    if(!inScope(rec,row.n)){d.st="ns";d.items=[];d.safety=false}
    else if(d.st==="ns")d.st="";
  });
}
function mapEntry(row){const m=(S.map&&S.map[formKey()])||{};return m[row.n]||{type:"flat",items:[]}}
function poolFor(row,rec){
  const e=mapEntry(row);
  if(e.type==="chassis"){const c=e[(rec||S.cur).veh.chassis==="separate"?"separate":"body"]||{};
    return{grouped:{"משמעות גבוהה":c.high||[],"משמעות נמוכה":c.low||[],"ליקויים שוליים":c.minor||[]}}}
  if(e.type==="groups")return{grouped:e.groups||{}};
  return{flat:e.items||[]}
}
function flatPool(row,rec){const p=poolFor(row,rec);return p.flat?p.flat:Object.values(p.grouped).flat()}
function dget(rec,n){if(!rec.defects[n])rec.defects[n]={st:"",items:[],notes:"",safety:false,photos:[]};return rec.defects[n]}
function saveCur(){if(!S.cur)return;S.cur.updated=Date.now();
  const i=S.recs.findIndex(r=>r.id===S.cur.id);
  if(i<0)S.recs.unshift(S.cur);else S.recs[i]=S.cur; persist()}
function counts(rec){let ok=0,bad=0,na=0,rec_=0,ns=0,safety=0,done=0,total=0;
  form().forEach(row=>{if(row.notesonly)return;const d=rec.defects[row.n];
    if(d&&d.st==="ns"){ns++;return}
    total++; if(!d||!d.st)return; done++;
    if(d.st==="ok")ok++;else if(d.st==="bad"){bad++;if(d.safety)safety++}else if(d.st==="na")na++;else rec_++});
  return{ok,bad,na,rec:rec_,ns,safety,done,total}}
function score(rec){const c=counts(rec);if(!c.done)return null;
  return Math.max(0,Math.min(100,Math.round(100-c.bad*6-c.safety*10)))}

/* ---------- כרית חתימה ---------- */
function sigPad(cv,onEnd,existing){
  if(!cv)return; const r=cv.getBoundingClientRect();
  cv.width=Math.max(1,r.width*2);cv.height=Math.max(1,r.height*2);
  const c=cv.getContext&&cv.getContext("2d"); if(!c){cv._clear=()=>{};return}
  c.scale(2,2);c.lineWidth=2;c.lineCap="round";
  c.strokeStyle=getComputedStyle(document.body).getPropertyValue("--tx").trim()||"#fff";
  if(existing){const im=new Image();im.onload=()=>c.drawImage(im,0,0,r.width,r.height);im.src=existing}
  let dr=false;
  const pt=e=>{const b=cv.getBoundingClientRect();const t=e.touches?e.touches[0]:e;
    return[t.clientX-b.left,t.clientY-b.top]};
  const down=e=>{e.preventDefault();dr=true;const[x,y]=pt(e);c.beginPath();c.moveTo(x,y)};
  const move=e=>{if(!dr)return;e.preventDefault();const[x,y]=pt(e);c.lineTo(x,y);c.stroke()};
  const up=()=>{if(!dr)return;dr=false;onEnd&&onEnd(cv.toDataURL("image/png"))};
  cv.onpointerdown=down;cv.onpointermove=move;cv.onpointerup=up;cv.onpointerleave=up;
  cv._clear=()=>{c.clearRect(0,0,cv.width,cv.height);onEnd&&onEnd(null)};
}

let edForm="full",edRow=null;
const SEV={high:"משמעות גבוהה",low:"משמעות נמוכה",minor:"ליקויים שוליים"};
function rowsOf(f){return f==="basic"?FORM_BASIC:FORM_FULL}
function buckets(f,n){
  const e=(S.map[f]||{})[n]; if(!e)return [];
  if(e.type==="flat")return[{path:["items"],label:"",items:e.items}];
  if(e.type==="groups")return Object.keys(e.groups).map(g=>({path:["groups",g],label:g,items:e.groups[g]}));
  const out=[];
  ["body","separate"].forEach(ct=>["high","low","minor"].forEach(sv=>{
    if(e[ct]&&e[ct][sv])out.push({path:[ct,sv],label:(ct==="body"?"שלדת מרכב":"שלדה נפרדת")+" · "+SEV[sv],items:e[ct][sv]})}));
  return out;
}
function bucketAt(f,n,path){return path.reduce((a,k)=>a[k],S.map[f][n])}

async function buildPrint(){
  const r=S.cur,rows=form(),c=counts(r);
  const ord=r.orderer==="seller"?r.seller:r.buyer;
  const official=!!S.inst.lic;
  const ph=await phAll([...new Set([].concat(...Object.values(r.photos||{}),
    ...rows.map(x=>(r.defects[x.n]||{}).photos||[]).flat()))]);
  const tr=rows.filter(x=>!x.notesonly).map(x=>{const d=r.defects[x.n]||{};
    const diag=d.st==="ns"?nsText(r):
      d.st==="na"?"המערכת לא קיימת ברכב זה":
      d.st==="rec"?(d.notes?"המלצה: "+d.notes:"המלצה"):
      (d.items||[]).join("; ");
    return `<tr><td style="text-align:center">${x.n}</td><td>${esc(x.t)}</td>
      <td style="text-align:center">${d.st==="ok"?"✔":""}</td>
      <td style="text-align:center">${d.st==="bad"?"✔":""}</td>
      <td>${esc(diag)}</td></tr>`}).join("");
  const gen=rows.find(x=>x.notesonly),gd=gen?(r.defects[gen.n]||{}):{};
  const genTxt=[...(gd.items||[]),gd.notes||"",
    (r.veh.engLic&&r.veh.engAct&&r.veh.engLic!==r.veh.engAct)?"אי-התאמה במספר המנוע בין הרשום ברישיון לבין המוטבע ברכב":"",
    (r.veh.colorLic&&r.veh.colorAct&&r.veh.colorLic!==r.veh.colorAct)?"אי-התאמה בצבע הרכב לעומת הרשום ברישיון":"",
    (r.veh.tireLic&&r.veh.tireAct&&r.veh.tireLic!==r.veh.tireAct)?"אי-התאמה במידות הצמיגים לעומת הרשום ברישיון":""
  ].filter(Boolean).join(" · ");
  const safeties=rows.filter(x=>(r.defects[x.n]||{}).safety)
    .map(x=>x.t+": "+((r.defects[x.n].items||[]).join("; "))).join(" | ");
  const notes=["הממצאים המחייבים את מכון הבדיקה הם המפורטים בכתב בטופס זה בכפוף לתוצאות הבדיקה.",

   "אחריות מכון הבדיקה היא על המכללים שנבדקו והמצוינים בטופס בלבד.",
   "האחריות על תוצאות הבדיקה היא לשלושה חודשים או 6,000 ק״מ, לפי המוקדם.",
   "צילום רישיון הרכב ורישיון הנהיגה שהוצגו בעת הבדיקה נשמרים יחד עם הטופס למשך 24 חודשים.",
   "מזמין הבדיקה מאשר שקרא והובאו לידיעתו הממצאים הרשומים בטופס זה.",
   "בעת העברת בעלות מומלץ לוודא שמספרי המנוע והשלדה ברישיון תואמים לרשום בטופס זה."];
  const photoPages=PHOTO_GROUPS.map(g=>{
    const inner=g.slots.map(sl=>(r.photos[sl.k]||[]).map(id=>ph[id]
      ?`<figure><img src="${ph[id]}"><figcaption>${esc(sl.t)}</figcaption></figure>`:"").join("")).join("");
    return inner.trim()?`<h3 style="font-size:11pt;margin:10px 0 4px">${esc(T(g.t))}</h3>
      <div class="pgrid">${inner}</div>`:""}).join("");
  const defPages=rows.map(x=>{const d=r.defects[x.n]||{};

    return `<div style="margin:8px 0"><b>${x.n}. ${esc(x.t)}</b>${d.notes?`<div>${esc(d.notes)}</div>`:""}

    ${safeties?`<div class="safety">ליקוי בטיחותי אשר עלול לסכן עוברי דרך: ${esc(safeties)}</div>`:""}

      <th style="width:40px">לא תקין</th><th style="width:44%">האבחנה</th></tr></thead><tbody>${tr}
      <tr><td style="text-align:center">${gen?gen.n:""}</td><td>הערות כלליות</td><td></td><td></td>
      <td>${esc(genTxt)}</td></tr></tbody></table>
    <div class="notes">${notes.map((t,i)=>`${i+1}. ${esc(t)}`).join("<br>")}</div>
    <div class="kv" style="margin-top:8px">אני הח״מ ${esc(r.ins.inspector)}, בודק רכב בעל מס׳ תעודה ${esc(r.ins.cert)},

      ${r.ins.roadtest?"וביצעתי מבחן דרך ברכב":"<b>ללא מבחן דרך</b>"}.</div>
    <div class="sigrow">
      <div>${r.sigOrd?`<img src="${r.sigOrd}">`:"<div style='border-bottom:1px solid #000;height:52px'></div>"}

      <div>${r.sigIns?`<img src="${r.sigIns}">`:"<div style='border-bottom:1px solid #000;height:52px'></div>"}

let pickTarget=null;
$("#picker").addEventListener("change",async e=>{
  const f=e.target.files&&e.target.files[0]; e.target.value="";
  if(!f||!pickTarget)return;
  let data; try{data=await compress(f)}catch(err){return toast("הצילום נכשל")}
  const t=pickTarget; pickTarget=null;
  if(t.kind==="gate"){gate[t.k]=data;return render()}
  const id=uid(); await phPut(id,data);
  if(t.kind==="slot"){(S.cur.photos[t.slot]=S.cur.photos[t.slot]||[]).push(id)}
  else{const d=dget(S.cur,t.n);d.photos.push(id)}
  saveCur();render();
});
function pick(target){pickTarget=target;$("#picker").click()}

document.addEventListener("click",async e=>{
  const t=e.target.closest("[data-act]"); if(!t)return;
  const a=t.dataset.act, r=S.cur;
  switch(a){
    case "home":home();break;
    case "settings":go("settings");break;
    case "archive":go("archive");break;
    case "diary":go("diary");break;
    case "dash":go("dash");break;
    case "theme":{const o=["black","blue","green","steel","rust"];
      S.theme=o[(o.indexOf(S.theme)+1)%o.length];store.set("theme",S.theme);applyChrome();break}
    case "langmenu":{const ks=Object.keys(LANG);S.lang=ks[(ks.indexOf(S.lang)+1)%ks.length];
      store.set("lang",S.lang);render();break}
    case "new":gate={kind:"full",lic:null,drv:null,sig:null};go("gate");break;
    case "gph":pick({kind:"gate",k:t.dataset.k});break;
    case "gsigclear":{const g=$("#gsig");if(g&&g._clear)g._clear();gate.sig=null;break}
    case "gstart":{
      if(!gate.lic||!gate.drv)return toast("נדרשים שני הצילומים");
      if(!gate.sig)return toast("נדרשת חתימת מזמין הבדיקה");
      const rec=startRec(gate.kind);rec.decl=true;
      const a1=uid(),a2=uid();await phPut(a1,gate.lic);await phPut(a2,gate.drv);
      rec.photos.lic_veh=[a1];rec.photos.lic_drv=[a2];rec.sigOrd=gate.sig;
      S.cur=rec;S.tab=0;saveCur();go("rec",rec);break}
    case "open":{const rec=S.recs.find(x=>x.id===t.dataset.id);if(rec){S.tab=0;go("rec",rec)}break}
    case "tab":S.tab=+t.dataset.i;openRow=null;dq="";render();break;
    case "sys":{const n=+t.dataset.n;openRow=openRow===n?null:n;dq="";render();break}
    case "st":{const d=dget(r,+t.dataset.n);d.st=d.st===t.dataset.s?"":t.dataset.s;
      if(d.st!=="bad"){d.items=[];d.safety=false}saveCur();render();break}
    case "unpick":{const d=dget(r,+t.dataset.n);d.items=d.items.filter(x=>x!==t.dataset.v);saveCur();render();break}
    case "safety":break;
    case "dphoto":pick({kind:"def",n:+t.dataset.n});break;
    case "dphdel":{const d=dget(r,+t.dataset.n);d.photos=d.photos.filter(x=>x!==t.dataset.id);
      await phDel(t.dataset.id);saveCur();render();break}
    case "phadd":pick({kind:"slot",slot:t.dataset.slot});break;
    case "phdel":{e.stopPropagation();const s=t.dataset.slot;
      r.photos[s]=(r.photos[s]||[]).filter(x=>x!==t.dataset.id);await phDel(t.dataset.id);saveCur();render();break}
    case "aisug":{const n=+t.dataset.n,row=form().find(x=>x.n===n),d=dget(r,n);
      if(!d.notes.trim())return toast("כתוב תיאור חופשי ואז לחץ");
      t.innerHTML='<span class="spin"></span>';
      const sug=await aiSuggest(d.notes,flatPool(row,r));
      if(!sug.length){render();return toast("לא נמצאה אבחנה מתאימה")}
      sheet("אבחנות מוצעות",`<div class="tiny">בחר מה להוסיף. הניסוח קבוע לפי נספח 5.</div>
        <div class="dlist" style="margin-top:10px">${sug.map(x=>`<label class="ditem">
        <input type="checkbox" data-sug="${esc(x)}" checked><span>${esc(x)}</span></label>`).join("")}</div>
        <button class="btn solid" data-act="sugok" data-n="${n}">${esc(T('add'))}</button>`);
      break}
    case "sugok":{const n=+t.dataset.n,d=dget(r,n);
      document.querySelectorAll("[data-sug]:checked").forEach(i=>{
        if(!d.items.includes(i.dataset.sug))d.items.push(i.dataset.sug)});
      if(!d.st)d.st="bad"; saveCur();closeSheet();render();break}
    case "lookup":{
      const p=(r.veh.plate||"").replace(/\D/g,""); if(!p)return toast(T('e_noplate'));
      t.innerHTML='<span class="spin"></span> '+T('fetching');
      try{
        const m=await lookupPlate(p);
        if(!m){render();return toast(T('e_notfound'))}
        r.mo=m; r.veh.plate=m.plate;
        r.veh.make=r.veh.make||m.make; r.veh.model=r.veh.model||m.model;
        r.veh.year=r.veh.year||m.year; r.veh.vtype=r.veh.vtype||m.vtype;
        r.veh.vinLic=r.veh.vinLic||m.vin; r.veh.engLic=r.veh.engLic||m.engno;
        r.veh.colorLic=r.veh.colorLic||m.color;
        r.veh.tireLic=r.veh.tireLic||[m.tireF,m.tireR].filter(Boolean).join(" / ");
        saveCur();render();toast("הנתונים נטענו — השלם את עמודת ״נמצא בפועל״");
      }catch(err){render();toast(T('e_net'))}
      break}
    case "motest":{const o=$("#motestout");o.innerHTML='<span class="spin"></span> בודק…';
      try{const rec=await moFetch(RES.veh,{mispar_rechev:"1"},1);
        o.innerHTML='<span style="color:var(--ok)">✔ החיבור עובד. השליפה האוטומטית זמינה.</span>'}
      catch(err){o.innerHTML='<span style="color:var(--bad)">✕ הפנייה הישירה נחסמה ('+esc(err.message)+
        '). הזן כתובת proxy או המשך במילוי ידני.</span>'}
      break}
    case "sigclear":{const cv=$(t.dataset.w==="1"?"#sig1":"#sig2");if(cv&&cv._clear)cv._clear();
      if(t.dataset.w==="1")r.sigIns=null;else r.sigOrd=null;saveCur();break}
    case "print":await buildPrint();setTimeout(()=>window.print(),120);break;
    case "finish":r.status=r.status==="done"?"open":"done";saveCur();render();
      toast(r.status==="done"?"הבדיקה נסגרה":"הבדיקה נפתחה מחדש");break;
    case "delrec":if(confirm(T('confirm'))){S.recs=S.recs.filter(x=>x.id!==r.id);persist();home();toast(T('deleted'))}break;
    case "apptnew":{
      sheet(T('add'),`<div class="f"><label>${esc(T('plate'))}</label><input id="ap"></div>
        <div class="f"><label>${esc(T('name'))}</label><input id="an"></div>
        <div class="f2"><div class="f"><label>${esc(T('insdate'))}</label><input id="ad" type="date" value="${today()}"></div>
        <div class="f"><label>${esc(T('instime'))}</label><input id="at" type="time" value="09:00"></div></div>
        <div class="f"><label>${esc(T('kind'))}</label><select id="ak">
          <option value="full">${esc(T('kind_full'))}</option><option value="basic">${esc(T('kind_basic'))}</option></select></div>
        <button class="btn solid" data-act="apptsave">${esc(T('save'))}</button>`);break}
    case "apptsave":{S.appts.push({id:uid(),plate:$("#ap").value,name:$("#an").value,
      date:$("#ad").value,time:$("#at").value,kind:$("#ak").value});persist();closeSheet();render();break}
    case "apptdel":S.appts=S.appts.filter(x=>x.id!==t.dataset.id);persist();render();break;
    case "apptgo":{const ap=S.appts.find(x=>x.id===t.dataset.id);
      gate={kind:ap.kind,lic:null,drv:null,sig:null};go("gate");break}
    case "export":{const data={v:1,exported:new Date().toISOString(),user:S.user,inst:S.inst,
        recs:S.recs,appts:S.appts,km:S.km};
      dl("bdk-backup-"+today()+".json",JSON.stringify(data),"application/json");break}
    case "csv":{const rows=[["מספר רכב","תאריך","תוצר","דגם","סוג בדיקה","ליקויים","בטיחותי","מזמין","סכום","בודק"]];
      S.recs.forEach(x=>{const c=counts(x);rows.push([x.veh.plate,x.ins.date,x.veh.make,x.veh.model,
        x.kind==="full"?"מלאה":"ללא אלקטרוניקה",c.bad,c.safety,(x.orderer==="seller"?x.seller:x.buyer).name,
        x.pay.amount,x.ins.inspector])});
      dl("bdk-"+today()+".csv","\uFEFF"+rows.map(r=>r.map(v=>'"'+String(v==null?"":v).replace(/"/g,'""')+'"').join(",")).join("\n"),"text/csv");break}
    case "import":{const i=document.createElement("input");i.type="file";i.accept=".json";
      i.onchange=()=>{const f=i.files[0];const fr=new FileReader();
        fr.onload=()=>{try{const d=JSON.parse(fr.result);
          if(!confirm("השחזור יחליף את כל הנתונים הקיימים. להמשיך?"))return;
          S.recs=d.recs||[];S.appts=d.appts||[];S.km=d.km||{};
          if(d.user)S.user=d.user;if(d.inst)S.inst=d.inst;
          store.set("user",S.user);store.set("inst",S.inst);persist();render();toast("שוחזר")}
          catch(e){toast("הקובץ אינו תקין")}};
        fr.readAsText(f)};i.click();break}
    case "wipe":if(confirm("למחוק את כל הבדיקות, ההזמנות והצילומים? אין דרך חזרה.")){
      if(confirm("אישור אחרון — ייצאת גיבוי?")){
        S.recs=[];S.appts=[];persist();indexedDB.deleteDatabase("bdk_photos");_db=null;home();toast(T('deleted'))}}break;
    case "editor":go("editor");break;
    case "phtab":phTab=t.dataset.k;render();break;
    case "unlock":{const d=dget(r,+t.dataset.n);d.st="";saveCur();render();break}
    case "edrow":{const n=+t.dataset.n;edRow=edRow===n?null:n;render();break}
    case "edscope":break;
    case "edup":case "eddown":{const n=+t.dataset.n,arr=bucketAt(edForm,n,t.dataset.p.split(">")),
        i=+t.dataset.i,j=a==="edup"?i-1:i+1;
      if(j<0||j>=arr.length)break;
      [arr[i],arr[j]]=[arr[j],arr[i]];saveMap();render();break}
    case "eddel":{const arr=bucketAt(edForm,+t.dataset.n,t.dataset.p.split(">"));
      arr.splice(+t.dataset.i,1);saveMap();render();break}
    case "edadd":{const n=+t.dataset.n,path=t.dataset.p.split(">");
      const el=document.getElementById("add_"+n+"_"+path.join("_"));
      const v=(el&&el.value||"").trim(); if(!v)break;
      bucketAt(edForm,n,path).push(v);saveMap();render();break}
    case "edmove":{const n=+t.dataset.n,path=t.dataset.p.split(">"),i=+t.dataset.i;
      const item=bucketAt(edForm,n,path)[i];
      const opts=rowsOf(edForm).flatMap(row=>buckets(edForm,row.n).map(b=>
        `<option value="${esc(row.n+"|"+b.path.join(">"))}">${esc(row.n+". "+row.t+(b.label?" · "+b.label:""))}</option>`)).join("");
      sheet(T('moveto'),`<div class="tiny">${esc(item)}</div>
        <div class="f"><select id="mvsel">${opts}</select></div>
        <button class="btn solid" data-act="edmoveok" data-n="${n}" data-p="${esc(path.join(">"))}"
          data-i="${i}">${esc(T('moveto'))}</button>`);
      break}
    case "edmoveok":{const n=+t.dataset.n,path=t.dataset.p.split(">"),i=+t.dataset.i;
      const v=($("#mvsel")||{}).value||"";if(!v)break;
      const [tn,tp]=v.split("|");
      const src=bucketAt(edForm,n,path),item=src.splice(i,1)[0];
      bucketAt(edForm,+tn,tp.split(">")).push(item);
      saveMap();closeSheet();render();toast("הועבר");break}
    case "edform":break;
    case "edexport":dl("bdk-lists-"+today()+".json",JSON.stringify({v:1,map:S.map,scope:S.scope}),"application/json");break;
    case "edimport":{const inp=document.createElement("input");inp.type="file";inp.accept=".json";
      inp.onchange=()=>{const fr=new FileReader();fr.onload=()=>{try{const d=JSON.parse(fr.result);
        if(!d.map)return toast("הקובץ אינו קובץ רשימות");
        S.map=d.map;if(d.scope)S.scope=d.scope;saveMap();render();toast("יובא")}
        catch(e){toast("הקובץ אינו תקין")}};fr.readAsText(inp.files[0])};inp.click();break}
    case "edreset":if(confirm("לאפס את כל רשימות הליקויים לברירת המחדל של נספח 5?")){
      S.map=defaultMap();S.scope=JSON.parse(JSON.stringify(SCOPE_DEF));saveMap();render();toast("אופס")}break;
    case "sheetclose":closeSheet();break;
  }
});
document.addEventListener("change",e=>{
  const el=e.target;
  if(el.dataset.p&&S.cur){setP(S.cur,el.dataset.p,el.value);saveCur();
    if(/vin|eng|color|tire|chassis/.test(el.dataset.p))render();return}
  if(el.dataset.chk&&S.cur){setP(S.cur,el.dataset.chk,el.checked);saveCur();return}
  if(el.dataset.act==="pick"&&S.cur){const d=dget(S.cur,+el.dataset.n);
    const v=el.dataset.v; if(el.checked){if(!d.items.includes(v))d.items.push(v)}
    else d.items=d.items.filter(x=>x!==v); if(!d.st)d.st="bad"; saveCur();render();return}
  if(el.dataset.act==="safety"&&S.cur){dget(S.cur,+el.dataset.n).safety=el.checked;saveCur();render();return}
  if(el.dataset.act==="edform"){edForm=el.value;edRow=null;render();return}
  if(el.dataset.act==="edscope"){const l=el.dataset.l,n=+el.dataset.n;
    const arr=S.scope[l];const i=arr.indexOf(n);
    if(el.checked&&i<0)arr.push(n); else if(!el.checked&&i>=0)arr.splice(i,1);
    arr.sort((a,b)=>a-b);saveMap();return}
  if(el.dataset.s){const p=el.dataset.s,v=el.value;
    if(p.includes(".")){const[a,b]=p.split(".");S[a][b]=v;store.set(a,S[a])}
    else{S[p]=v;store.set(p,v)}
    render();return}
});
document.addEventListener("input",e=>{
  const el=e.target;
  if(el.dataset.act==="dq"){dq=el.value;const pos=el.selectionStart;render();
    const n=document.querySelector("[data-act=dq]");if(n){n.focus();n.setSelectionRange(pos,pos)}return}
  if(el.dataset.act==="aq"){aq=el.value;const pos=el.selectionStart;render();
    const n=document.querySelector("[data-act=aq]");if(n){n.focus();n.setSelectionRange(pos,pos)}return}
  if(el.dataset.act==="dnote"&&S.cur){dget(S.cur,+el.dataset.n).notes=el.value;saveCur();return}
});
function dl(name,content,type){const b=new Blob([content],{type});const u=URL.createObjectURL(b);
  const a=document.createElement("a");a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)}
function sheet(title,html){const d=document.createElement("div");d.className="sheet";d.id="sheet";
  d.innerHTML=`<div class="inner"><h3>${esc(title)}</h3>${html}
    <button class="btn" data-act="sheetclose">${esc(T('close'))}</button></div>`;
  d.onclick=e=>{if(e.target===d)closeSheet()};document.body.appendChild(d)}
function closeSheet(){const s=$("#sheet");if(s)s.remove()}

/* ===================== התחלה ===================== */
S.map=store.get("map",null)||defaultMap();
if(!S.scope)S.scope=JSON.parse(JSON.stringify(SCOPE_DEF));
applyChrome();render();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
